<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="900px" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">模型选择路径，程序维护必须成立的执行条件</title><desc id="desc">提出、判断、授权、执行分别拥有不同来源的依据</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">模型选择路径，程序维护必须成立的执行条件</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">提出、判断、授权、执行分别拥有不同来源的依据</text><rect x="45" y="135" width="1350" height="160" rx="14" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="70" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#426B9A">模型职责：在证据与目标内提出候选</text><text x="70" y="220" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="400" fill="#24364B">选择调查方向 · 解释候选原因 · 识别证据缺口 · 建议计划修订</text><text x="70" y="258" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">模型输出进入候选区，不直接改变权限、资源范围或验收标准。</text><line x1="720" y1="295" x2="720" y2="355" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><text x="740" y="335" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#426B9A">结构化候选</text><rect x="45" y="365" width="1350" height="305" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="399" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">程序职责：检查契约并承担执行责任</text><rect x="80" y="485" width="275" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="217.5" y="516" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">计划编译</text><text x="217.5" y="542" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">类型 / 依赖 / 范围</text><rect x="415" y="485" width="275" height="105" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="552.5" y="516" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">策略门禁</text><text x="552.5" y="542" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">身份 / 审批 / 预算</text><rect x="750" y="485" width="275" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="887.5" y="516" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">受控执行器</text><text x="887.5" y="542" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">注册能力 / 稳定操作身份</text><rect x="1085" y="485" width="275" height="105" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1222.5" y="516" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">验收与状态推进</text><text x="1222.5" y="542" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">证据 / 原目标契约</text><line x1="355" y1="537" x2="405" y2="537" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><line x1="690" y1="537" x2="740" y2="537" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><line x1="1025" y1="537" x2="1075" y2="537" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="720" y="635" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">审批者与策略配置提供授权依据；工具回执与验证器提供执行事实。</text><path d="M1222 590 L1222 725 L55 725 L55 320 L160 320 L160 300" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrt)"/><text x="740" y="750" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#3F8079">已接纳事实反馈下一轮模型决策</text><rect x="45" y="805" width="1350" height="55" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="839" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">解释“为什么合理”不能自证“已经获准”；紧急程度也不会自动扩大任务授权范围。</text></svg>