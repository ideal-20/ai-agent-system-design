<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="1140px" viewBox="0 0 1440 1140" role="img" aria-labelledby="title desc"><title id="title">主线任务的接续图：固定验收路径包围有界调查</title><desc id="desc">当前为 WAITING / VERIFYING；下列 PASS、FAIL 与新变更均为后续条件分支</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="1140" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">主线任务的接续图：固定验收路径包围有界调查</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">当前为 WAITING / VERIFYING；下列 PASS、FAIL 与新变更均为后续条件分支</text><rect x="45" y="130" width="1350" height="340" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="164" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">固定验收：先看证据是否合格，再判断目标是否达成</text><rect x="80" y="235" width="240" height="90" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="200.0" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">持久等待 / 唤醒</text><text x="200.0" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">当前 WAIT-11-04</text><rect x="410" y="235" width="330" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="575.0" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">collect_verification_window</text><text x="575.0" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">采集新窗口</text><rect x="830" y="235" width="240" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="950.0" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">证据质量检查</text><text x="950.0" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">范围 / 完整性 / 样本</text><rect x="1150" y="235" width="210" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1255.0" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">原目标验收</text><text x="1255.0" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">PASS / FAIL / UNKNOWN</text><line x1="320" y1="280" x2="400" y2="280" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="740" y1="280" x2="820" y2="280" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="1070" y1="280" x2="1140" y2="280" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><path d="M950 325 L950 390 L200 390 L200 335" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="580" y="381" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#B0763A">不足：登记新等待，或返回证据缺口</text><rect x="1050" y="370" width="310" height="70" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1205.0" y="401" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#3F8079">PASS → 核对未决操作并交付</text><text x="1205.0" y="427" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">仅合格证据通过后</text><line x1="1255" y1="325" x2="1255" y2="360" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><rect x="45" y="530" width="1350" height="420" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="564" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">动态调查：范围、轮次、预算与进展均受约束</text><rect x="85" y="625" width="320" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="245.0" y="656" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">提出有界诊断计划</text><text x="245.0" y="682" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">先解释要补齐的证据缺口</text><rect x="560" y="625" width="320" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="720.0" y="656" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">派发只读节点</text><text x="720.0" y="682" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">计划检查 + 动态门禁</text><rect x="1035" y="625" width="320" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1195.0" y="656" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">汇合版本化证据</text><text x="1195.0" y="682" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">再次判断下一阶段</text><line x1="405" y1="672" x2="550" y2="672" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="880" y1="672" x2="1025" y2="672" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><path d="M1255 325 L1380 325 L1380 500 L55 500 L55 672 L75 672" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrr)"/><text x="760" y="490" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#B9504A">FAIL：未恢复 → 允许调查，不自动追加变更</text><rect x="85" y="815" width="320" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="245.0" y="846" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">人工参与</text><text x="245.0" y="872" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">明确后续恢复条件</text><rect x="560" y="815" width="320" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="720.0" y="846" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">仍有可验证缺口</text><text x="720.0" y="872" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">在配额内展开下一轮</text><rect x="1035" y="815" width="320" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1195.0" y="846" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">形成具体拟议变更</text><text x="1195.0" y="872" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">预检与独立审批</text><line x1="1195" y1="720" x2="1195" y2="805" stroke="#B0763A" stroke-width="2" marker-end="url(#arr)"/><path d="M1195 760 L720 760 L720 805" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrb)"/><path d="M720 760 L245 760 L245 805" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M720 900 L720 925 L450 925 L450 600 L245 600 L245 615" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrb)"/><rect x="45" y="985" width="1350" height="100" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="70" y="1020" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#24364B">获批并通过派发前复核 → 登记 Operation → 执行与结果确认 → 等待后重新验收</text><text x="70" y="1057" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">实线：控制流；虚线：条件等待或受限循环。拒绝、取消、预算耗尽等出口由 Runtime 统一处理。</text></svg>