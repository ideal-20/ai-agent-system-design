<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="900px" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">节点就绪：匹配的是本轮产物，不是“某次成功”</title><desc id="desc">依赖需要关联计划修订、迭代与证据版本；Attempt 不会创造新的逻辑节点</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">节点就绪：匹配的是本轮产物，不是“某次成功”</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">依赖需要关联计划修订、迭代与证据版本；Attempt 不会创造新的逻辑节点</text><rect x="45" y="140" width="630" height="580" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">历史轮次：PLAN-11-r2 / iteration=1</text><rect x="765" y="140" width="630" height="580" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="785" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">当前轮次：PLAN-11-r2 / iteration=2</text><rect x="105" y="245" width="510" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="360.0" y="276" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3F8079">collect_window [round=1]</text><text x="360.0" y="302" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">产物 window-1 / COMPLETE</text><line x1="360" y1="340" x2="360" y2="425" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><rect x="105" y="435" width="510" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="360.0" y="466" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3F8079">verify_window [round=1]</text><text x="360.0" y="492" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">消费明确绑定的 window-1</text><rect x="825" y="245" width="510" height="95" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1080.0" y="276" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#B0763A">collect_window [round=2]</text><text x="1080.0" y="302" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">新窗口尚未取得</text><line x1="1080" y1="340" x2="1080" y2="425" stroke="#B0763A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="825" y="435" width="510" height="95" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="1080.0" y="466" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#B9504A">verify_window [round=2]</text><text x="1080.0" y="492" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">BLOCKED：缺少本轮完整产物</text><path d="M615 293 L720 293 L720 480 L815 480" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrr)"/><text x="720" y="397" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#B9504A">×</text><text x="720" y="580" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B9504A">旧成功不能满足新轮次</text><text x="105" y="625" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">节点结束状态：SUCCEEDED / FAILED / SKIPPED</text><text x="825" y="625" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">Ready 还需：输入适用 + 门禁通过 + 预算可用</text><rect x="45" y="770" width="1350" height="85" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="70" y="805" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#426B9A">Ready(v) = 活动修订 ∧ 依赖满足 ∧ 输入有效 ∧ 门禁通过 ∧ 预算可用</text><text x="70" y="836" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">FAILED 与 SKIPPED 只有在契约明确允许时，才可能满足特定依赖。</text></svg>