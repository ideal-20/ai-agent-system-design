<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="960px" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">重新规划：保留既成事实，只修订尚未执行的承诺</title><desc id="desc">教学修订 PLAN-11-r2 → r3：新证据要求调整调查，new_mutations=NONE</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="960" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">重新规划：保留既成事实，只修订尚未执行的承诺</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">教学修订 PLAN-11-r2 → r3：新证据要求调整调查，new_mutations=NONE</text><rect x="45" y="140" width="615" height="600" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">PLAN-11-r2：保留为历史</text><rect x="780" y="140" width="615" height="600" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="800" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">PLAN-11-r3：接纳后的活动计划</text><rect x="95" y="235" width="515" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="352.5" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3F8079">CHG-11 = SUCCEEDED</text><text x="352.5" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">确认事实与操作身份</text><rect x="830" y="235" width="515" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1087.5" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3F8079">CHG-11 = SUCCEEDED</text><text x="1087.5" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">原样保留</text><line x1="610" y1="285" x2="820" y2="285" stroke="#3F8079" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="95" y="395" width="515" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="352.5" y="426" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#426B9A">原诊断候选</text><text x="352.5" y="452" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">依赖旧路径证据</text><rect x="830" y="395" width="515" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="1087.5" y="426" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#426B9A">重新评估诊断</text><text x="1087.5" y="452" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">绑定新增证据</text><line x1="610" y1="445" x2="820" y2="445" stroke="#426B9A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="95" y="555" width="515" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="352.5" y="586" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#B9504A">可选旧路径查询</text><text x="352.5" y="612" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">尚未启动</text><rect x="830" y="555" width="515" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="1087.5" y="586" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#B9504A">取消该未启动节点</text><text x="1087.5" y="612" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">不再派发</text><line x1="610" y1="605" x2="820" y2="605" stroke="#B9504A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="720" y="275" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#3F8079">保留</text><text x="720" y="435" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#426B9A">修订</text><text x="720" y="595" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#B9504A">取消</text><rect x="45" y="790" width="1350" height="115" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="827" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#B0763A">在途结果：继续记录 → 校验范围与适用性 → 决定能否复用于 r3</text><text x="70" y="867" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">活动指针以事务从 r2 切换到 r3；旧计划不被原地改写，外部操作不会因节点更名而被复制。</text></svg>