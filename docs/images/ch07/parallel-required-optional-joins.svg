<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="920px" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">并发汇合：节点结束，不等于所需证据齐备</title><desc id="desc">required_inputs 决定能否推进；optional_inputs 决定报告可以丰富到什么程度</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">并发汇合：节点结束，不等于所需证据齐备</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">required_inputs 决定能否推进；optional_inputs 决定报告可以丰富到什么程度</text><text x="80" y="145" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">有界并行读取</text><text x="850" y="145" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">按输入契约汇合</text><rect x="70" y="385" width="220" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="180.0" y="416" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">父任务契约</text><text x="180.0" y="442" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">范围与预算下传</text><path d="M290 435 L330 435 L330 280 L370 280" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrb)"/><rect x="380" y="230" width="350" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="555.0" y="261" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">路径分布 / required</text><text x="555.0" y="287" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">成功：完整且范围匹配</text><path d="M730 280 L790 280 L790 455 L835 455" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M290 435 L330 435 L330 455 L370 455" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrb)"/><rect x="380" y="405" width="350" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="555.0" y="436" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B9504A">有效配置 / required</text><text x="555.0" y="462" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">失败或缺失 → 关键缺口</text><path d="M730 455 L790 455 L790 455 L835 455" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M290 435 L330 435 L330 630 L370 630" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrb)"/><rect x="380" y="580" width="350" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="555.0" y="611" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">耗时摘要 / optional</text><text x="555.0" y="637" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">超时或部分结果可标注</text><path d="M730 630 L790 630 L790 455 L835 455" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="845" y="405" width="480" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="1085.0" y="436" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#426B9A">Join：范围、版本与完整性检查</text><text x="1085.0" y="462" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">关键输入缺失时，不能产生 COMPLETE</text><line x1="1085" y1="505" x2="1085" y2="565" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><rect x="845" y="575" width="480" height="95" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1085.0" y="606" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">PARTIAL 证据包</text><text x="1085.0" y="632" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">可交付已知事实与缺口；阻止依赖完整证据的变更</text><rect x="70" y="735" width="1260" height="80" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="100" y="768" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">并发还要通过资源冲突检查</text><text x="100" y="798" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">只读分支可以并行；读写或写写冲突应串行或使用明确协议，并预留共享预算。</text><text x="70" y="875" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">示意分支状态用于说明汇合规则，不代表主线事故已经出现这些查询结果。</text></svg>