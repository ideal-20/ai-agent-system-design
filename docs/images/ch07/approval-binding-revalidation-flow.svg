<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="970px" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc"><title id="title">审批改变派发权限；实际派发前仍需重新校验</title><desc id="desc">审批对象是具体、不可变的动作意图，绑定目标、参数、范围与证据版本</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="970" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">审批改变派发权限；实际派发前仍需重新校验</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">审批对象是具体、不可变的动作意图，绑定目标、参数、范围与证据版本</text><text x="180" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">计划 / 预检</text><line x1="180" y1="175" x2="180" y2="810" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 6"/><text x="570" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">Runtime</text><line x1="570" y1="175" x2="570" y2="810" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 6"/><text x="960" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">审批者</text><line x1="960" y1="175" x2="960" y2="810" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 6"/><text x="1290" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">执行器</text><line x1="1290" y1="175" x2="1290" y2="810" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 6"/><line x1="180" y1="225" x2="570" y2="225" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><text x="375" y="208" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#426B9A">保存具体意图与版本</text><line x1="570" y1="315" x2="960" y2="315" stroke="#B0763A" stroke-width="2.2" marker-end="url(#arr)"/><text x="765" y="298" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#B0763A">呈现证据、参数差异与范围</text><line x1="960" y1="405" x2="570" y2="405" stroke="#B0763A" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="765" y="388" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#B0763A">批准 / 拒绝 / 请求修改</text><rect x="430" y="455" width="280" height="85" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="570" y="490" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#426B9A">派发前复核</text><text x="570" y="519" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">身份 / 范围 / 版本 / 预算</text><line x1="570" y1="595" x2="1290" y2="595" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="930" y="578" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#3F8079">批准有效且绑定条件仍成立 → 派发已登记动作</text><line x1="570" y1="685" x2="180" y2="685" stroke="#B0763A" stroke-width="2.2" marker-end="url(#arr)"/><text x="375" y="669" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#B0763A">条件失效 / 请求修改：创建修订并重新预检</text><rect x="430" y="735" width="590" height="70" rx="10" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="725" y="776" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B9504A">拒绝：阻止该动作，不通过换工具绕过</text><rect x="45" y="860" width="1350" height="60" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="896" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">人工接管先停止派发并交接在途操作；恢复前读取当前现场，使旧依赖失效。</text></svg>