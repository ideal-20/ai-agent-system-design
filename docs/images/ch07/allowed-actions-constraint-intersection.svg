<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="920px" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">允许动作集合：权限、目标与现场条件的交集</title><desc id="desc">证据增加可以满足前置条件；它不能替用户、身份或策略授予新的权限</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">允许动作集合：权限、目标与现场条件的交集</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">证据增加可以满足前置条件；它不能替用户、身份或策略授予新的权限</text><rect x="45" y="140" width="590" height="625" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">相对稳定的授权边界</text><rect x="90" y="215" width="500" height="460" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="110" y="250" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#24364B">身份权限：调用者最多能做什么</text><rect x="120" y="305" width="440" height="335" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="140" y="340" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">再与本次任务范围取交集</text><rect x="150" y="395" width="380" height="205" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="170" y="430" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">再与策略允许范围取交集</text><text x="180" y="495" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">服务账号有写权限</text><text x="180" y="535" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3F8079">任务仍可能只允许诊断</text><rect x="720" y="140" width="675" height="625" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="740" y="174" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">随时间变化的派发条件</text><rect x="780" y="230" width="555" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="1057.5" y="261" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#426B9A">阶段限制</text><text x="1057.5" y="287" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">调查 / 等待 / 预检 / 变更 / 验收</text><rect x="780" y="380" width="555" height="105" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1057.5" y="411" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#3F8079">前置条件与证据</text><text x="1057.5" y="437" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">当前版本 + 完整证据 + 有效审批</text><rect x="780" y="530" width="555" height="105" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1057.5" y="561" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#B0763A">剩余预算</text><text x="1057.5" y="587" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">扣除已结算与已预留消耗</text><text x="670" y="466" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="700" fill="#426B9A">∩</text><rect x="45" y="810" width="1350" height="65" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="720" y="850" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#426B9A">A_allowed(t) = 身份 ∩ 任务 ∩ 策略 ∩ 阶段(t) ∩ 前置条件(t) ∩ 预算(t)</text><text x="70" y="902" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">条件撤销时集合立即收缩；模型的自信程度不是扩大集合的授权依据。</text></svg>