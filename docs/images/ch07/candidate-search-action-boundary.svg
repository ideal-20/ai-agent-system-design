<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="850px" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">候选搜索与实际行动之间，需要一道明确边界</title><desc id="desc">可以并行比较解释与计划；被放弃的推演不能提前触碰生产副作用</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="850" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">候选搜索与实际行动之间，需要一道明确边界</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">可以并行比较解释与计划；被放弃的推演不能提前触碰生产副作用</text><rect x="45" y="135" width="875" height="600" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="70" y="175" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">候选空间：允许探索、比较与回溯</text><rect x="85" y="380" width="245" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="207.5" y="411" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">当前事实与目标</text><text x="207.5" y="437" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">CHG-11 成功，504 未恢复</text><path d="M330 427 L365 427 L365 275 L400 275" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="410" y="230" width="400" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="610.0" y="261" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">候选 A：补齐窗口</text><text x="610.0" y="287" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">验证验收证据是否完整</text><path d="M330 427 L365 427 L365 435 L400 435" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="410" y="390" width="400" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="610.0" y="421" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">候选 B：读取路径</text><text x="610.0" y="447" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">区分剩余异常的分布</text><path d="M330 427 L365 427 L365 595 L400 595" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="410" y="550" width="400" height="90" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="610.0" y="581" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B9504A">候选 C：再次变更</text><text x="610.0" y="607" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">证据不足，不能执行</text><line x1="960" y1="135" x2="960" y2="735" stroke="#B0763A" stroke-width="2" stroke-dasharray="7 6"/><text x="980" y="165" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B0763A">真实行动边界</text><rect x="1020" y="360" width="325" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1182.5" y="391" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B0763A">Runtime 门禁</text><text x="1182.5" y="417" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">范围 · 依赖 · 权限 · 预算</text><path d="M810 435 L1010 410" fill="none" stroke="#426B9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrb)"/><text x="915" y="390" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#426B9A">被选中的候选</text><rect x="1020" y="560" width="325" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1182.5" y="591" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#3F8079">执行受控读取</text><text x="1182.5" y="617" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">取得新证据后再决策</text><line x1="1182" y1="460" x2="1182" y2="550" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="1050" y="697" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">其他候选仅保留为分析记录</text><rect x="45" y="775" width="1350" height="45" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="803" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">Tree of Thoughts 式回溯适用于候选表示；真实生产变更不能被当作可随意撤销的搜索分支。</text></svg>