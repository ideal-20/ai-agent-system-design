<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="920px" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">ReAct：反馈必须改变假设、等待条件或退出路径</title><desc id="desc">循环是否继续由进展、证据与约束决定；一次工具成功不能替代目标验收</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">ReAct：反馈必须改变假设、等待条件或退出路径</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">循环是否继续由进展、证据与约束决定；一次工具成功不能替代目标验收</text><rect x="45" y="135" width="890" height="650" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="169" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">有界的调查循环</text><rect x="100" y="220" width="330" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="265.0" y="251" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">事实与开放问题</text><text x="265.0" y="277" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">版本化证据 + 预算</text><rect x="540" y="220" width="330" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="705.0" y="251" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">提出下一项调查</text><text x="705.0" y="277" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">说明要补齐的证据缺口</text><rect x="540" y="455" width="330" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="705.0" y="486" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">执行与证据校验</text><text x="705.0" y="512" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">范围、完整性、适用条件</text><rect x="100" y="455" width="330" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="265.0" y="486" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">更新假设与进展</text><text x="265.0" y="512" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">新增事实 / 排除解释 / 缺口</text><line x1="430" y1="270" x2="530" y2="270" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><line x1="705" y1="320" x2="705" y2="445" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><text x="725" y="389" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#426B9A">门禁允许</text><line x1="540" y1="505" x2="440" y2="505" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><path d="M265 455 L265 330" fill="none" stroke="#3F8079" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrt)"/><text x="280" y="399" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#3F8079">新证据改变下一步</text><rect x="110" y="650" width="750" height="85" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="485" y="685" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">进展检查：证据是否增加，决策空间是否缩小？</text><text x="485" y="716" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">不同查询字符串也可能只是在重复读取同一份资料</text><path d="M265 555 L265 640" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrt)"/><path d="M870 270 L905 270 L905 610 L485 610 L485 640" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrr)"/><text x="650" y="600" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#B9504A">门禁拒绝：返回具体约束原因</text><rect x="1020" y="200" width="325" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1182.5" y="231" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B0763A">等待</text><text x="1182.5" y="257" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">窗口未成熟 / 外部结果未到</text><rect x="1020" y="385" width="325" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="1182.5" y="416" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B9504A">交付缺口 / 人工参与</text><text x="1182.5" y="442" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">预算耗尽或信息来源受限</text><rect x="1020" y="570" width="325" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1182.5" y="601" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#3F8079">完成检查</text><text x="1182.5" y="627" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">业务验收满足后仍需核对收尾</text><path d="M860 690 L970 690 L970 250 L1010 250" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><path d="M970 435 L1010 435" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrr)"/><path d="M970 620 L1010 620" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrt)"/><rect x="45" y="830" width="1350" height="50" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="861" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">“输出了一份总结”是交付行为；原任务是否完成，仍由目标契约和业务证据决定。</text></svg>