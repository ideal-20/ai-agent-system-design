<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="900px" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">从模型计划到受限执行结构：静态检查与动态门禁</title><desc id="desc">计划可以提前验证结构；每次派发仍需验证当时的现场与执行条件</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">从模型计划到受限执行结构：静态检查与动态门禁</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">计划可以提前验证结构；每次派发仍需验证当时的现场与执行条件</text><rect x="45" y="135" width="1350" height="280" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="169" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">接纳计划时：验证结构，而不是访问生产执行</text><rect x="90" y="230" width="290" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="235.0" y="261" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#426B9A">模型候选计划</text><text x="235.0" y="287" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">READ / WAIT / VERIFY / …</text><rect x="520" y="230" width="360" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="700.0" y="261" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#426B9A">编译与静态校验</text><text x="700.0" y="287" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">节点身份、依赖、类型、范围</text><rect x="1030" y="230" width="290" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1175.0" y="261" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#3F8079">版本化执行图</text><text x="1175.0" y="287" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">注册能力 + 固定输出契约</text><line x1="380" y1="280" x2="510" y2="280" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><line x1="880" y1="280" x2="1020" y2="280" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="700" y="375" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#B9504A">拒绝：悬空依赖、未注册能力、缺失分支出口、非法终结路径</text><rect x="45" y="465" width="1350" height="290" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="499" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">执行每个节点时：检查语义前提与当前现场</text><rect x="90" y="560" width="300" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="240.0" y="591" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">依赖就绪</text><text x="240.0" y="617" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">本轮产物完整且版本匹配</text><rect x="535" y="560" width="300" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="685.0" y="591" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">派发前动态检查</text><text x="685.0" y="617" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">权限、资源版本、预算、审批</text><rect x="1040" y="560" width="300" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="1190.0" y="591" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">受控执行</text><text x="1190.0" y="617" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">结果仍需绑定计划修订</text><line x1="390" y1="610" x2="525" y2="610" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><line x1="835" y1="610" x2="1030" y2="610" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><path d="M1175 330 L1175 430 L240 430 L240 550" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrt)"/><text x="710" y="451" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">通过静态检查，只得到“可以进入调度”的计划</text><rect x="45" y="805" width="1350" height="55" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="839" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">VERIFY 读取规定的证据字段；模型不能通过计划文本直接写入 PASS，或创造未经注册的执行能力。</text></svg>