<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc">
<title id="title">读写分流：同一调用入口，两套验收责任</title><desc id="desc">查询交付可靠的证据；变更还要控制副作用、恢复未知结果并验证业务目标</desc>
<defs>
<marker id="a64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
<marker id="a426B9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426B9A"/></marker>
<marker id="a3F8079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3F8079"/></marker>
<marker id="aB0763A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B0763A"/></marker>
<marker id="aB9504A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B9504A"/></marker>
<marker id="a24364B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24364B"/></marker>
</defs>
<rect width="1440" height="910" fill="#FFFFFF"/>
<text x="44" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">读写分流：同一调用入口，两套验收责任</text>
<text x="44" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">查询交付可靠的证据；变更还要控制副作用、恢复未知结果并验证业务目标</text>
<rect x="45" y="135" width="1350" height="115" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/>
<circle cx="77" cy="171" r="17" fill="#426B9A"/>
<text x="77" y="177" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">0</text>
<text x="106" y="178" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="600" text-anchor="start">共同门禁</text>
<text x="305" y="178" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#24364B" font-weight="400" text-anchor="start">工具注册 → 参数 Schema → 身份与资源范围 → 当前任务阶段</text>
<text x="305" y="218" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">不通过：拒绝并记录原因；通过后根据工具 effect 分流</text>
<text x="55" y="325" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#3F8079" font-weight="600" text-anchor="start">READ · 查询</text>
<line x1="300" y1="317" x2="1330" y2="317" stroke="#3F8079" stroke-width="2"/>
<text x="55" y="560" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#B0763A" font-weight="600" text-anchor="start">MUTATION · 变更</text>
<line x1="300" y1="552" x2="1330" y2="552" stroke="#B0763A" stroke-width="2"/>
<circle cx="340" cy="317" r="19" fill="#3F8079"/>
<text x="340" y="323" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="340" y="370" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="middle">读取数据源</text>
<text x="340" y="403" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定时间窗 / 查询范围</text>
<circle cx="785" cy="317" r="19" fill="#3F8079"/>
<text x="785" y="323" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="785" y="370" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="middle">核对结果</text>
<text x="785" y="403" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">完整性 / 时间 / 来源</text>
<circle cx="1230" cy="317" r="19" fill="#3F8079"/>
<text x="1230" y="323" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="1230" y="370" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="middle">交付证据</text>
<text x="1230" y="403" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">脱敏 / 引用 / 保留缺口</text>
<rect x="300" y="435" width="1035" height="57" rx="8" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="325" y="470" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="600" text-anchor="start">回执：查询完成状态 + 数据完整性 + 时间口径 + 可回查来源</text>
<circle cx="340" cy="552" r="19" fill="#B0763A"/>
<text x="340" y="558" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="340" y="605" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="600" text-anchor="middle">预检</text>
<text x="340" y="637" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">影响范围与撤回条件</text>
<circle cx="630" cy="552" r="19" fill="#B0763A"/>
<text x="630" y="558" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="630" y="605" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="600" text-anchor="middle">审批与复核</text>
<text x="630" y="637" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">绑定参数、版本与时效</text>
<circle cx="930" cy="552" r="19" fill="#B0763A"/>
<text x="930" y="558" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="930" y="605" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="600" text-anchor="middle">稳定 ID 执行</text>
<text x="930" y="637" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">持久化、幂等与对账</text>
<circle cx="1230" cy="552" r="19" fill="#B0763A"/>
<text x="1230" y="558" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="1230" y="605" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="600" text-anchor="middle">双重验收</text>
<text x="1230" y="637" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">配置读回 + 业务恢复</text>
<rect x="300" y="675" width="1035" height="92" rx="8" fill="#FBF1E4" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="325" y="711" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B0763A" font-weight="600" text-anchor="start">回执：执行状态 + 审批 / 操作 ID + 配置版本 + 业务验收结果</text>
<text x="325" y="745" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">响应超时先查原操作；配置生效而故障未恢复时，任务继续或按策略补偿。</text>
<path d="M 180 250 L 180 285 L 340 285 L 340 294" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<path d="M 250 250 L 250 520 L 340 520 L 340 530" fill="none" stroke="#B0763A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB0763A)"/>
<line x1="44" y1="846" x2="1396" y2="846" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="44" y="881" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">只读不等于无约束；变更也不以 API 返回成功为终点。两条路径都必须产生可解释的 Observation。</text>
</svg>
