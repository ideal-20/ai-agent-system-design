<rect x="60" y="612" width="100" height="32" rx="6" fill="#EAF4F2" stroke="#3F8079" stroke-width="1"/>
<text x="110.0" y="634" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="600" text-anchor="middle">允许分支</text>
<path d="M 480 667 L 800 667" fill="none" stroke="#B0763A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB0763A)"/>
<text x="640.0" y="655" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="400" text-anchor="middle">已校验的调用请求</text>
<rect x="795" y="674" width="10" height="127" rx="2" fill="#EAF4F2" stroke="#3F8079" stroke-width="1"/>
<path d="M 800 720 L 1120 720" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<text x="960.0" y="708" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="400" text-anchor="middle">受限凭据 + API 请求</text>
<path d="M 1120 785 L 800 785" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)" stroke-dasharray="6 4"/>
<text x="960.0" y="773" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="400" text-anchor="middle">结果或执行状态未知</text>
<path d="M 800 844 L 480 844" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)" stroke-dasharray="6 4"/>
<text x="640.0" y="832" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="400" text-anchor="middle">受限结果 + 执行状态</text>
<path d="M 480 897 L 160 897" fill="none" stroke="#426B9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a426B9A)" stroke-dasharray="6 4"/>
<text x="320.0" y="885" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="400" text-anchor="middle">Observation + 更新后的任务状态</text>
<text x="1120" y="950" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="600" text-anchor="middle">外部请求仅发生在允许分支</text>
<line x1="44" y1="996" x2="1396" y2="996" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="44" y="1031" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">同一调用 ID 关联模型请求、门禁决定和执行结果；普通文本输出走回答路径，不进入工具执行分支。</text>
</svg>
