<text x="800" y="176" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="middle">Tool Adapter</text>
<line x1="800" y1="200" x2="800" y2="924" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 6"/>
<rect x="1008" y="135" width="224" height="65" rx="9" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/>
<text x="1120" y="176" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="middle">目标系统</text>
<line x1="1120" y1="200" x2="1120" y2="924" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 6"/>
<path d="M 480 260 L 160 260" fill="none" stroke="#426B9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a426B9A)"/>
