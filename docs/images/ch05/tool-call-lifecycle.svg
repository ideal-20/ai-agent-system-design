</defs>
<rect width="1440" height="1060" fill="#FFFFFF"/>
<text x="44" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">一次工具调用的完整生命周期</text>
<text x="44" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">模型提出请求 → Runtime 决定放行或拒绝 → 适配器执行 → 结果回到本轮状态</text>
