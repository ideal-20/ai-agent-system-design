<rect x="368" y="135" width="224" height="65" rx="9" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/>
<text x="480" y="176" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#B0763A" font-weight="600" text-anchor="middle">Runtime / 门禁</text>
