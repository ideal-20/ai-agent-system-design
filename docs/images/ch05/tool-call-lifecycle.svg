<rect x="510" y="358" width="380" height="75" rx="8" fill="#FBF1E4" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="530" y="386" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="600" text-anchor="start">Schema / 身份 / 范围 / 任务阶段</text>
<text x="530" y="414" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">变更额外检查预检、审批和相关版本</text>
<rect x="45" y="475" width="1320" height="103" rx="10" fill="#FBEDEC" stroke="#CBD5E1" stroke-width="1.3"/>
<rect x="60" y="488" width="100" height="32" rx="6" fill="#FBEDEC" stroke="#B9504A" stroke-width="1"/>
<text x="110.0" y="510" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B9504A" font-weight="600" text-anchor="middle">拒绝分支</text>
<path d="M 480 548 L 160 548" fill="none" stroke="#B9504A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB9504A)" stroke-dasharray="6 4"/>
<text x="320.0" y="536" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="400" text-anchor="middle">拒绝原因 + 可定位错误</text>
