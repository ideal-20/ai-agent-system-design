<path d="M 1030 197 L 1120 197" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a64748B)"/>
<rect x="525" y="340" width="390" height="110" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/>
<text x="720.0" y="375" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#426B9A" font-weight="600" text-anchor="middle">UNKNOWN → 查询 CHG-11</text>
<text x="720.0" y="408" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="middle">复用原操作记录；获取下游状态</text>
<path d="M 1255 250 L 1255 290 L 720 290 L 720 330" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB9504A)"/>
<rect x="70" y="535" width="360" height="110" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/>
<text x="250.0" y="570" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#3F8079" font-weight="600" text-anchor="middle">已完成</text>
<text x="250.0" y="603" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="middle">读取原结果及配置版本 v18</text>
<rect x="540" y="535" width="360" height="110" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/>
<text x="720.0" y="570" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B0763A" font-weight="600" text-anchor="middle">处理中</text>
<text x="720.0" y="603" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="middle">预算内等待，再查同一 ID</text>
<rect x="1010" y="535" width="360" height="110" rx="10" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.3"/>
<text x="1190.0" y="570" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B9504A" font-weight="600" text-anchor="middle">仍无法确认</text>
<text x="1190.0" y="603" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="middle">保留未知状态，进入对账</text>
<path d="M 720 450 L 720 485 L 250 485 L 250 525" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
