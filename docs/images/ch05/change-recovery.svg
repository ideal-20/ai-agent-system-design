<text x="185.0" y="213" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">绑定参数与规则 v17</text>
<rect x="405" y="145" width="280" height="105" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/>
<text x="545.0" y="180" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="600" text-anchor="middle">持久化 CHG-11</text>
<text x="545.0" y="213" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">固定 ID 与规范化参数</text>
<rect x="780" y="145" width="250" height="105" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/>
<text x="905.0" y="180" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="middle">发送变更</text>
<text x="905.0" y="213" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">按预期版本条件更新</text>
<rect x="1130" y="145" width="250" height="105" rx="10" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.3"/>
<text x="1255.0" y="180" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#B9504A" font-weight="600" text-anchor="middle">等待响应超时</text>
<text x="1255.0" y="213" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">可能已产生副作用</text>
