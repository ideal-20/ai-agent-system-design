<path d="M 720 450 L 720 485 L 1190 485 L 1190 525" fill="none" stroke="#B9504A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB9504A)"/>
<path d="M 900 590 L 955 590 L 955 395 L 925 395" fill="none" stroke="#B0763A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB0763A)" stroke-dasharray="6 5"/>
<rect x="70" y="720" width="1300" height="170" rx="12" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="92" y="754" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="600" text-anchor="start">完成执行后，继续验证用户目标</text>
<rect x="105" y="775" width="310" height="85" rx="10" fill="#FFFFFF" stroke="#3F8079" stroke-width="1.3"/>
<text x="260.0" y="810" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#3F8079" font-weight="600" text-anchor="middle">配置读回</text>
<text x="260.0" y="843" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">E11 已进入生效规则</text>
<rect x="535" y="775" width="350" height="85" rx="10" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.3"/>
<text x="710.0" y="810" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="600" text-anchor="middle">业务验收</text>
<text x="710.0" y="843" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">可比流量窗口中的 504 与延迟</text>
<rect x="1005" y="775" width="325" height="85" rx="10" fill="#FFFFFF" stroke="#B0763A" stroke-width="1.3"/>
<text x="1167.5" y="810" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="600" text-anchor="middle">确认恢复 / 继续排障</text>
<text x="1167.5" y="843" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="middle">必要时按条件执行补偿</text>
<path d="M 250 645 L 250 765" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<path d="M 415 817 L 525 817" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<path d="M 885 817 L 995 817" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a426B9A)"/>
<line x1="44" y1="936" x2="1396" y2="936" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="44" y="971" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">请求被接受 ≠ 配置已生效 ≠ 故障已恢复。只有下游幂等契约允许时才可复用同一 ID 重试。</text>
</svg>
