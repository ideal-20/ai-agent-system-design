<marker id="a24364B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24364B"/></marker>
</defs>
<rect width="1440" height="1000" fill="#FFFFFF"/>
<text x="44" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">变更超时：沿同一操作 ID 恢复状态</text>
<text x="44" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">请求可能已到达下游时，超时只能说明结果未知；CHG-11 始终标识同一次业务变更</text>
