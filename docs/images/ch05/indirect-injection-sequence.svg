<rect x="1055" y="140" width="200" height="63" rx="9" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/>
<text x="1155" y="180" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="600" text-anchor="middle">Model</text>
