<text x="585.0" y="403" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="400" text-anchor="middle">校验权限后读取</text>
<path d="M 435 490 L 735 490" fill="none" stroke="#B0763A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB0763A)" stroke-dasharray="6 4"/>
<text x="585.0" y="478" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="400" text-anchor="middle">业务数据 + 恶意备注</text>
<rect x="470" y="518" width="233" height="32" rx="6" fill="#FBEDEC" stroke="#B9504A" stroke-width="1"/>
<text x="586.5" y="540" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B9504A" font-weight="600" text-anchor="middle">payload 身份仍是业务数据</text>
<path d="M 735 599 L 1155 599" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<text x="945.0" y="587" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="400" text-anchor="middle">带来源的非受信 Observation</text>
<path d="M 1155 675 L 735 675" fill="none" stroke="#B9504A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB9504A)" stroke-dasharray="6 4"/>
<text x="945.0" y="663" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="400" text-anchor="middle">可能提出越权动作</text>
<rect x="590" y="725" width="640" height="106" rx="10" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.3"/>
<text x="615" y="764" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B9504A" font-weight="600" text-anchor="start">独立门禁拒绝 internal_transfer</text>
<text x="615" y="800" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">只读排障任务不允许资金操作；拒绝发生在适配器调用前。</text>
<rect x="45" y="725" width="445" height="106" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="67" y="762" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="start">授权依据来自可信状态</text>
<text x="67" y="798" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">会话身份、任务范围、阶段与策略</text>
<path d="M 490 780 L 580 780" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<line x1="44" y1="916" x2="1396" y2="916" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="44" y="951" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">传输可信 ≠ 载荷有指令权限。来源标签帮助解释数据，实际外部操作由 Runtime 的独立授权控制。</text>
</svg>
