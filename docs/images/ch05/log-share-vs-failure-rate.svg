<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">超时日志占比与调用失败率：分母决定结论</title><desc id="desc">同一个地址的 841 条超时日志，可以描述日志分布；诊断失败率还需要完整、对齐的调用量</desc>
<defs>
<marker id="a64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
<marker id="a426B9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426B9A"/></marker>
<marker id="a3F8079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3F8079"/></marker>
<marker id="aB0763A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B0763A"/></marker>
<marker id="aB9504A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B9504A"/></marker>
<marker id="a24364B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24364B"/></marker>
</defs>
<rect width="1440" height="820" fill="#FFFFFF"/>
<text x="44" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">超时日志占比与调用失败率：分母决定结论</text>
<text x="44" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">同一个地址的 841 条超时日志，可以描述日志分布；诊断失败率还需要完整、对齐的调用量</text>
<rect x="55" y="135" width="640" height="555" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="77" y="169" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="600" text-anchor="start">① 当前已经取得：超时日志的地址分布</text>
<rect x="745" y="135" width="640" height="555" rx="12" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="767" y="169" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="600" text-anchor="start">② 下一步需要取得：该地址的调用失败率</text>
<text x="90" y="225" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="34" fill="#426B9A" font-weight="700" text-anchor="start">841 / 913 = 92.11%</text>
<text x="90" y="268" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">841 条：指向该地址的超时日志</text>
<text x="90" y="302" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">913 条：全部带目标地址的超时日志</text>
<rect x="90" y="350" width="565" height="60" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<rect x="90" y="350" width="520.4435925520263" height="60" rx="4" fill="#426B9A" stroke="#426B9A" stroke-width="1.3"/>
<text x="90" y="444" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="600" text-anchor="start">该地址：841 条</text>
<text x="655" y="444" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="end">其余：72 条</text>
<line x1="90" y1="485" x2="655" y2="485" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="90" y="533" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">可以回答</text>
<text x="90" y="570" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#24364B" font-weight="400" text-anchor="start">“返回的超时日志主要指向哪里？”</text>
<text x="90" y="625" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">前提：查询完整，地址缺失记录单独计数。</text>
<text x="780" y="235" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#3F8079" font-weight="700" text-anchor="start">该地址的失败调用数</text>
<line x1="780" y1="258" x2="1315" y2="258" stroke="#3F8079" stroke-width="1.5"/>
<text x="780" y="303" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="29" fill="#3F8079" font-weight="700" text-anchor="start">该地址的总调用数</text>
<text x="780" y="350" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">成功调用 + 失败调用</text>
<rect x="780" y="390" width="565" height="100" rx="10" fill="#FFFFFF" stroke="#3F8079" stroke-width="1.3"/>
<text x="805" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#3F8079" font-weight="700" text-anchor="start">当前日志聚合缺少这个分母</text>
<text x="805" y="467" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">还需按请求或调用尝试去重并统一口径。</text>
<text x="780" y="547" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="start">可以回答</text>
<text x="780" y="584" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#24364B" font-weight="400" text-anchor="start">“发往该地址的调用有多容易失败？”</text>
<text x="780" y="625" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">同时与其他地址、健康实例及历史窗口对照。</text>
<rect x="55" y="720" width="1330" height="50" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/>
<text x="80" y="752" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="600" text-anchor="start">若 95% 的调用本来就发往该地址，92.11% 的超时日志占比本身不足以证明它异常。</text>
</svg>
