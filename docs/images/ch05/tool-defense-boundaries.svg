<rect width="1440" height="1060" fill="#FFFFFF"/>
<text x="44" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">工具链防线：输入解释与执行授权各有边界</text>
<text x="44" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">来源封装帮助模型理解；模型外的参数、身份和出站检查实际约束执行</text>
<circle cx="70" cy="148" r="17" fill="#426B9A"/>
<text x="70" y="154" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="99" y="155" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="600" text-anchor="start">数据入口 · 来源标记与结构化封装</text>
<rect x="55" y="180" width="410" height="165" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="78" y="215" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#426B9A" font-weight="600" text-anchor="start">Observation</text>
<text x="78" y="253" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="400" text-anchor="start">source · time · scope</text>
<text x="78" y="284" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B0763A" font-weight="400" text-anchor="start">trust = UNTRUSTED</text>
<text x="78" y="315" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">payload = 外部返回内容</text>
<rect x="600" y="213" width="270" height="115" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/>
<text x="622" y="248" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#426B9A" font-weight="600" text-anchor="start">Model</text>
<text x="622" y="281" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">解释证据，提出动作意图</text>
<path d="M 465 265 L 590 265" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a426B9A)"/>
<rect x="1000" y="213" width="395" height="115" rx="9" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/>
<text x="1022" y="250" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="600" text-anchor="start">最终报告的出方向检查</text>
<text x="1022" y="288" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">敏感信息检查与脱敏 → 交付用户</text>
<path d="M 870 265 L 990 265" fill="none" stroke="#426B9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a426B9A)"/>
<text x="935" y="245" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="600" text-anchor="middle">回答路径</text>
<text x="450" y="375" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748B" font-weight="400" text-anchor="start">标签不提供执行权限；模型仍可能误读或受影响</text>
<line x1="55" y1="418" x2="1390" y2="418" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="55" y="457" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#B0763A" font-weight="600" text-anchor="start">模型外的 Runtime 控制区域</text>
<rect x="55" y="485" width="1340" height="337" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/>
<path d="M 735 328 L 735 395 L 450 395 L 450 507" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a426B9A)"/>
<circle cx="103" cy="543" r="17" fill="#B0763A"/>
<text x="103" y="549" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="132" y="550" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="600" text-anchor="start">参数与目标校验</text>
<text x="96" y="600" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">Schema 与语义约束</text>
<text x="96" y="634" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">路径 / 命令 / 目标断言</text>
<text x="96" y="668" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">受限根目录与连接时校验</text>
<line x1="475" y1="520" x2="475" y2="720" stroke="#CBD5E1" stroke-width="1"/>
<circle cx="535" cy="543" r="17" fill="#3F8079"/>
<text x="535" y="549" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="564" y="550" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#3F8079" font-weight="600" text-anchor="start">身份与执行授权</text>
<text x="528" y="600" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">会话身份与资源范围</text>
<text x="528" y="634" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">阶段 / 预检 / 审批 / 版本</text>
<text x="528" y="668" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">权限不读取模型的授权声明</text>
<line x1="905" y1="520" x2="905" y2="720" stroke="#CBD5E1" stroke-width="1"/>
<circle cx="965" cy="543" r="17" fill="#426B9A"/>
<text x="965" y="549" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="994" y="550" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="600" text-anchor="start">出方向数据检查</text>
<text x="958" y="600" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">工具外发内容检查</text>
<text x="958" y="634" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">敏感数据掩码与限制</text>
<text x="958" y="668" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">配合网络策略和最小权限</text>
<path d="M 440 660 L 495 660" fill="none" stroke="#B0763A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aB0763A)"/>
<path d="M 870 660 L 925 660" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<rect x="93" y="748" width="1225" height="43" rx="7" fill="#FBEDEC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="115" y="777" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="600" text-anchor="start">门禁不通过 → 拒绝调用，保留原因与审计；通过 → 受限适配器 → 目标系统</text>
<path d="M 1250 822 L 1250 885 L 965 885" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a3F8079)"/>
<rect x="590" y="858" width="365" height="75" rx="9" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/>
<text x="612" y="890" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="600" text-anchor="start">响应过滤与来源记录</text>
<text x="612" y="918" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">结果重新进入 Observation</text>
<text x="77" y="890" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="600" text-anchor="start">返回材料继续作为数据处理</text>
<text x="77" y="918" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">来源与时间进入下一轮上下文</text>
<text x="1000" y="926" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">执行 / 回传路径</text>
<line x1="44" y1="996" x2="1396" y2="996" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="44" y="1031" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">输入结构化、独立授权、网络边界与 DLP 相互补充；DLP 有漏检风险，不能替代最小权限与默认拒绝策略。</text>
</svg>
