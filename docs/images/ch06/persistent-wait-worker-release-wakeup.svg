<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="830px" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc"><title id="title">长任务的时间分解：有界工作 + 持久等待 + 再次调度</title><desc id="desc">RUN-11-01 保持连续身份，Worker A 与 Worker B 可以是不同进程</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="830" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">长任务的时间分解：有界工作 + 持久等待 + 再次调度</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">RUN-11-01 保持连续身份，Worker A 与 Worker B 可以是不同进程</text><line x1="110" y1="205" x2="1345" y2="205" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="110" y="175" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">14:10</text><line x1="110" y1="200" x2="110" y2="218" stroke="#64748B" stroke-width="1.4"/><text x="365" y="175" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">释放 Worker</text><line x1="365" y1="200" x2="365" y2="218" stroke="#64748B" stroke-width="1.4"/><text x="955" y="175" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">14:15</text><line x1="955" y1="200" x2="955" y2="218" stroke="#64748B" stroke-width="1.4"/><text x="1330" y="175" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">下一阶段</text><line x1="1330" y1="200" x2="1330" y2="218" stroke="#64748B" stroke-width="1.4"/><rect x="110" y="265" width="255" height="95" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="237" y="303" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#426B9A">Worker A</text><text x="237" y="336" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">提交等待与恢复位置</text><rect x="365" y="265" width="590" height="95" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="660" y="303" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#B0763A">Run = WAITING / VERIFYING</text><text x="660" y="336" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#B0763A">WAIT-11-04 · scheduled_for=14:15</text><rect x="955" y="265" width="375" height="95" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1142" y="303" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#3F8079">Worker B</text><text x="1142" y="336" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">collect_verification_window</text><rect x="280" y="455" width="880" height="205" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="300" y="489" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">等待记录是恢复协议的一部分</text><text x="315" y="532" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#24364B">wait_id + 唤醒条件 + 截止时间 + next_step</text><text x="315" y="577" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">计时事件使用稳定身份；消费时核对 wait_id 是否仍有效。</text><text x="315" y="615" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">Scheduler 重启后可扫描逾期计时器，重复扫描不会重复唤醒。</text><path d="M660 360 L660 445" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><path d="M1165 555 L1240 555 L1240 370" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrt)"/><text x="1240" y="588" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#3F8079">满足条件后</text><text x="1240" y="612" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#3F8079">重新进入 READY</text><rect x="45" y="735" width="1350" height="52" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="70" y="768" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">任务存活依赖持久身份与状态衔接；等待时不需要模型空转，也不需要 sleep(300) 常驻线程。</text></svg>