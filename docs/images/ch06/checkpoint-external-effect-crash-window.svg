<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="880px" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">Checkpoint 无法跨越的窗口：外部成功，本地还不知道</title><desc id="desc">CHG-11 首次请求超时后，应确认原操作，不创建第二次“增加 E11”</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="880" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Checkpoint 无法跨越的窗口：外部成功，本地还不知道</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">CHG-11 首次请求超时后，应确认原操作，不创建第二次“增加 E11”</text><text x="240" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">Runtime / Ledger</text><line x1="240" y1="175" x2="240" y2="695" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 5"/><text x="720" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">网络 / Worker</text><line x1="720" y1="175" x2="720" y2="695" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 5"/><text x="1210" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">渠道 A</text><line x1="1210" y1="175" x2="1210" y2="695" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="95" y="195" width="290" height="76" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="240.0" y="226" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">CHG-11 = PLANNED</text><text x="240.0" y="252" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">意图与 Outbox 已提交</text><line x1="240" y1="300" x2="1210" y2="300" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><text x="720" y="284" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#426B9A">发送原操作 CHG-11</text><rect x="1055" y="330" width="310" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1210.0" y="361" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#3F8079">下游实际执行成功</text><text x="1210.0" y="387" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">v18 包含 E11</text><line x1="1210" y1="445" x2="775" y2="445" stroke="#B9504A" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrr)"/><text x="1000" y="432" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#B9504A">响应丢失 / 进程退出</text><text x="755" y="453" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#B9504A">×</text><rect x="95" y="425" width="290" height="88" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="240.0" y="456" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">本地结果 UNKNOWN</text><text x="240.0" y="482" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">Checkpoint 不包含完成回执</text><line x1="240" y1="565" x2="1210" y2="565" stroke="#B0763A" stroke-width="2.2" marker-end="url(#arr)"/><text x="720" y="548" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#B0763A">恢复：按 CHG-11 查询原操作 + 配置读回</text><line x1="1210" y1="645" x2="240" y2="645" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="720" y="628" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#3F8079">保存原操作 SUCCEEDED 与 v18 证据</text><text x="70" y="730" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#64748B">本地“没收到成功”不等于下游“没有执行”；回到旧检查点也不会删除 E11。</text><rect x="45" y="785" width="1350" height="52" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="70" y="818" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">配置变更已确认成功；HTTP 504 尚未恢复，下一阶段仍需独立业务验收。</text></svg>