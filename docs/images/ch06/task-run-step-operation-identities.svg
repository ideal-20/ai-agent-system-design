<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="800px" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Task 到 Operation：执行身份在重试中如何保持</title><desc id="desc">同一业务目标允许多个 Run 与 Attempt，但外部副作用通过稳定 Operation 身份去重</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="800" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Task 到 Operation：执行身份在重试中如何保持</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">同一业务目标允许多个 Run 与 Attempt，但外部副作用通过稳定 Operation 身份去重</text><rect x="45" y="120" width="1350" height="590" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="154" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">身份层级与重试边界</text><rect x="90" y="210" width="230" height="92" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="205.0" y="241" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">TASK-11</text><text x="205.0" y="267" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">用户目标 / 验收契约</text><rect x="430" y="210" width="250" height="92" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="555.0" y="241" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">RUN-11-01</text><text x="555.0" y="267" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">一次配置与预算下的执行</text><rect x="800" y="210" width="235" height="92" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="917.5" y="241" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">Step: apply_change</text><text x="917.5" y="267" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">逻辑工作单元</text><rect x="1145" y="210" width="190" height="92" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1240.0" y="241" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">CHG-11</text><text x="1240.0" y="267" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">稳定业务操作</text><line x1="320" y1="256" x2="425" y2="256" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><line x1="680" y1="256" x2="795" y2="256" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><line x1="1035" y1="256" x2="1140" y2="256" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="350" y="238" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#64748B">包含</text><text x="738" y="238" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#64748B">包含</text><text x="1090" y="238" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#64748B">提出 / 追踪</text><text x="90" y="375" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#24364B">提交、对账与回执：不同执行记录引用同一 Operation</text><rect x="130" y="420" width="250" height="88" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="255.0" y="451" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B9504A">Attempt A1</text><text x="255.0" y="477" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">提交超时，结果 UNKNOWN</text><rect x="500" y="420" width="250" height="88" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="625.0" y="451" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">Attempt A2</text><text x="625.0" y="477" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">按原 ID 查询状态</text><rect x="930" y="420" width="300" height="88" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1080.0" y="451" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">Event: callback</text><text x="1080.0" y="477" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">迟到回执按事件身份去重</text><path d="M255 508 L255 560 L1360 560 L1360 256 L1340 256" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="625" y1="508" x2="625" y2="560" stroke="#B0763A" stroke-width="2" stroke-dasharray="6 5"/><line x1="1080" y1="508" x2="1080" y2="560" stroke="#B0763A" stroke-width="2" stroke-dasharray="6 5"/><text x="720" y="588" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#B0763A">关联 operation_id=CHG-11；虚线表示身份关联，不表示调用顺序</text><text x="90" y="620" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#24364B">工程约束</text><text x="90" y="654" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">查询 Attempt 与提交 Attempt 属于不同步骤；迟到回执是 Event。它们都引用 CHG-11，但不是同一种执行记录。</text><rect x="45" y="735" width="1350" height="42" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="762" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">重试改变 Attempt，不应凭空创造新的业务副作用。</text></svg>