<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="820px" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">Agent Loop：模型推理与外部 I/O 放在数据库事务之外</title><desc id="desc">模型提供候选；Runtime 通过版本和权限校验，将候选变成持久意图</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="820" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Agent Loop：模型推理与外部 I/O 放在数据库事务之外</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">模型提供候选；Runtime 通过版本和权限校验，将候选变成持久意图</text><text x="210" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">Worker / Model</text><line x1="210" y1="175" x2="210" y2="700" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 6"/><text x="720" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">Runtime / State Store</text><line x1="720" y1="175" x2="720" y2="700" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 6"/><text x="1230" y="145" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">外部系统</text><line x1="1230" y1="175" x2="1230" y2="700" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 6"/><line x1="210" y1="220" x2="720" y2="220" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arr)"/><text x="465.0" y="205" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#426B9A">读取状态版本 v42</text><rect x="95" y="260" width="230" height="70" rx="10" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="210" y="302" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">模型计算：事务外</text><line x1="210" y1="375" x2="720" y2="375" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arr)"/><text x="465.0" y="360" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#426B9A">提交候选 + expected_version=42</text><line x1="720" y1="490" x2="1230" y2="490" stroke="#B0763A" stroke-width="2.2" marker-end="url(#arr)"/><text x="975.0" y="475" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#B0763A">派发已登记意图 / operation_id</text><line x1="1230" y1="570" x2="720" y2="570" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="975.0" y="555" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#3F8079">返回结果或结果未知</text><line x1="720" y1="690" x2="210" y2="690" stroke="#3F8079" stroke-width="2.2" marker-end="url(#arrt)"/><text x="465.0" y="675" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#3F8079">提交 Observation → 下一轮 Context</text><rect x="550" y="398" width="340" height="47" rx="8" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="720" y="428" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#426B9A">TX1：意图 + 操作身份 + Outbox</text><rect x="550" y="595" width="340" height="47" rx="8" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="720" y="625" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#3F8079">TX2：结果 + 下一状态 + 版本</text><text x="60" y="725" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">每次提交重新检查取消、执行权与版本；跨系统调用不属于本地原子事务。</text><rect x="45" y="755" width="1350" height="42" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="782" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">先登记，再派发；结果落库之后，才成为下一轮可依赖的执行事实。</text></svg>