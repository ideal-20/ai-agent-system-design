<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="940px" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">Run 与 Operation：停止追求目标，不等于外部效果消失</title><desc id="desc">两套状态机分别回答“是否继续执行”与“外部世界发生了什么”</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="940" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Run 与 Operation：停止追求目标，不等于外部效果消失</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">两套状态机分别回答“是否继续执行”与“外部世界发生了什么”</text><rect x="45" y="125" width="1350" height="330" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="159" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Run 生命周期：执行权、等待与终结</text><rect x="85" y="205" width="210" height="75" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.3"/><text x="190.0" y="236" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#64748B">CREATED</text><text x="190.0" y="262" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">输入校验</text><rect x="340" y="205" width="210" height="75" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="445.0" y="236" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">READY</text><text x="445.0" y="262" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">可调度</text><rect x="595" y="205" width="210" height="75" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="700.0" y="236" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">RUNNING</text><text x="700.0" y="262" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">有效执行权</text><rect x="850" y="205" width="210" height="75" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="955.0" y="236" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">WAITING</text><text x="955.0" y="262" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">持久等待条件</text><rect x="1105" y="205" width="210" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1210.0" y="236" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">SUCCEEDED</text><text x="1210.0" y="262" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">业务验收通过</text><line x1="295" y1="242" x2="335" y2="242" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="550" y1="242" x2="590" y2="242" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="805" y1="242" x2="845" y2="242" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><path d="M955 280 L955 325 L445 325 L445 280" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="695" y="316" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#B0763A">有效事件 / 恢复后重新调度</text><path d="M700 205 L700 170 L1210 170 L1210 200" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrt)"/><text x="965" y="160" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#3F8079">满足验收与收尾</text><text x="90" y="375" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B9504A">活动态接受取消</text><line x1="275" y1="370" x2="330" y2="370" stroke="#B9504A" stroke-width="2" marker-end="url(#arrr)"/><rect x="340" y="345" width="250" height="70" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="465.0" y="376" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B9504A">CANCELLING</text><text x="465.0" y="402" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">停止派发，登记收尾</text><line x1="590" y1="380" x2="650" y2="380" stroke="#B9504A" stroke-width="2" marker-end="url(#arrr)"/><rect x="660" y="345" width="250" height="70" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="785.0" y="376" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B9504A">CANCELLED</text><text x="785.0" y="402" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">未决操作有责任归属</text><text x="1000" y="365" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">无法继续且未达目标</text><text x="1100" y="397" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B9504A">→ FAILED</text><rect x="45" y="490" width="1350" height="305" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="524" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Operation 生命周期：副作用独立收敛</text><rect x="90" y="585" width="220" height="75" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.3"/><text x="200.0" y="616" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#64748B">PLANNED</text><text x="200.0" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">已登记意图</text><rect x="370" y="585" width="220" height="75" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="480.0" y="616" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">IN_FLIGHT</text><text x="480.0" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">已开始发送</text><rect x="650" y="585" width="220" height="75" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="760.0" y="616" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">UNKNOWN</text><text x="760.0" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">不能确认结果</text><rect x="1110" y="585" width="220" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1220.0" y="616" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">SUCCEEDED</text><text x="1220.0" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">回执 / 查询确认</text><line x1="310" y1="622" x2="365" y2="622" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="590" y1="622" x2="645" y2="622" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="870" y1="622" x2="1105" y2="622" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><path d="M480 585 L480 560 L1220 560 L1220 580" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrt)"/><text x="850" y="550" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#3F8079">收到明确成功回执</text><text x="995" y="606" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#B0763A">按原操作身份对账</text><text x="90" y="730" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#64748B">明确失败 → FAILED；取消后的迟到成功只更新 Operation，不自动复活终态 Run。</text><rect x="45" y="840" width="1350" height="55" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="873" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">CANCELLED 表示正常执行停止；需要撤回外部效果时，应另建受控补偿操作。</text></svg>