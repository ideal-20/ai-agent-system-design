240" y1="580" x2="1355" y2="580" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="150" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">t0</text><line x1="310" y1="170" x2="310" y2="640" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 6"/><text x="560" y="150" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">t1</text><line x1="560" y1="170" x2="560" y2="640" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 6"/><text x="810" y="150" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">t2</text><line x1="810" y1="170" x2="810" y2="640" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 6"/><text x="1080" y="150" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">t3</text><line x1="1080" y1="170" x2="1080" y2="640" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 6"/><text x="1320" y="150" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">t4</text><line x1="1320" y1="170" x2="1320" y2="640" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="4 6"/><rect x="250" y="185" width="230" height="88" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="365.0" y="216" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">取得租约 epoch=7</text><text x="365.0" y="242" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">读取 version=42</text><rect x="490" y="185" width="210" height="88" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="595.0" y="216" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">暂停 / 失联</text><text x="595.0" y="242" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">未继续续租</text><rect x="1015" y="185" width="270" height="88" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="1150.0" y="216" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B9504A">A 恢复提交旧候选</text><text x="1150.0" y="242" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">epoch=7 / version=42</text><rect x="700" y="535" width="240" height="88" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="820.0" y="566" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">B 接手 epoch=8</text><text x="820.0" y="592" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">重新检查未决操作</text><rect x="1000" y="535" width="285" height="88" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1142.5" y="566" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">B 提交新版本</text><text x="1142.5" y="592" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">version=43</text><line x1="365" y1="273" x2="365" y2="395" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="820" y1="535" x2="820" y2="415" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><line x1="1140" y1="535" x2="1140" y2="415" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><line x1="1150" y1="273" x2="1150" y2="395" stroke="#B9504A" stroke-width="2" marker-end="url(#arrr)"/><rect x="950" y="355" width="395" height="100" rx="10" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.3"/><text x="1147" y="390" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B9504A">拒绝 A 的陈旧提交</text><text x="1147" y="422" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#B9504A">执行权与预期版本均已失效</text><text x="70" y="700" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">租约失效不会撤回已经发出的外部 I/O。下游需支持 fencing token，或使用稳定幂等身份与对账。</text><rect x="45" y="755" width="1350" height="50" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="786" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">租约分配机会；版本校验阻止覆盖；fencing 在关键资源处拒绝旧执行者。</text></svg>