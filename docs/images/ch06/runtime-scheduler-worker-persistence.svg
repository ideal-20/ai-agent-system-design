<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="800px" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Runtime、Scheduler、Worker：持续性来自持久状态</title><desc id="desc">任务由状态存储承接，Worker 只领取有界工作段；等待期间没有常驻线程</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="800" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Runtime、Scheduler、Worker：持续性来自持久状态</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">任务由状态存储承接，Worker 只领取有界工作段；等待期间没有常驻线程</text><rect x="45" y="120" width="1350" height="580" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="154" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">按职责拆开的执行运行时</text><rect x="90" y="190" width="225" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="202.5" y="221" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">触发入口</text><text x="202.5" y="247" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">用户 / 告警 / 定时器</text><rect x="380" y="190" width="260" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="510.0" y="221" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">Runtime</text><text x="510.0" y="247" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">状态转换、门禁、恢复</text><rect x="720" y="190" width="270" height="90" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="855.0" y="221" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">Scheduler</text><text x="855.0" y="247" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">就绪队列、计时器、配额</text><rect x="1070" y="190" width="250" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1195.0" y="221" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">Worker</text><text x="1195.0" y="247" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">单个有界工作段</text><line x1="315" y1="235" x2="375" y2="235" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><line x1="640" y1="235" x2="715" y2="235" stroke="#426B9A" stroke-width="2.2" marker-end="url(#arrb)"/><line x1="990" y1="235" x2="1065" y2="235" stroke="#B0763A" stroke-width="2.2" marker-end="url(#arr)"/><rect x="270" y="390" width="900" height="150" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="720" y="425" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei'