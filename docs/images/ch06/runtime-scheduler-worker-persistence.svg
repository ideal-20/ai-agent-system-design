400" fill="#64748B">受控 I/O</text><rect x="1075" y="585" width="250" height="72" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1200.0" y="616" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#B0763A">外部回执 / 人工事件</text><text x="1200.0" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">持久接纳后唤醒</text><line x1="325" y1="621" x2="410" y2="621" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="665" y1="621" x2="750" y2="621" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="980" y1="621" x2="1065" y2="621" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><path d="M1200 657 L1200 680 L542 680 L542 657" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><path d="M542 585 L542 565 L245 565 L245 330 L510 330 L510 285" fill="none" stroke="#426B9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrb)"/><rect x="45" y="735" width="1350" height="42" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="70" y="762" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">等待 5 分钟只保存 wait_id 与截止时间；Scheduler 唤醒后可由另一台 Worker 接手。</text></svg>