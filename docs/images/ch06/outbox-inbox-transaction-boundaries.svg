<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="880px" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">Outbox + Inbox：把本地承诺与重复投递接起来</title><desc id="desc">两端各自提交本地事务；网络仍可重复、延迟或断开</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="880" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Outbox + Inbox：把本地承诺与重复投递接起来</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">两端各自提交本地事务；网络仍可重复、延迟或断开</text><rect x="45" y="145" width="445" height="530" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="179" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">发送端：一次本地事务</text><rect x="950" y="145" width="445" height="530" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="970" y="179" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">接收端：一次本地事务</text><rect x="85" y="235" width="365" height="76" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="267.5" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">更新 Run / state_version</text><text x="267.5" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">共同提交或共同回滚</text><rect x="85" y="340" width="365" height="76" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="267.5" y="371" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">登记 Operation 意图</text><text x="267.5" y="397" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">共同提交或共同回滚</text><rect x="85" y="445" width="365" height="76" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="267.5" y="476" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">写 Outbox / message_id</text><text x="267.5" y="502" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">共同提交或共同回滚</text><text x="267" y="605" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#426B9A">Commit TX-A</text><rect x="555" y="255" width="325" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="717.5" y="286" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">投递器 → Queue</text><text x="717.5" y="312" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">至少一次投递</text><path d="M450 483 L520 483 L520 300 L545 300" fill="none" stroke="#426B9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrb)"/><line x1="880" y1="300" x2="980" y2="300" stroke="#B0763A" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="930" y="276" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#B0763A">消息</text><path d="M605 345 C540 400 850 440 820 350" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="720" y="440" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#B0763A">发送成功但未记账 → 可重投</text><rect x="990" y="235" width="365" height="76" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1172.5" y="266" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">Inbox 唯一键检查</text><text x="1172.5" y="292" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">consumer + source + message_id</text><rect x="990" y="340" width="365" height="76" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1172.5" y="371" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">接纳结果、推进 Run</text><text x="1172.5" y="397" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">合法转换 / Operation 与 wait 校验</text><rect x="990" y="445" width="365" height="76" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1172.5" y="476" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">写下一步 Outbox</text><text x="1172.5" y="502" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">后续推进同样持久化</text><text x="1172" y="605" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#3F8079">Commit TX-B</text><text x="720" y="550" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">重复消息复用先前结果</text><text x="720" y="582" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">不重复推进状态</text><text x="70" y="725" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#64748B">来源认证先于 Inbox 接纳；去重记录与业务状态更新必须处于同一个事务。</text><rect x="45" y="785" width="1350" height="52" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="818" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">这是可恢复的消息协议，不是跨数据库、队列和外部业务系统的端到端 exactly-once。</text></svg>