<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="900px" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Trace 连接因果链，Ledger 承担恢复依据</title><desc id="desc">一个 Run 可以跨多个 Trace；稳定的 run_id 与 operation_id 穿过重试、等待和重启</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Trace 连接因果链，Ledger 承担恢复依据</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">一个 Run 可以跨多个 Trace；稳定的 run_id 与 operation_id 穿过重试、等待和重启</text><text x="70" y="148" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#24364B">TASK-11 / RUN-11-01</text><line x1="70" y1="180" x2="1370" y2="180" stroke="#426B9A" stroke-width="2.4" marker-end="url(#arrb)"/><rect x="70" y="230" width="390" height="390" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="90" y="264" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Trace A：发送与超时</text><rect x="530" y="230" width="390" height="390" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="550" y="264" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Trace B：恢复与确认</text><rect x="990" y="230" width="380" height="390" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="1010" y="264" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Trace C：等待后继续</text><rect x="100" y="310" width="330" height="75" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="265.0" y="341" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">Step: submit_change</text><text x="265.0" y="367" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">Operation CHG-11</text><rect x="100" y="440" width="330" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="265.0" y="471" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">Attempt op-a1</text><text x="265.0" y="497" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">本地 UNKNOWN</text><line x1="265" y1="385" x2="265" y2="430" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><rect x="560" y="310" width="330" height="75" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="725.0" y="341" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">Step: query_operation</text><text x="725.0" y="367" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">沿用 CHG-11</text><rect x="560" y="440" width="330" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="725.0" y="471" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">Attempt op-a2</text><text x="725.0" y="497" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">确认成功 + v18 含 E11</text><line x1="725" y1="385" x2="725" y2="430" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><rect x="1020" y="310" width="320" height="75" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1180.0" y="341" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">Wait WAIT-11-04</text><text x="1180.0" y="367" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">14:15 唤醒</text><rect x="1020" y="440" width="320" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1180.0" y="471" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">collect_verification_window</text><text x="1180.0" y="497" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">进入新窗口验收</text><line x1="1180" y1="385" x2="1180" y2="430" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><line x1="460" y1="400" x2="520" y2="400" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="920" y1="400" x2="980" y2="400" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="265" y="570" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">批准事件通过 approval_id 关联</text><text x="725" y="570" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">重启改变 Trace，不改变 Operation</text><text x="1180" y="570" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">只记必要摘要与受控引用</text><rect x="70" y="675" width="1300" height="95" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="720" y="712" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#24364B">Execution State + Operation Ledger：可恢复的权威事实</text><text x="720" y="747" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">Trace 可采样、延迟或清理；不能仅靠 Span 判断副作用是否发生。</text><rect x="45" y="815" width="1350" height="50" rx="10" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="70" y="847" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">CHG-11 的成功与 HTTP 504 的恢复是两条独立结论；Trace 应保留这条因果边界。</text></svg>