<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="980px" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">异步竞争：先到的回调与同时到达的超时都要有归属</title><desc id="desc">共同协调记录把“检查结果、建立等待、消费等待”串行化</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="980" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">异步竞争：先到的回调与同时到达的超时都要有归属</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">共同协调记录把“检查结果、建立等待、消费等待”串行化</text><rect x="45" y="135" width="1350" height="350" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="169" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">① 回调先于响应：已经完成的操作不能再次挂起</text><rect x="100" y="225" width="280" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="240.0" y="256" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">预先持久化 Operation</text><text x="240.0" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">OBS-11-03</text><rect x="570" y="225" width="300" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="720.0" y="256" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">完成回调先到</text><text x="720.0" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">保存结果，关联原 Operation</text><rect x="1050" y="225" width="280" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1190.0" y="256" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">建立等待前检查</text><text x="1190.0" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">已完成 → 直接推进</text><line x1="380" y1="268" x2="565" y2="268" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><line x1="870" y1="268" x2="1045" y2="268" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><rect x="370" y="365" width="700" height="72" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="720" y="395" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#24364B">锁定同一协调记录 / 相同版本 CAS</text><text x="720" y="423" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">两个独立事务并不足够：必须对同一共享状态竞争</text><path d="M720 310 L720 355" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrt)"/><path d="M1190 310 L1190 400 L1080 400" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="45" y="525" width="1350" height="320" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="559" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">② 完成与超时同时到达：wait_id 只被消费一次</text><rect x="100" y="620" width="280" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="240.0" y="651" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">完成事件</text><text x="240.0" y="677" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">携带新的外部事实</text><rect x="100" y="735" width="280" height="70" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="240.0" y="766" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">超时计时器</text><text x="240.0" y="792" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">稳定事件身份</text><rect x="620" y="645" width="300" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="770.0" y="676" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">CAS consume(wait_id)</text><text x="770.0" y="702" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">只有一条路径成功</text><rect x="1080" y="620" width="260" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="1210.0" y="651" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">胜者推进 Run</text><text x="1210.0" y="677" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">检查当前终态与权限</text><path d="M380 662 L500 662 L500 690 L610 690" fill="none" stroke="#3F8079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrt)"/><path d="M380 770 L500 770 L500 720 L610 720" fill="none" stroke="#B0763A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><line x1="920" y1="685" x2="1070" y2="665" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><text x="1075" y="755" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#64748B">败者读取最新状态</text><text x="1075" y="785" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" fill="#64748B">迟到事实仍记入操作台账</text><rect x="45" y="885" width="1350" height="52" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="918" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">重复去重、实体版本和合法状态转换共同生效；终态 Run 不会被迟到结果自动复活。</text></svg>