<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="860px" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Resume、Replay、重新执行：相似入口，不同承诺</title><desc id="desc">恢复位置可以相同；是否访问现实、是否产生新决策、是否换 Run 身份必须明确</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs><rect width="1440" height="860" fill="#FFF"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#24364B">Resume、Replay、重新执行：相似入口，不同承诺</text><text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">恢复位置可以相同；是否访问现实、是否产生新决策、是否换 Run 身份必须明确</text><rect x="45" y="135" width="430" height="560" rx="14" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.3"/><text x="65" y="169" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Resume / 继续执行</text><text x="65" y="213" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#426B9A">沿原 Run 向前推进</text><rect x="100" y="255" width="320" height="70" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="260.0" y="286" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#24364B">已保存的状态 / 历史</text><text x="260.0" y="312" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">稳定操作关系与材料引用</text><line x1="260" y1="330" x2="260" y2="380" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><rect x="100" y="390" width="320" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.3"/><text x="260.0" y="421" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#426B9A">核对当前事实与权限</text><text x="260.0" y="447" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">确认未决操作 / 等待条件</text><line x1="260" y1="495" x2="260" y2="545" stroke="#426B9A" stroke-width="2" marker-end="url(#arrb)"/><text x="260" y="585" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#426B9A">继续原 Run 的下一步</text><text x="260" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">CHG-11 的既成事实继续保留</text><rect x="505" y="135" width="430" height="560" rx="14" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.3"/><text x="525" y="169" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">Replay / 历史重放</text><text x="525" y="213" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3F8079">复现已记录的状态或控制路径</text><rect x="560" y="255" width="320" height="70" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="720.0" y="286" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#24364B">已保存的状态 / 历史</text><text x="720.0" y="312" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">稳定操作关系与材料引用</text><line x1="720" y1="330" x2="720" y2="380" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><rect x="560" y="390" width="320" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.3"/><text x="720.0" y="421" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#3F8079">复用已记录模型与工具结果</text><text x="720.0" y="447" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">不把历史 I/O 再发到线上</text><line x1="720" y1="495" x2="720" y2="545" stroke="#3F8079" stroke-width="2" marker-end="url(#arrt)"/><text x="720" y="585" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#3F8079">重建状态 / 检查控制路径</text><text x="720" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">CHG-11 的既成事实继续保留</text><rect x="965" y="135" width="430" height="560" rx="14" fill="#FBF1E4" stroke="#CBD5E1" stroke-width="1.3"/><text x="985" y="169" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24364B">重新执行 / 新 Run</text><text x="985" y="213" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#B0763A">形成新的决策与执行结果</text><rect x="1020" y="255" width="320" height="70" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.3"/><text x="1180.0" y="286" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#24364B">已保存的状态 / 历史</text><text x="1180.0" y="312" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">稳定操作关系与材料引用</text><line x1="1180" y1="330" x2="1180" y2="380" stroke="#B0763A" stroke-width="2" marker-end="url(#arr)"/><rect x="1020" y="390" width="320" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="1180.0" y="421" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">创建新 Run 并复核现实</text><text x="1180.0" y="447" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">关联已有 Operation</text><line x1="1180" y1="495" x2="1180" y2="545" stroke="#B0763A" stroke-width="2" marker-end="url(#arr)"/><text x="1180" y="585" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#B0763A">新输出不等于历史复现</text><text x="1180" y="642" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#64748B">CHG-11 的既成事实继续保留</text><rect x="45" y="755" width="1350" height="60" rx="10" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.3"/><text x="70" y="791" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#B0763A">从 CHG-11 之前分叉，也不会回滚已生效的 E11；撤回必须通过新的受控补偿。</text></svg>