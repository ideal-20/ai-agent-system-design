<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">委派契约：约束向下传递，证据与责任向上汇合</title><desc id="desc">父目标保持完整；子任务获得受限范围、稳定身份和独立预算</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><rect x="40" y="130" width="1360" height="150" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><rect x="40" y="330" width="560" height="350" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><rect x="840" y="330" width="560" height="350" rx="12" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.4"/><path d="M 260 280 L 260 330" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 320 680 L 320 735 L 540 735" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 900 735 L 1120 735 L 1120 680" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1120 330 L 1120 280" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="540" y="700" width="360" height="70" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="40" y="800" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">委派契约：约束向下传递，证据与责任向上汇合</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">父目标保持完整；子任务获得受限范围、稳定身份和独立预算</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">父任务 TASK-11 / RUN-11-01</text><text x="64" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">CHG-11 已成功；v18 包含 E11；业务恢复尚未通过验收</text><text x="1120" y="178" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">整体验收责任</text><text x="1120" y="213" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">始终保留在父任务</text><text x="64" y="368" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">向下：可执行的委派契约</text><text x="64" y="399" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">请求本身不扩大权限</text><text x="70" y="425" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">目标与范围</text><text x="70" y="455" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">inst-11 / 渠道 A / READ_ONLY</text><text x="70" y="504" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">身份与修订</text><text x="70" y="534" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">DEL-11-NET-01 / revision 1</text><text x="70" y="583" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">能力与预算</text><text x="70" y="613" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">受限工具、调用上限、截止时间</text><text x="864" y="368" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">向上：可接纳的结果</text><text x="864" y="399" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">子任务完成不等于父目标完成</text><text x="870" y="425" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">版本化证据</text><text x="870" y="455" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">来源、范围、时间与完整性</text><text x="870" y="504" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">发现与缺口</text><text x="870" y="534" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">事实 / 解释 / 未解决问题</text><text x="870" y="583" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">副作用与责任</text><text x="870" y="613" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">Operation 结果、未知项、消耗</text><text x="720.0" y="742.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="700" text-anchor="middle">子任务及其独立执行状态</text><text x="720" y="425" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700" text-anchor="middle">授权交集</text><text x="720" y="468" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">父范围</text><text x="720" y="505" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">∩ 委派能力</text><text x="720" y="542" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">∩ 本地策略</text><text x="64" y="838" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">委派转移局部工作，不转移父目标的验收责任；PARTIAL 必须连同缺口一起返回。</text></svg>
