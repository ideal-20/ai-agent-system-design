<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">A2A v0.3.0：互操作对象与本地责任映射</title><desc id="desc">固定版本语义示意；Card 是声明，远程 Task 不是父业务 Task</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><rect x="40" y="130" width="520" height="630" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><rect x="650" y="130" width="750" height="630" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M 300 335 L 300 425" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 300 510 L 300 600" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 990 290 L 1060 290" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><path d="M 1205 335 L 1205 390 L 845 390 L 845 450" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 990 490 L 1060 490" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 510 465 L 700 465" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><rect x="90" y="250" width="420" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="90" y="425" width="420" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="90" y="600" width="420" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="700" y="250" width="290" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="1060" y="250" width="290" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="700" y="450" width="290" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1060" y="450" width="290" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="40" y="800" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">A2A v0.3.0：互操作对象与本地责任映射</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">固定版本语义示意；Card 是声明，远程 Task 不是父业务 Task</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">本地应用责任</text><text x="64" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">委派、授权、预算与整体验收</text><text x="300.0" y="284.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">TASK-11 / RUN-11-01</text><text x="300.0" y="316.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">父目标与权威执行状态</text><text x="300.0" y="459.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">委派关联表</text><text x="300.0" y="491.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">delegation_id ↔ 远端 task.id</text><text x="300.0" y="634.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">Operation 台账</text><text x="300.0" y="666.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">业务幂等与结果对账</text><text x="674" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">远端协议对象</text><text x="674" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">message/send 可返回 Message 或 Task</text><text x="845.0" y="284.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Agent Card</text><text x="845.0" y="316.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">能力 / 接口 / 安全方案</text><text x="1205.0" y="284.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Message</text><text x="1205.0" y="316.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">messageId / parts</text><text x="845.0" y="484.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">Task</text><text x="845.0" y="516.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">id / contextId / status</text><text x="1205.0" y="484.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">Artifact</text><text x="1205.0" y="516.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">Task 内 artifactId</text><text x="605.0" y="445" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">保存映射</text><text x="700" y="610" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">final=true：当前交互流结束，未必任务完成</text><text x="700" y="650" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">lastChunk：该产物的最后一个块，未必验收通过</text><text x="700" y="690" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">终态 Task 不可重启；取消请求不保证成功。</text><text x="64" y="838" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">协议提供公共结构；资源授权、业务幂等、取消收尾与父目标验收仍由应用落实。</text></svg>
