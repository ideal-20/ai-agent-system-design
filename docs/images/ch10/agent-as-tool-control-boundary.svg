<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Agent as Tool：专业能力嵌入一个主控制流</title><desc id="desc">调用者保持父目标；被调用者在独立上下文中完成有界子任务</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="860" fill="#FFFFFF"/><rect x="40" y="130" width="380" height="580" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><rect x="505" y="130" width="895" height="580" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 370 290 L 550 290" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 790 290 L 850 290" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 990 335 L 990 480" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1130 525 L 1250 525 L 1250 290 L 1130 290" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 900 335 L 900 380 L 820 380 L 820 550 L 790 550" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 550 550 L 370 550" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 230 505 L 230 335" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><rect x="90" y="245" width="280" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="90" y="505" width="280" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="550" y="245" width="240" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="850" y="245" width="280" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="850" y="480" width="280" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="550" y="505" width="240" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="40" y="760" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">Agent as Tool：专业能力嵌入一个主控制流</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">调用者保持父目标；被调用者在独立上下文中完成有界子任务</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">主控制域</text><text x="64" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">目标、计划、验收由主任务维护</text><text x="230.0" y="282.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">主 Agent</text><text x="230.0" y="314.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">选择调用目的与输入</text><text x="230.0" y="542.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">父任务验收</text><text x="230.0" y="574.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">检查证据与完成条件</text><text x="529" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">专业能力边界</text><text x="529" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">独立上下文 ≠ 自动安全隔离</text><text x="670.0" y="282.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">调用门禁</text><text x="670.0" y="314.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">范围 / 参数 / 预算</text><text x="990.0" y="282.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">专业 Agent</text><text x="990.0" y="314.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">内部有界推理与读取</text><text x="990.0" y="517.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">受限领域工具</text><text x="990.0" y="549.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">只允许契约声明的影响</text><text x="670.0" y="542.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">结果校验</text><text x="670.0" y="574.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">来源 / 缺口 / 状态</text><text x="460.0" y="280.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">委派</text><text x="1060" y="415" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">受限调用</text><text x="1290" y="408" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">观察</text><text x="460.0" y="540.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">有界产物</text><text x="240" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">继续 / 等待 / 完成</text><text x="550" y="650" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">内部对话可不外传；副作用、证据缺口和执行消耗必须可见。</text><text x="64" y="798" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">长调用返回可追踪任务身份；连接超时不等于远端工作尚未发生。</text></svg>
