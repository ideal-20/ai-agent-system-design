<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">并发冲突：计划版本不能代替资源版本</title><desc id="desc">写入前检查当前前提；旧结果可以留档，但不能覆盖当前有效状态</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="880" fill="#FFFFFF"/><rect x="40" y="130" width="1360" height="125" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><line x1="190" y1="330" x2="1300" y2="330" stroke="#64748B" stroke-width="2"/><path d="M 190 330 L 1320 330" fill="none" stroke="#64748B" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#gray)"/><path d="M 260 353 L 260 410" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 710 295 L 710 307" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1170 353 L 1170 410" fill="none" stroke="#B9504A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#red)"/><path d="M 430 462 L 1000 462" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><path d="M 1170 515 L 1170 610" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><circle cx="260" cy="330" r="23" fill="#F7F9FC" stroke="#64748B" stroke-width="1.5"/><circle cx="710" cy="330" r="23" fill="#F7F9FC" stroke="#64748B" stroke-width="1.5"/><circle cx="1170" cy="330" r="23" fill="#F7F9FC" stroke="#64748B" stroke-width="1.5"/><rect x="90" y="410" width="340" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="540" y="190" width="340" height="105" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1000" y="410" width="340" height="105" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="925" y="610" width="415" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="90" y="610" width="580" height="85" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="40" y="780" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">并发冲突：计划版本不能代替资源版本</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">写入前检查当前前提；旧结果可以留档，但不能覆盖当前有效状态</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">一个资源的时间线</text><text x="64" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">教学分支：当前已知 v18；后续 v19 仅用于展示并发变化</text><text x="260" y="336" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="700" text-anchor="middle">t1</text><text x="710" y="336" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="700" text-anchor="middle">t2</text><text x="1170" y="336" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="700" text-anchor="middle">t3</text><text x="260.0" y="454.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Agent A 基于 v18 预检</text><text x="260.0" y="486.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">保存 expected_version=v18</text><text x="710.0" y="234.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">Agent B / 人工更新到 v19</text><text x="710.0" y="266.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">外部资源已经变化</text><text x="1170.0" y="454.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">A 尝试按旧前提写入</text><text x="1170.0" y="486.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">条件更新拒绝：版本不匹配</text><text x="715.0" y="445" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">等待后仍须复核资源条件</text><text x="1132.5" y="644.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">重新读取与判断影响</text><text x="1132.5" y="676.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">必要时重做预检 / 审批</text><text x="380.0" y="644.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="700" text-anchor="middle">旧产物：保留 provenance + 标记适用性</text><text x="380.0" y="676.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">不得最后写入获胜，也不得重放已完成 Operation</text><text x="64" y="818" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">把生产提交集中到指定主体或严格资源分区；共享读写仍须版本校验与冲突处理。</text></svg>
