<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">远程接纳与恢复：超时之后先查询已发生的工作</title><desc id="desc">稳定委派身份用于关联；重复结果只推进一次本地状态</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="1080" fill="#FFFFFF"/><line x1="170" y1="205" x2="170" y2="885" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="720" y1="205" x2="720" y2="885" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="1270" y1="205" x2="1270" y2="885" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="6 5"/><path d="M 170 255 L 1270 255" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 170 325 L 720 325" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 720 375 L 815 375 L 815 415 L 720 415" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 720 465 L 170 465" fill="none" stroke="#B9504A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#red)"/><path d="M 170 535 L 720 535" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 720 605 L 170 605" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 170 675 L 1270 675" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 720 745 L 170 745" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 170 815 L 1270 815" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 1270 865 L 170 865" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><rect x="45" y="135" width="250" height="65" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="595" y="135" width="250" height="65" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="1145" y="135" width="250" height="65" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="70" y="910" width="1300" height="40" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="40" y="980" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">远程接纳与恢复：超时之后先查询已发生的工作</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">稳定委派身份用于关联；重复结果只推进一次本地状态</text><text x="170.0" y="174.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">父 Runtime</text><text x="720.0" y="174.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">远程 Agent 服务</text><text x="1270.0" y="174.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">委派 / 结果存储</text><text x="720.0" y="243" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">先登记委派身份与预算</text><text x="445.0" y="313" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">提交有界子任务</text><text x="835" y="401" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="400" text-anchor="start">持久接纳并开始执行</text><text x="445.0" y="453" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B9504A" font-weight="400" text-anchor="middle">已接纳；响应丢失</text><text x="445.0" y="523" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">按约定身份查询已接纳任务</text><text x="445.0" y="593" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">结果通知 #1：远端任务身份 + 当前结果</text><text x="720.0" y="663" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">原子接纳：去重 + 修订校验 + 状态写入</text><text x="445.0" y="733" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">重复通知 #2：同一结果与修订</text><text x="720.0" y="803" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">同一原子边界：识别重复，状态不变</text><text x="720.0" y="853" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">返回已有接纳结果；不重跑副作用</text><text x="720" y="937" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="700" text-anchor="middle">若服务不支持按委派身份查询，必须另行约定受理去重与对账路径。</text><text x="64" y="1018" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">RPC ID、消息 ID 和远程 Task ID 均不自动提供外部业务效果的幂等保证。</text></svg>
