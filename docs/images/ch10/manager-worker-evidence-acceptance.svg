4748B" font-weight="400" text-anchor="middle">事实 / 来源 / 未决问题</text><text x="1200.0" y="357.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">领域 Worker</text><text x="1200.0" y="389.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">规则、适用范围</text><text x="1200.0" y="494.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">版本化证据包</text><text x="1200.0" y="526.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">事实 / 来源 / 未决问题</text><text x="720.0" y="659.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">父任务接纳检查</text><text x="720.0" y="691.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">必需证据齐备？范围一致？存在冲突？</text><text x="210.0" y="674.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">补证 / 等待 / 升级</text><text x="1230.0" y="659.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">候选结论复核</text><text x="1230.0" y="691.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">证据足够后才启动</text><text x="720" y="760" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">并行度来自真实依赖；复核者不与尚未生成的候选结论同时启动。</text><text x="64" y="838" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">子任务 SUCCEEDED 只表示局部契约完成；父任务仍需独立检查业务验收。</text></svg>
