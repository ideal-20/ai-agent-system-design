<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">并行收益与协调成本：分别看墙钟时间和总消耗</title><desc id="desc">教学示意：三个独立调查各 4 单位；协调与汇合另计，不代表实测性能</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="920" fill="#FFFFFF"/><rect x="40" y="130" width="1360" height="340" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="40" y="510" width="1360" height="270" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="260" y="195" width="280" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="548" y="195" width="280" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="836" y="195" width="280" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="260" y="290" width="288" height="35" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="260" y="333" width="288" height="35" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="260" y="376" width="288" height="35" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="563" y="315" width="160" height="60" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="260" y="590" width="420" height="70" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="680" y="590" width="220" height="70" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="900" y="590" width="220" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="1120" y="590" width="220" height="70" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="40" y="820" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">并行收益与协调成本：分别看墙钟时间和总消耗</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学示意：三个独立调查各 4 单位；协调与汇合另计，不代表实测性能</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">关键路径：并行缩短等待，需要独立任务与足够配额</text><text x="70" y="235" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">串行</text><text x="70" y="355" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">并行</text><text x="400" y="233" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">调查 A</text><text x="688" y="233" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">调查 B</text><text x="976" y="233" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">调查 C</text><text x="404" y="314" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="middle">A</text><text x="404" y="357" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="middle">B</text><text x="404" y="400" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="middle">C</text><text x="643" y="352" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">协调 + 汇合</text><text x="1190" y="233" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748B" font-weight="400" text-anchor="start">12 单位</text><text x="780" y="352" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748B" font-weight="400" text-anchor="start">4 + 额外开销</text><text x="64" y="548" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">总消耗：并行并不会删除三份调查的成本</text><text x="70" y="630" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">工作量</text><text x="470.0" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">各调查总量 = 12</text><text x="790.0" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">协调</text><text x="1010.0" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">整合</text><text x="1230.0" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700" text-anchor="middle">恢复 / 重复</text><text x="260" y="720" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">公平比较：相同资料与工具 + 明确总预算或期限 + 父任务级配对评估</text><text x="64" y="858" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">多 Agent 值得采用的证据，是可重复的任务收益超过协调、重复工作与恢复代价。</text></svg>
