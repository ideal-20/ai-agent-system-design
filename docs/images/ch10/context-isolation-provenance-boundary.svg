oke-linejoin="round" marker-end="url(#blue)"/><path d="M 720 485 L 720 550" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1170 240 L 1170 285" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1170 485 L 1170 550" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 300 735 L 300 695" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#amber)"/><path d="M 930 770 L 770 770" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="90" y="390" width="360" height="65" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="540" y="390" width="360" height="65" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="990" y="390" width="360" height="65" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="90" y="735" width="420" height="70" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="930" y="735" width="420" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="555" y="735" width="215" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="40" y="830" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">上下文隔离：局部求解，共享可追溯证据</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">原始来源与信任等级随摘要传播；授权来自独立控制路径</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">公共契约：父目标、资源范围、验收规则、已提交操作</text><text x="64" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">以版本引用下发；目标变化显式使受影响委派失效</text><text x="84" y="323" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">Agent A 上下文</text><text x="84" y="354" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">路径材料 + 局部假设</text><text x="270.0" y="429.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="700" text-anchor="middle">局部对话与临时推理</text><text x="534" y="323" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">Agent B 上下文</text><text x="534" y="354" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">配置材料 + 版本约束</text><text x="720.0" y="429.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="700" text-anchor="middle">局部对话与临时推理</text><text x="984" y="323" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">Agent C 上下文</text><text x="984" y="354" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">报告 + 验收要求</text><text x="1170.0" y="429.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="700" text-anchor="middle">局部对话与临时推理</text><text x="64" y="588" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">共享证据制品：不可变内容 + 来源 + 时间 + 范围 + 完整性</text><text x="64" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">摘要可减少 Token；原始证据按权限回查；不同意见保留分歧而非覆盖</text><text x="300.0" y="762.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">外部日志 / 网页 / 文档</text><text x="300.0" y="794.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">转述后仍是外部材料</text><text x="1140.0" y="762.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">可信身份 / 任务授权 / 策略</text><text x="1140.0" y="794.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">不从消息正文提取权限</text><text x="662.5" y="777.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">执行门禁</text><text x="64" y="868" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">不同提示词不是安全隔离；数据权限必须延伸到制品、缓存、文件与工具执行。</text></svg>
