<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">Peer Collaboration：通信对等，提交有主</title><desc id="desc">直接澄清减少转发；请求链仍要限定范围、深度、期限与决策责任</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="880" fill="#FFFFFF"/><rect x="40" y="130" width="840" height="590" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="960" y="130" width="440" height="590" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><path d="M 320 310 L 580 310" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><path d="M 580 350 L 320 350" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#teal)"/><path d="M 605 385 L 495 510" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><path d="M 395 515 L 295 385" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#blue)"/><path d="M 880 330 L 1000 330" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1180 360 L 1180 445" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><circle cx="250" cy="330" r="70" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.5"/><circle cx="650" cy="330" r="70" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.5"/><circle cx="450" cy="565" r="70" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.5"/><rect x="80" y="650" width="760" height="45" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="1000" y="270" width="360" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1000" y="445" width="360" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="40" y="780" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">Peer Collaboration：通信对等，提交有主</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">直接澄清减少转发；请求链仍要限定范围、深度、期限与决策责任</text><text x="64" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">受限 Peer 网络</text><text x="64" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">虚线表示请求或澄清，不授予共享状态写权限</text><text x="250" y="336" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">路径 Agent</text><text x="650" y="336" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">配置 Agent</text><text x="450" y="571" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">领域 Agent</text><text x="450.0" y="285" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">请求版本映射</text><text x="450.0" y="385" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">返回证据引用</text><text x="460" y="680" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">最大转发深度 + 消息预算 + 截止时间 + 循环检测</text><text x="984" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">最终决策与提交</text><text x="984" y="199" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">对等讨论不能替代验收</text><text x="1180.0" y="307.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">证据与分歧记录</text><text x="1180.0" y="339.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">来源 / 适用范围 / 未解决项</text><text x="1180.0" y="482.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">指定责任主体</text><text x="1180.0" y="514.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">接纳结论 / 批准后提交</text><text x="1000" y="600" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="start">A 等 B、B 等 C、C 等 A：</text><text x="1000" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">识别循环依赖并返回缺口，</text><text x="1000" y="659" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">不能用持续发消息冒充进展。</text><text x="64" y="818" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">Peer 允许直接交换信息；共享状态所有权、生产写入与最终验收仍须明确。</text></svg>
