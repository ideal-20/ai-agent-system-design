<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">重复引用不等于独立观察</title><desc id="desc">多数意见的价值取决于证据来源和错误相关性，而不是参与者数量</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="850" fill="#FFFFFF"/><rect x="40" y="135" width="650" height="570" rx="12" fill="#FBF1E4" stroke="#CBD5E1" stroke-width="1.4"/><rect x="750" y="135" width="650" height="570" rx="12" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.4"/><path d="M 365 325 L 365 365 L 170 365 L 170 410" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 170 480 L 170 530 L 365 530 L 365 565" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 365 325 L 365 365 L 360 365 L 360 410" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 360 480 L 360 530 L 365 530 L 365 565" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 365 325 L 365 365 L 550 365 L 550 410" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 550 480 L 550 530 L 365 530 L 365 565" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 1015 278 L 1035 278" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1015 403 L 1035 403" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1015 528 L 1035 528" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="205" y="245" width="320" height="80" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="95" y="410" width="150" height="70" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="285" y="410" width="150" height="70" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="475" y="410" width="150" height="70" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="155" y="565" width="420" height="80" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="795" y="240" width="220" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="795" y="365" width="220" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="795" y="490" width="220" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="40" y="750" width="1360" height="62" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">重复引用不等于独立观察</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">多数意见的价值取决于证据来源和错误相关性，而不是参与者数量</text><text x="64" y="173" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#B0763A" font-weight="700" text-anchor="start">同一来源被多次包装</text><text x="64" y="204" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">三个角色仍然只看见同一份材料</text><text x="365.0" y="292.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">CHG-11 成功回执</text><text x="170.0" y="452.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="700" text-anchor="middle">Agent A</text><text x="360.0" y="452.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="700" text-anchor="middle">Agent B</text><text x="550.0" y="452.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="700" text-anchor="middle">Agent C</text><text x="365.0" y="597.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">“三方赞成恢复”</text><text x="365.0" y="629.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">仍缺业务验收窗口</text><text x="365" y="685" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700" text-anchor="middle">来源数 = 1；一致意见不能补齐证据</text><text x="774" y="173" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">不同证据承担不同验证职责</text><text x="774" y="204" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">需检查来源是否共享同一上游缺陷</text><text x="905.0" y="284.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">操作台账</text><text x="1045" y="271" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">确认 CHG-11 的执行结果</text><text x="905.0" y="409.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">配置读回</text><text x="1045" y="396" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">确认 v18 包含 E11</text><text x="905.0" y="534.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">业务指标窗口</text><text x="1045" y="521" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">判断范围、样本与恢复条件</text><text x="795" y="660" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="start">各自成立后，再按父目标合成判断。</text><text x="64" y="788" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">本案业务恢复尚未通过；额外角色不能把操作成功转化为恢复事实。</text></svg>
