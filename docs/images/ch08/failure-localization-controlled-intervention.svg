<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="title desc"><title id="title">失败归因：先定位事实断点，再检验修复假设</title><desc id="desc">一个失败轨迹只能提出解释；受控重跑增加证据，但不自动证明唯一根因</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="890" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="55" y="350" width="615" height="350" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="720" y="350" width="665" height="350" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><path d="M290,245 L330,245" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M565,245 L605,245" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M840,245 L880,245" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M1115,245 L1155,245" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M1020,479 L1080,479" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">失败归因：先定位事实断点，再检验修复假设</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">一个失败轨迹只能提出解释；受控重跑增加证据，但不自动证明唯一根因</text><text x="55" y="145" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">① 沿链路寻找第一个可确认的断点</text><rect x="55" y="195" width="235" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="172.5" y="237.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">环境事实</text><text x="172.5" y="266.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">已可获得</text><rect x="330" y="195" width="235" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="447.5" y="237.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">检索候选</text><text x="447.5" y="266.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">含正确证据</text><rect x="605" y="195" width="235" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="722.5" y="237.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">实际 Context</text><text x="722.5" y="266.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">遗漏必要前提</text><rect x="880" y="195" width="235" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="997.5" y="237.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">模型决策</text><text x="997.5" y="266.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">过早完成</text><rect x="1155" y="195" width="235" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="1272.5" y="237.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">交付结果</text><text x="1272.5" y="266.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">误报恢复</text><text x="80" y="392" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">② 固定比较条件</text><text x="85" y="445" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">同一任务与初始状态</text><text x="85" y="474" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">同一工具 / 故障安排 / 资料版本</text><text x="85" y="503" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">固定候选版本与预算口径</text><text x="85" y="532" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">重复运行，保留随机性与环境漂移</text><text x="745" y="392" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">③ 每次只改变一个可解释因素</text><rect x="755" y="440" width="265" height="78" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="887.5" y="485.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">基线：原交付策略</text><rect x="1080" y="440" width="270" height="78" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1215.0" y="485.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">干预：保留完整前提</text><text x="755" y="565" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">比较结论、轨迹与成本</text><text x="755" y="593" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">改善支持该假设；同时检查其他退化</text><text x="755" y="621" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">联合改动需要消融，不能把收益归给单层</text><text x="65" y="756" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">归因报告：观察到什么 → 可能为什么 → 改了什么 → 对照证据 → 仍不能排除什么</text><rect x="40" y="807" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="840" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">失败标签是定位入口；模型输出、工具可用性与上下文选择之间可能相互影响。</text></g></svg>