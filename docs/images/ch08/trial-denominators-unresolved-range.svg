<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">同一批试验，三个比例：先看分母与未决结果</title><desc id="desc">教学数据｜计划 200；框架无效 10；有效启动 190；成功 120、失败 50、未决 20</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M65,305 L1345,305" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">同一批试验，三个比例：先看分母与未决结果</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学数据｜计划 200；框架无效 10；有效启动 190；成功 120、失败 50、未决 20</text><text x="55" y="148" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">计划 200 次 Trial</text><rect x="65" y="185" width="1215" height="64" rx="5" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="1280" y="185" width="64" height="64" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="650" y="226" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">有效启动 190</text><text x="1312" y="226" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">10</text><text x="1260" y="278" font-size="17" fill="#B0763A" font-weight="400" text-anchor="start">无效：单独报告</text><rect x="65" y="330" width="808.421052631579" height="90" rx="5" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="469.2105263157895" y="384" font-size="23" fill="#3F8079" font-weight="700" text-anchor="middle">严格成功 120</text><rect x="873.421052631579" y="330" width="336.84210526315786" height="90" rx="5" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="1041.842105263158" y="384" font-size="23" fill="#B9504A" font-weight="700" text-anchor="middle">失败 50</text><rect x="1210.2631578947369" y="330" width="134.73684210526315" height="90" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1277.6315789473686" y="384" font-size="23" fill="#B0763A" font-weight="700" text-anchor="middle">未决 20</text><text x="65" y="295" font-size="19" fill="#24364B" font-weight="700" text-anchor="start">有效启动队列的当前结局</text><rect x="65" y="490" width="400" height="220" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="90" y="533" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">已完成试验比例</text><text x="265" y="597" font-size="34" fill="#426B9A" font-weight="700" text-anchor="middle">70.6%</text><text x="265" y="648" font-size="21" fill="#24364B" font-weight="400" text-anchor="middle">120 / (120 + 50)</text><text x="265" y="684" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">未决不能静默排除</text><rect x="505" y="490" width="400" height="220" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="530" y="533" font-size="21" fill="#3F8079" font-weight="700" text-anchor="start">截止点已证明成功</text><text x="705" y="597" font-size="34" fill="#3F8079" font-weight="700" text-anchor="middle">63.2%</text><text x="705" y="648" font-size="21" fill="#24364B" font-weight="400" text-anchor="middle">120 / 190</text><text x="705" y="684" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">未决不能静默排除</text><rect x="945" y="490" width="400" height="220" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="970" y="533" font-size="21" fill="#B0763A" font-weight="700" text-anchor="start">未决结果最终范围</text><text x="1145" y="597" font-size="34" fill="#B0763A" font-weight="700" text-anchor="middle">63.2%—73.7%</text><text x="1145" y="648" font-size="21" fill="#24364B" font-weight="400" text-anchor="middle">120 / 190 到 140 / 190</text><text x="1145" y="684" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">范围不是统计置信区间</text><rect x="40" y="817" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="850" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">预先定义排除规则；任务规格中包含的依赖故障属于被测场景，不能当作框架无效删除。</text></g></svg>