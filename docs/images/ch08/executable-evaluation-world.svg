<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">可执行评估世界：Agent 看见证据，验收器掌握真值</title><desc id="desc">教学夹具 W02｜v18 包含 E11，但完整后续窗口仍未达到恢复标准</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="125" width="1360" height="120" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="40" y="290" width="860" height="420" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4" stroke-dasharray="8 6"/><rect x="950" y="290" width="450" height="420" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4" stroke-dasharray="8 6"/><path d="M310,412 L420,412" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M310,470 L350,470 L350,588 L420,588" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M635,540 L635,465" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1175,465 L1175,540" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M855,590 L985,590" fill="none" stroke="#3F8079" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-teal)"/><path d="M190,500 L190,750 L1175,750 L1175,650" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">可执行评估世界：Agent 看见证据，验收器掌握真值</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学夹具 W02｜v18 包含 E11，但完整后续窗口仍未达到恢复标准</text><text x="65" y="160" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">每次 Trial 从同一逻辑快照建立独立命名空间</text><rect x="65" y="183" width="295" height="42" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="212.5" y="209.78" font-size="17" fill="#426B9A" font-weight="700" text-anchor="middle">任务：目标、期限、预算</text><rect x="390" y="183" width="295" height="42" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="537.5" y="209.78" font-size="17" fill="#426B9A" font-weight="700" text-anchor="middle">环境：状态、事件、时钟</text><rect x="715" y="183" width="295" height="42" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="862.5" y="209.78" font-size="17" fill="#426B9A" font-weight="700" text-anchor="middle">策略：权限、审批、范围</text><rect x="1040" y="183" width="335" height="42" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1207.5" y="209.78" font-size="17" fill="#426B9A" font-weight="700" text-anchor="middle">验收：谓词、证据接口</text><text x="65" y="329" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">Agent 可交互范围（仅暴露证据接口）</text><rect x="70" y="385" width="240" height="115" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="190.0" y="434.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Agent Runtime</text><text x="190.0" y="463.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">目标 / Context / 工具</text><rect x="420" y="365" width="435" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="637.5" y="407.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">可见证据接口</text><text x="637.5" y="436.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">配置读回 / 监控查询 / 操作回执</text><rect x="420" y="540" width="435" height="110" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="637.5" y="587.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">可交互环境（内部真值不直接暴露）</text><text x="637.5" y="614.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">按参数、当前状态与事件返回响应</text><text x="330" y="393" font-size="17" fill="#426B9A" font-weight="400" text-anchor="start">读取</text><text x="325" y="550" font-size="17" fill="#426B9A" font-weight="400" text-anchor="start">动作</text><text x="655" y="510" font-size="17" fill="#3F8079" font-weight="400" text-anchor="start">观测投影</text><text x="975" y="329" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">独立评估权限域</text><rect x="985" y="365" width="380" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1175.0" y="407.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">隐藏真值与事件账本</text><text x="1175.0" y="436.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">窗口是否完整 / 实际副作用</text><rect x="985" y="540" width="380" height="110" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1175.0" y="587.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">独立验收器</text><text x="1175.0" y="616.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">结果 + 约束 + 声明证据</text><text x="873" y="566" font-size="17" fill="#3F8079" font-weight="400" text-anchor="start">只读</text><text x="490" y="741" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">提交产物与轨迹，不提交“自评通过”作为真值</text><rect x="40" y="817" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="850" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">隐藏答案不能进入 Context；猜对结果仍需证据，正确等待也不能因未猜出隐藏事实而判错。</text></g></svg>