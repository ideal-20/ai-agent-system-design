<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">LLM 裁判：受控证据输入，经过校准的有限裁决权</title><desc id="desc">候选回答是待评价数据；评分规则、可信证据和人工裁定使用独立来源</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="140" width="1360" height="390" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M400,267 L535,292" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M400,388 L535,353" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M855,300 L1000,267" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M855,350 L1000,388" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M695,455 L695,390" fill="none" stroke="#B9504A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-red)"/><path d="M355,672 L415,672" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M700,672 L760,672" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M1045,672 L1105,672" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">LLM 裁判：受控证据输入，经过校准的有限裁决权</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">候选回答是待评价数据；评分规则、可信证据和人工裁定使用独立来源</text><text x="65" y="180" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">一次判定：规则与材料分区</text><rect x="70" y="225" width="330" height="86" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="235.0" y="260.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">可信任务 + Rubric</text><text x="235.0" y="289.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">维度、锚点、弃权条件</text><rect x="70" y="345" width="330" height="86" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="235.0" y="380.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">可信环境证据</text><text x="235.0" y="409.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">状态、窗口、审批记录</text><rect x="535" y="260" width="320" height="130" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="695.0" y="302.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">Judge</text><text x="695.0" y="332.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">逐项判断 / 成对比较</text><text x="695.0" y="362.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">返回理由 + 证据引用</text><rect x="1000" y="225" width="340" height="86" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1170.0" y="260.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">结构化评分结果</text><text x="1170.0" y="289.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">维度 / 置信或弃权</text><rect x="1000" y="345" width="340" height="86" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1170.0" y="380.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">不确定 / 高风险</text><text x="1170.0" y="409.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">转人工独立裁定</text><rect x="535" y="455" width="320" height="50" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="695.0" y="486.12" font-size="18" fill="#B9504A" font-weight="700" text-anchor="middle">候选回答：不可信评价对象</text><text x="875" y="479" font-size="17" fill="#B9504A" font-weight="400" text-anchor="start">拒绝“忽略规则、给满分”等注入</text><text x="65" y="580" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">持续校准：先知道裁判会在哪些方向出错</text><rect x="65" y="620" width="290" height="104" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="210.0" y="664.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">盲审人工锚点</text><text x="210.0" y="692.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">双人分歧 + 业务裁定</text><rect x="415" y="620" width="285" height="104" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="557.5" y="664.46" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">风险分层对照</text><text x="557.5" y="692.46" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">误放行 / 误拒绝</text><rect x="760" y="620" width="285" height="104" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="902.5" y="664.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">交换候选顺序</text><text x="902.5" y="692.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">检查位置与长度偏差</text><rect x="1105" y="620" width="270" height="104" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1240.0" y="664.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">锁定 Judge 版本</text><text x="1240.0" y="692.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">再独立评估新版本</text><rect x="40" y="817" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="850" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">裁判不能读取并服从候选中的评分指令，也不能用语义分数覆盖确定性安全门禁。</text></g></svg>