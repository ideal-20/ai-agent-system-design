<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">线上评估：影子隔离副作用，灰度控制真实暴露</title><desc id="desc">稳定分配实验单位，等待真实业务结果；代理反馈与迟到结果不能替代完成证据</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="190" width="1360" height="195" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="40" y="425" width="1360" height="195" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><path d="M325,292 L415,292" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M715,292 L845,292" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M325,527 L415,527" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M715,527 L845,527" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1090,335 L1090,425" fill="none" stroke="#B0763A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-amber)"/><path d="M1090,570 L1090,650 L250,650 L250,700" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-amber)"/><path d="M430,745 L540,745" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M900,745 L1010,745" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">线上评估：影子隔离副作用，灰度控制真实暴露</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">稳定分配实验单位，等待真实业务结果；代理反馈与迟到结果不能替代完成证据</text><text x="60" y="150" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">流量与分配</text><text x="400" y="150" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">执行边界</text><text x="835" y="150" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">观察与决策</text><text x="65" y="230" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">影子执行</text><text x="65" y="465" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">受控灰度</text><rect x="65" y="250" width="260" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="195.0" y="284.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">生产输入副本</text><text x="195.0" y="312.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">标记候选版本</text><rect x="415" y="250" width="300" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="565.0" y="284.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">隔离状态 / 模拟写入</text><text x="565.0" y="312.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">不携带生产写凭据</text><rect x="845" y="250" width="495" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1092.5" y="284.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">对比证据、建议、成本与轨迹</text><text x="1092.5" y="312.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">不可把模拟效果计为生产完成</text><rect x="65" y="485" width="260" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="195.0" y="519.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">按 Task / 用户 / 组织</text><text x="195.0" y="547.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">固定分组与版本</text><rect x="415" y="485" width="300" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="565.0" y="519.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">限额真实流量</text><text x="565.0" y="547.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">同一任务不来回换组</text><rect x="845" y="485" width="495" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1092.5" y="519.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">目标结果 + 风险 + 负载</text><text x="1092.5" y="547.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">按预先门禁继续 / 暂停 / 回滚</text><text x="1115" y="397" font-size="18" fill="#B0763A" font-weight="400" text-anchor="start">验证后才增加暴露</text><rect x="70" y="700" width="360" height="90" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="250.0" y="737.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">未决与延迟结果</text><text x="250.0" y="766.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">保留观察截止与删失口径</text><rect x="540" y="700" width="360" height="90" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="720.0" y="737.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">暂停新任务 / 降低流量</text><text x="720.0" y="766.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">继续处理已发生副作用</text><rect x="1010" y="700" width="360" height="90" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="1190.0" y="737.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">回滚未来分配</text><text x="1190.0" y="766.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">不撤销已经发生的业务效果</text><rect x="40" y="837" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="870" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">影子结果帮助检查差异；生产因果结论还依赖合理分组、干扰控制与足够观察窗口。</text></g></svg>