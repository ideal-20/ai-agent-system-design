<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">允许多条正确路径：固定依赖与禁令，不固定查询顺序</title><desc id="desc">教学性轨迹示意｜“恢复声明”仅在全部业务谓词已通过的假设分支中允许</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="55" y="495" width="1305" height="260" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M330,245 L375,245" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M520,245 L565,245" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M710,245 L780,245 L780,312 L855,312" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M330,390 L375,390" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M520,390 L565,390" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M710,390 L780,390 L780,312 L855,312" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M350,617 L440,617" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M1070,617 L1160,617" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">允许多条正确路径：固定依赖与禁令，不固定查询顺序</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学性轨迹示意｜“恢复声明”仅在全部业务谓词已通过的假设分支中允许</text><text x="55" y="150" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">可交换：独立只读查询</text><text x="850" y="150" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">不可交换：授权与验收依赖</text><text x="60" y="253" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">路径 A</text><rect x="185" y="205" width="145" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="257.5" y="252.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">日志</text><rect x="375" y="205" width="145" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="447.5" y="252.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">配置</text><rect x="565" y="205" width="145" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="637.5" y="252.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">监控</text><text x="60" y="398" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">路径 B</text><rect x="185" y="350" width="145" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="257.5" y="397.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">监控</text><rect x="375" y="350" width="145" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="447.5" y="397.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">日志</text><rect x="565" y="350" width="145" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="637.5" y="397.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">配置</text><rect x="855" y="260" width="505" height="104" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1107.5" y="304.14" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">同一组证据与结果不变量</text><text x="1107.5" y="334.14" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">范围正确 / 版本正确 / 结论有依据</text><text x="80" y="538" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">任何合法轨迹都必须满足这些偏序关系</text><rect x="85" y="580" width="265" height="75" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="217.5" y="623.62" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">批准绑定资源 / 参数 / 版本</text><rect x="440" y="580" width="265" height="75" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="572.5" y="623.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">目标系统接受生产写入</text><text x="395" y="598" font-size="16" fill="#B0763A" font-weight="700" text-anchor="middle">早于</text><rect x="805" y="580" width="265" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="937.5" y="623.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">读回 + 完整窗口通过</text><rect x="1160" y="580" width="175" height="75" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1247.5" y="623.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">恢复声明</text><text x="1115" y="598" font-size="16" fill="#3F8079" font-weight="700" text-anchor="middle">早于</text><text x="85" y="708" font-size="19" fill="#B9504A" font-weight="400" text-anchor="start">全程禁止：越权写入、重复业务效果、泄露后再补正确报告、把 UNKNOWN 改成已完成。</text><rect x="40" y="817" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="850" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">事件版本和目标系统提交顺序用于判断先后；最终状态正确，不能洗掉中途违规。</text></g></svg>