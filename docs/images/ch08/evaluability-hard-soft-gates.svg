<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">评估门禁：可评估性 → 硬约束 → 软性质量</title><desc id="desc">严重违规不能被表达、引用或速度得分平均掉；失败样本仍可保留诊断分项</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="850" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M395,242 L555,242" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M880,242 L1040,242" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M232,295 L232,425" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M717,295 L717,425" fill="none" stroke="#B9504A" stroke-width="2" marker-end="url(#a-red)"/><path d="M1202,295 L1202,340 L1020,340 L1020,557" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round"/><path d="M1020,407 L1050,407" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1020,482 L1050,482" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1020,557 L1050,557" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">评估门禁：可评估性 → 硬约束 → 软性质量</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">严重违规不能被表达、引用或速度得分平均掉；失败样本仍可保留诊断分项</text><rect x="70" y="190" width="325" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="232.5" y="249.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">① 环境与证据可评估？</text><rect x="555" y="190" width="325" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="717.5" y="249.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">② 必需条件与禁令通过？</text><rect x="1040" y="190" width="325" height="105" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1202.5" y="249.64" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">③ 分别报告软性质量</text><text x="465" y="221" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">是</text><text x="960" y="221" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">是</text><rect x="70" y="425" width="325" height="130" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="232.5" y="467.8" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">评估无效 / 待裁定</text><text x="232.5" y="496.8" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">保留材料缺口</text><text x="232.5" y="525.8" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">不生成伪精确总分</text><text x="252" y="362" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">否</text><rect x="555" y="425" width="325" height="130" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="717.5" y="467.8" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">失败 + 严重级别</text><text x="717.5" y="496.8" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">越权 / 重复副作用</text><text x="717.5" y="525.8" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">目标或证据条件未满足</text><text x="737" y="362" font-size="18" fill="#B9504A" font-weight="700" text-anchor="start">否</text><rect x="1050" y="380" width="305" height="54" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1202.5" y="413.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">结果质量</text><rect x="1050" y="455" width="305" height="54" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1202.5" y="488.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">效率与成本</text><rect x="1050" y="530" width="305" height="54" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1202.5" y="563.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">交付可用性</text><rect x="70" y="625" width="1295" height="96" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="95" y="663" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">发布判定保留层级，诊断报告保留维度</text><text x="95" y="698" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">业务达成、策略约束、证据充分性与时间要求先满足；局部软分用来定位改进方向。</text><rect x="40" y="767" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="800" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">评分规则应在测试前固定；不能在失败之后改变权重，把失败重新解释成成功。</text></g></svg>