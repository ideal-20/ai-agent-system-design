<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">有限样本的两种不确定性：成功率区间与零事故上界</title><desc id="desc">教学数值｜两面板均依赖近似独立、来自目标分布的二元试验；不修复泄漏或标签偏差</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="940" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="140" width="660" height="655" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="730" y="140" width="670" height="655" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M95.0,445 L95.0,458" fill="none" stroke="#64748B" stroke-width="2"/><path d="M204.99999999999997,445 L204.99999999999997,458" fill="none" stroke="#64748B" stroke-width="2"/><path d="M314.99999999999994,445 L314.99999999999994,458" fill="none" stroke="#64748B" stroke-width="2"/><path d="M425.00000000000006,445 L425.00000000000006,458" fill="none" stroke="#64748B" stroke-width="2"/><path d="M535.0,445 L535.0,458" fill="none" stroke="#64748B" stroke-width="2"/><path d="M645.0,445 L645.0,458" fill="none" stroke="#64748B" stroke-width="2"/><path d="M95,445 L645,445" fill="none" stroke="#64748B" stroke-width="2"/><path d="M267.65090097132236,370 L452.0026750148355,370" fill="none" stroke="#426B9A" stroke-width="7"/><path d="M267.65090097132236,349 L267.65090097132236,391" fill="none" stroke="#426B9A" stroke-width="2"/><path d="M452.0026750148355,349 L452.0026750148355,391" fill="none" stroke="#426B9A" stroke-width="2"/><path d="M815,570.0 L1335,570.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M815,480.0 L1335,480.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M815,390.0 L1335,390.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M815,300.0 L1335,300.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M815.0,304.3825535366406 L820.7777777777778,328.20212994359014 L826.5555555555555,348.101390499093 L832.3333333333334,364.9745361789372 L838.1111111111111,379.46304439618086 L843.8888888888889,392.0390565194235 L849.6666666666666,403.05779330246577 L855.4444444444445,412.7916365463657 L861.2222222222222,421.4529462390358 L867.0,429.2097299192352 L872.7777777777778,436.1966469185512 L878.5555555555555,442.522891247011 L884.3333333333334,448.27793941439484 L890.1111111111111,453.53580869580276 L895.8888888888889,458.35825754631867 L901.6666666666666,462.797222565174 L907.4444444444445,466.8966963548826 L913.2222222222222,470.694190414846 L919.0,474.22188624955754 L924.7777777777778,477.50754955703405 L930.5555555555555,480.5752624998805 L936.3333333333334,483.44601493663424 L942.1111111111111,486.13818532004285 L947.8888888888889,488.6679345590385 L953.6666666666666,491.0495306840043 L959.4444444444445,493.2956180949423 L965.2222222222222,495.4174421228789 L971.0,497.42503732426485 L976.7777777777778,499.32738616258416 L982.5555555555555,501.1325533717335 L988.3333333333333,502.84780024080396 L994.1111111111111,504.47968223569956 L999.8888888888889,506.03413272482396 L1005.6666666666666,507.516535063022 L1011.4444444444445,508.93178487953077 L1017.2222222222222,510.28434408865223 L1023.0,511.5782878786123 L1028.7777777777778,512.8173457210464 L1034.5555555555557,514.0049372703763 L1040.3333333333333,515.1442038808377 L1046.111111111111,516.2380363528537 L1051.888888888889,517.28909942475 L1057.6666666666667,518.2998534466835 L1063.4444444444443,519.2725736078812 L1069.2222222222222,520.2093670334674 L1075.0,521.1121880212836 L1080.7777777777778,521.9828516505778 L1086.5555555555557,522.8230459619793 L1092.3333333333333,523.634342880734 L1098.111111111111,524.4182080319462 L1103.888888888889,525.1760095767484 L1109.6666666666667,525.9090261814752 L1115.4444444444443,526.6184542175125 L1121.2222222222222,527.3054142770687 L1127.0,527.970957079532 L1132.7777777777778,528.6160688338861 L1138.5555555555557,529.2416761147448 L1144.3333333333333,529.8486503027038 L1150.111111111111,530.4378116337614 L1155.888888888889,531.00993289739 L1161.6666666666665,531.5657428182978 L1167.4444444444443,532.1059291530271 L1173.2222222222222,532.6311415290273 L1179.0,533.1419940508697 L1184.7777777777778,533.6390676955739 L1190.5555555555557,534.1229125166885 L1196.3333333333333,534.5940496747124 L1202.111111111111,535.0529733096104 L1207.888888888889,535.5001522695658 L1213.6666666666667,535.9360317086831 L1219.4444444444443,536.3610345650941 L1225.2222222222222,536.7755629297669 L1231.0,537.1799993153525 L1236.7777777777778,537.5747078334674 L1242.5555555555557,537.9600352880374 L1248.3333333333335,538.3363121915968 L1254.111111111111,538.7038537108133 L1259.888888888889,539.0629605469118 L1265.6666666666667,539.413919756172 L1271.4444444444443,539.7570055152056 L1277.2222222222222,540.092479835304 L1283.0,540.4205932297554 L1288.7777777777778,540.7415853377203 L1294.5555555555557,541.0556855079186 L1300.3333333333333,541.3631133451189 L1306.111111111111,541.6640792221682 L1311.888888888889,541.9587847600694 L1317.6666666666667,542.2474232784119 L1323.4444444444443,542.5301802182612 L1329.2222222222222,542.807233539463 L1335.0,543.078754094142" fill="none" stroke="#B0763A" stroke-width="3" stroke-linejoin="round"/><path d="M930.5555555555555,480.5752624998805 L930.5555555555555,570" fill="none" stroke="#B9504A" stroke-width="2" stroke-dasharray="7 6"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">有限样本的两种不确定性：成功率区间与零事故上界</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学数值｜两面板均依赖近似独立、来自目标分布的二元试验；不修复泄漏或标签偏差</text><text x="65" y="180" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">100 个任务成功 75 个</text><text x="65" y="216" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">95% Wilson 区间：约 65.7%—82.5%</text><text x="95.0" y="485" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">50%</text><text x="204.99999999999997" y="485" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">60%</text><text x="314.99999999999994" y="485" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">70%</text><text x="425.00000000000006" y="485" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">80%</text><text x="535.0" y="485" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">90%</text><text x="645.0" y="485" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">100%</text><circle cx="370.0" cy="370" r="9" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><text x="370.0" y="324" font-size="24" fill="#3F8079" font-weight="700" text-anchor="middle">点估计 75%</text><text x="267.65090097132236" y="420" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">65.7%</text><text x="452.0026750148355" y="420" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">82.5%</text><text x="65" y="560" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">95% 是区间构造方法的长期覆盖性质。</text><text x="65" y="587" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">不是“这个已算出的区间有 95% 概率含真值”。</text><text x="65" y="614" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">任务变体相关时，应按来源组设计重采样。</text><text x="755" y="180" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">300 次试验，观察到 0 次事故</text><text x="755" y="216" font-size="20" fill="#B0763A" font-weight="700" text-anchor="start">一侧 95% 上界：1 − 0.05^(1/n)</text><text x="802" y="575.0" font-size="16" fill="#64748B" font-weight="400" text-anchor="end">0%</text><text x="802" y="485.0" font-size="16" fill="#64748B" font-weight="400" text-anchor="end">1%</text><text x="802" y="395.0" font-size="16" fill="#64748B" font-weight="400" text-anchor="end">2%</text><text x="802" y="305.0" font-size="16" fill="#64748B" font-weight="400" text-anchor="end">3%</text><text x="815.0" y="600" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">100</text><text x="930.5555555555555" y="600" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">300</text><text x="1103.888888888889" y="600" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">600</text><text x="1335.0" y="600" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">1000</text><circle cx="930.5555555555555" cy="480.5752624998805" r="7" fill="#B9504A" stroke="#B9504A" stroke-width="1.4"/><text x="955.5555555555555" y="457.5752624998805" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">n=300 → 0.9936%</text><text x="755" y="660" font-size="19" fill="#B0763A" font-weight="700" text-anchor="start">零次观察 ≠ 零风险</text><text x="755" y="688" font-size="19" fill="#B0763A" font-weight="700" text-anchor="start">约 3/n 只是近似；共同缺陷可能破坏假设。</text><rect x="40" y="857" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="890" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">两幅图都表达有限证据；高风险发布还需要专门场景、控制层验证与线上限制。</text></g></svg>