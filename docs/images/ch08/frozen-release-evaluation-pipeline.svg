<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="title desc"><title id="title">回归发布：冻结整个行为配置，独立运行与验收</title><desc id="desc">候选不能读取测试答案、其他 Trial 状态或评估服务凭据；结果不能由候选自报通过</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="890" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="135" width="405" height="580" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="500" y="135" width="480" height="580" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="1035" y="135" width="365" height="580" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M740,316 L740,390" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M740,476 L740,550" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M420,605 L475,605 L475,273 L550,273" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M930,593 L1000,593 L1000,280 L1060,280" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M1217,330 L1217,390" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M1217,490 L1217,560" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">回归发布：冻结整个行为配置，独立运行与验收</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">候选不能读取测试答案、其他 Trial 状态或评估服务凭据；结果不能由候选自报通过</text><text x="65" y="175" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">冻结发布与评估输入</text><rect x="65" y="220" width="355" height="55" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="242.5" y="253.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">Runtime / 编排 / 状态 Schema</text><rect x="65" y="295" width="355" height="55" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="242.5" y="328.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">模型 / Prompt / Tool Schema</text><rect x="65" y="370" width="355" height="55" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="242.5" y="403.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">知识索引 / 策略 / 预算</text><rect x="65" y="445" width="355" height="55" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="242.5" y="478.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">数据集 + 验收器 + Judge 版本</text><rect x="65" y="565" width="355" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="242.5" y="611.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">不可变发布清单 + 摘要</text><text x="525" y="175" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">隔离 Trial 与独立判定</text><rect x="550" y="230" width="380" height="86" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="740.0" y="279.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">运行器：重置环境后执行</text><rect x="550" y="390" width="380" height="86" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="740.0" y="439.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">独立验收：结果 + 轨迹</text><rect x="550" y="550" width="380" height="86" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="740.0" y="599.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">统计：分母 / 区间 / 风险切片</text><text x="1060" y="175" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">发布裁决</text><rect x="1060" y="230" width="315" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="1217.5" y="272.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">硬门禁</text><text x="1217.5" y="301.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">严重违规 / 关键退化</text><rect x="1060" y="390" width="315" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1217.5" y="446.46" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">结果 + 成本 + 运行负载</text><rect x="1060" y="560" width="315" height="76" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1217.5" y="604.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">允许灰度 / 拒绝发布</text><text x="65" y="764" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">报告绑定同一份清单：不得用 Prompt A 的分数，证明模型 B 与工具 C 的组合已经通过。</text><rect x="40" y="807" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="840" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">无效评估可按已定义规则恢复；不能重复重跑失败样本，直到偶然成功才记入报告。</text></g></svg>