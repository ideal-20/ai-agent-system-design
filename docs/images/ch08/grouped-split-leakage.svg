<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc"><title id="title">数据切分：同源变体必须一起跨越边界</title><desc id="desc">同一事故的改写、角色变化和超时分支仍然相关；换实体名不等于独立测试</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="880" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="170" width="660" height="560" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="730" y="170" width="670" height="560" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M220,298 L280,267" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M220,298 L485,306" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M220,298 L280,345" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M910,298 L970,298" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M220,428 L280,397" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M220,428 L485,436" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M220,4