 text-anchor="middle">事故 C</text><text x="832.5" y="578.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">3 个变体</text><rect x="1175" y="510" width="165" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1257.5" y="550.12" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">C-1 / C-2</text><text x="1257.5" y="577.12" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">C-3</text><text x="70" y="688" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">同一根因、文档与验收逻辑泄漏</text><text x="760" y="688" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">整个来源组只归属一个数据分区</text><rect x="40" y="797" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="830" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">时间切分还要限制资料可用时点：不能用未来批准的复盘评估过去版本。</text></g></svg>