 stroke="#3F8079" stroke-width="1.4"/><circle cx="223.88888888888889" cy="239.60000000000002" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="332.77777777777777" cy="223.92000000000002" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="441.66666666666663" cy="220.78400000000005" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="550.5555555555555" cy="220.15679999999998" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="659.4444444444445" cy="220.03135999999995" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="768.3333333333333" cy="220.00627200000002" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="877.2222222222223" cy="220.0012544" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="986.1111111111111" cy="220.00025087999995" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="1095.0" cy="220.000050176" r="5" fill="#3F8079" stroke="#3F8079" stroke-width="1.4"/><circle cx="115.0" cy="318.0" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="223.88888888888889" cy="396.3999999999999" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="332.77777777777777" cy="459.11999999999995" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="441.66666666666663" cy="509.29599999999994" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="550.5555555555555" cy="549.4368" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="659.4444444444445" cy="581.54944" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="768.3333333333333" cy="607.239552" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="877.2222222222223" cy="627.7916415999999" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="986.1111111111111" cy="644.23331328" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><circle cx="1095.0" cy="657.3866506239999" r="5" fill="#426B9A" stroke="#426B9A" stroke-width="1.4"/><text x="565.5555555555555" y="410" font-size="20" fill="#B0763A" font-weight="700" text-anchor="start">k = 5</text><rect x="1130" y="200" width="265" height="232" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1150" y="239" font-size="21" fill="#3F8079" font-weight="700" text-anchor="start">至少一次成功</text><text x="1150" y="269" font-size="21" fill="#3F8079" font-weight="700" text-anchor="start">1 − (1 − p)^k</text><text x="1150" y="345" font-size="24" fill="#3F8079" font-weight="700" text-anchor="start">k=5：99.968%</text><text x="1150" y="393" font-size="18" fill="#3F8079" font-weight="400" text-anchor="start">需要可靠选择器</text><rect x="1130" y="475" width="265" height="232" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1150" y="514" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">全部成功</text><text x="1150" y="544" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">p^k</text><text x="1150" y="620" font-size="24" fill="#426B9A" font-weight="700" text-anchor="start">k=5：32.768%</text><text x="1150" y="668" font-size="18" fill="#426B9A" font-weight="400" text-anchor="start">考察一致稳定完成</text><text x="115" y="791" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">经验组合估计：pass@k = 1 − C(n−c,k)/C(n,k)；pass^k = C(c,k)/C(n,k)，要求 n ≥ k。</text><rect x="40" y="837" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="870" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">曲线不是业务实测结果；共享故障、环境污染与试验相关性会破坏独立假设。</text></g></svg>