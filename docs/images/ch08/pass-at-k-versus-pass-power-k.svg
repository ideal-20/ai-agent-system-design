<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">pass@k 与 pass^k：至少一次成功，不等于每次都成功</title><desc id="desc">理论曲线：固定任务 p = 0.8，各次试验独立且分布稳定；重复发生在隔离重置环境</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M115,710 L1095,710" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M115,612.0 L1095,612.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M115,514.0 L1095,514.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M115,416.0 L1095,416.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M115,318.0 L1095,318.0" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M115,220 L1095,220" fill="none" stroke="#CBD5E1" stroke-width="1"/><path d="M115.0,710 L115.0,718" fill="none" stroke="#64748B" stroke-width="2"/><path d="M223.88888888888889,710 L223.88888888888889,718" fill="none" stroke="#64748B" stroke-width="2"/><path d="M332.77777777777777,710 L332.77777777777777,718" fill="none" stroke="#64748B" stroke-width="2"/><path d="M441.66666666666663,710 L441.66666666666663,