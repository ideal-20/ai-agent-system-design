<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">模型路由：先判资格，再在合格集合内优化</title><desc id="desc">Fallback 重新走同一组硬约束；容量与预算还需派发时原子许可</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M205,235 L205,305" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M540,235 L540,305" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M875,235 L875,305" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M1210,235 L1210,305" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M280,475 L280,560" fill="none" stroke="#B9504A" stroke-width="2" marker-end="url(#a-red)"/><path d="M735,475 L735,560" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M915,617 L1000,617" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1180,675 L1180,750 L1400,750 L1400,515 L1050,515 L1050,475" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-amber)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">模型路由：先判资格，再在合格集合内优化</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Fallback 重新走同一组硬约束；容量与预算还需派发时原子许可</text><rect x="65" y="165" width="280" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="205.0" y="207.48" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">模型 A</text><rect x="400" y="165" width="280" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="540.0" y="207.48" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">模型 B</text><rect x="735" y="165" width="280" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="875.0" y="207.48" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">模型 C</text><rect x="1070" y="165" width="280" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1210.0" y="207.48" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">模型 D</text><rect x="65" y="305" width="1310" height="170" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="90" y="347" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">硬资格筛选：不能被延迟或价格收益抵消</text><rect x="90" y="385" width="285" height="53" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="232.5" y="417.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">身份 / 租户授权</text><rect x="415" y="385" width="285" height="53" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="557.5" y="417.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">数据分类 / 区域</text><rect x="740" y="385" width="285" height="53" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="882.5" y="417.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">上下文 / 工具 / Schema</text><rect x="1065" y="385" width="285" height="53" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1207.5" y="417.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">批准模型与版本</text><rect x="80" y="560" width="390" height="115" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="275.0" y="609.48" font-size="22" fill="#B9504A" font-weight="700" text-anchor="middle">不合格候选</text><text x="275.0" y="640.48" font-size="22" fill="#B9504A" font-weight="700" text-anchor="middle">拒绝进入路由集合</text><rect x="555" y="560" width="360" height="115" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="735.0" y="609.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">合格集合 M_eligible</text><text x="735.0" y="639.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">质量门槛 + 成本 / 延迟</text><rect x="1000" y="560" width="360" height="115" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1180.0" y="609.64" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">派发前许可</text><text x="1180.0" y="639.64" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">容量 + 预算 + 期限</text><text x="680" y="790" font-size="19" fill="#B0763A" font-weight="400" text-anchor="start">端点失败 → 检查 Step 仍有效 → 新 Attempt → 重新筛选</text><rect x="40" y="837" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="870" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">合格集合为空时，选择等待、确定性降级或明确失败；不能自动跨区域发送数据。</text></g></svg>