<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">预算预留：两名 Worker 看见 100，可只承诺一次 80</title><desc id="desc">教学账本 B=1000、已结算 S=700、有效预留 R=200；A=B−S−R=100</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="860" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M390,440 L535,480" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M390,630 L535,580" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M905,480 L1050,440" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M905,580 L1050,630" fill="none" stroke="#B9504A" stroke-width="2" marker-end="url(#a-red)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">预算预留：两名 Worker 看见 100，可只承诺一次 80</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学账本 B=1000、已结算 S=700、有效预留 R=200；A=B−S−R=100</text><text x="65" y="150" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">调用前：可用额度 100</text><rect x="65" y="190" width="805" height="85" rx="3" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="467.5" y="240" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">已结算 S=700</text><rect x="870" y="190" width="230" height="85" rx="3" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="985.0" y="240" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">已预留 R=200</text><rect x="1100" y="190" width="115" height="85" rx="3" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1157.5" y="240" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">可用 A=100</text><rect x="70" y="385" width="320" height="110" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="230.0" y="431.82" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">Worker A</text><text x="230.0" y="463.82" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">申请预留 80</text><rect x="70" y="575" width="320" height="110" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="230.0" y="621.82" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">Worker B</text><text x="230.0" y="653.82" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">申请预留 80</text><rect x="535" y="400" width="370" height="260" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="720.0" y="489.82" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">同一原子边界</text><text x="720.0" y="521.8199999999999" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">检查可用额 ≥ r</text><text x="720.0" y="553.8199999999999" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">写入唯一预留记录</text><text x="720.0" y="585.8199999999999" font-size="23" fill="#426B9A" font-weight="700" text-anchor="middle">更新账户预留总额</text><rect x="1050" y="385" width="320" height="110" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1210.0" y="431.98" font-size="22" fill="#3F8079" font-weight="700" text-anchor="middle">A 先提交成功</text><text x="1210.0" y="462.98" font-size="22" fill="#3F8079" font-weight="700" text-anchor="middle">R=280，A=20</text><rect x="1050" y="575" width="320" height="110" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="1210.0" y="621.98" font-size="22" fill="#B9504A" font-weight="700" text-anchor="middle">B 检查失败</text><text x="1210.0" y="652.98" font-size="22" fill="#B9504A" font-weight="700" text-anchor="middle">不得派发收费调用</text><text x="65" y="755" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">失败窗口：先发请求、后记费用，或超时立即释放未决预留，都会允许并发花掉同一笔额度。</text><rect x="40" y="777" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="810" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">此图假设 A 先获得事务许可；也可由 B 先获得，但两笔 80 不能同时在可用额 100 下获批。</text></g></svg>