<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc"><title id="title">资源治理：接纳、排队、公平分配与上游容量分开</title><desc id="desc">请求数、Token 速率、在途并发和预算是不同约束；优先级来自可信策略</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="930" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="350" y="145" width="410" height="550" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="1165" y="155" width="225" height="540" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><path d="M285,271 L320,271 L320,435 L350,435" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M760,420 L840,355" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M1085,355 L1185,285" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1085,355 L1185,405" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1085,355 L1185,525" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">资源治理：接纳、排队、公平分配与上游容量分开</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">请求数、Token 速率、在途并发和预算是不同约束；优先级来自可信策略</text><rect x="55" y="215" width="230" height="112" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="170.0" y="249.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">任务接入</text><text x="170.0" y="277.46000000000004" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">输入规模 / 活跃任务</text><text x="170.0" y="305.46000000000004" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">排队期限</text><text x="375" y="185" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">租户逻辑队列</text><text x="375" y="220" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">支付运维</text><rect x="375" y="235" width="44" height="55" rx="5" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="430" y="235" width="44" height="55" rx="5" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="485" y="235" width="44" height="55" rx="5" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="375" y="330" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">按类型、期限与等待时间排序</text><text x="375" y="370" font-size="20" fill="#B0763A" font-weight="700" text-anchor="start">批量报告</text><rect x="375" y="385" width="44" height="55" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="430" y="385" width="44" height="55" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="485" y="385" width="44" height="55" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="540" y="385" width="44" height="55" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="595" y="385" width="44" height="55" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="650" y="385" width="44" height="55" rx="5" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="375" y="480" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">按类型、期限与等待时间排序</text><text x="375" y="520" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">代码解释</text><rect x="375" y="535" width="44" height="55" rx="5" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="430" y="535" width="44" height="55" rx="5" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="485" y="535" width="44" height="55" rx="5" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="540" y="535" width="44" height="55" rx="5" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="375" y="630" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">按类型、期限与等待时间排序</text><rect x="840" y="270" width="245" height="170" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="962.5" y="317.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">公平调度</text><text x="962.5" y="347.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">权重 / 轮转</text><text x="962.5" y="377.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">在途上限</text><text x="962.5" y="407.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">防饥饿</text><text x="1185" y="195" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">执行容量</text><rect x="1185" y="245" width="185" height="80" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1277.5" y="291.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">Worker 槽位</text><rect x="1185" y="365" width="185" height="80" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1277.5" y="411.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">模型并发</text><rect x="1185" y="485" width="185" height="80" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1277.5" y="531.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">工具配额</text><rect x="55" y="755" width="1335" height="75" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="80" y="799" font-size="21" fill="#B0763A" font-weight="700" text-anchor="start">预计排队 + 执行已超过期限 → 明确拒绝 / 延期；已受理任务仍有稳定身份与状态查询。</text><rect x="40" y="847" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="880" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">长等待释放 Worker；到期验证可保留读取容量，不必一直占用模型连接。</text></g></svg>