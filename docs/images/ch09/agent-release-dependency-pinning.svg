<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">Agent Release：用依赖清单固定一组相容能力</title><desc id="desc">发布清单表达意图；每次运行仍记录实际模型、工具与策略版本</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M340,412 L495,412" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M815,412 L885,412 L885,197.5 L960,197.5" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M815,412 L885,412 L885,362.5 L960,362.5" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M815,412 L885,412 L885,527.5 L960,527.5" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-amber)"/><path d="M815,412 L885,412 L885,692.5 L960,692.5" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">Agent Release：用依赖清单固定一组相容能力</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">发布清单表达意图；每次运行仍记录实际模型、工具与策略版本</text><rect x="70" y="340" width="270" height="145" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="205.0" y="389.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">RUN-11-01</text><text x="205.0" y="419.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">绑定 Release 3.4.2</text><text x="205.0" y="449.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">恢复不自动换版本</text><rect x="495" y="330" width="320" height="165" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="655.0" y="389.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">Agent Release 3.4.2</text><text x="655.0" y="419.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">不可变清单 + 制品摘要</text><text x="655.0" y="449.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">评估与兼容性证据</text><text x="385" y="390" font-size="19" fill="#426B9A" font-weight="700" text-anchor="start">pin</text><rect x="960" y="150" width="360" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1140.0" y="203.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Runtime / 编排 / State v5</text><rect x="960" y="315" width="360" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1140.0" y="368.96" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Context / Prompt / Model Profile</text><rect x="960" y="480" width="360" height="95" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1140.0" y="533.96" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">Tool 版本 + 副作用契约</text><rect x="960" y="645" width="360" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1140.0" y="698.96" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">验收 / 策略 / 预算版本</text><rect x="65" y="650" width="730" height="110" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="90" y="688" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">清单摘要绑定内容，来源证明记录构建输入和过程</text><text x="90" y="729" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">两者都不能替代行为回归、安全门禁或业务验收。</text><rect x="40" y="837" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="870" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">工具 Schema 相容不等于行为相容：默认超时、错误语义、幂等和权限变化都可能要求新版本。</text></g></svg>