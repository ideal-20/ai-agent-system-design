<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">控制面故障：有效配置可有界继续，缺失许可必须暂停</title><desc id="desc">缓存“最后有效版本”需要签名、版本、期限与撤销策略；不能无条件 fail-open</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="960" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="55" y="145" width="440" height="220" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><path d="M495,255 L620,255" fill="none" stroke="#426B9A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><path d="M495,390 L620,390" fill="none" stroke="#B9504A" stroke-width="2" stroke-dasharray="7 6"/><path d="M295,512 L360,512" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M295,642 L360,642" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M295,772 L360,772" fill="none" stroke="#B9504A" stroke-width="2" marker-end="url(#a-red)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">控制面故障：有效配置可有界继续，缺失许可必须暂停</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">缓存“最后有效版本”需要签名、版本、期限与撤销策略；不能无条件 fail-open</text><text x="80" y="185" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">控制面：Registry / 策略 / 配额</text><rect x="80" y="235" width="390" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="275.0" y="269.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">不可变配置包</text><text x="275.0" y="299.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">验证后原子切换</text><rect x="620" y="185" width="680" height="130" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="960.0" y="241.98" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">数据面缓存</text><text x="960.0" y="272.98" font-size="22" fill="#426B9A" font-weight="700" text-anchor="middle">版本 + 签名验证 + 获取时间 + 有效期限</text><text x="520" y="228" font-size="17" fill="#426B9A" font-weight="400" text-anchor="start">分发</text><text x="80" y="415" font-size="24" fill="#B9504A" font-weight="700" text-anchor="start">控制面暂不可用</text><text x="640" y="399" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">数据面按风险与时效分类</text><rect x="65" y="470" width="230" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="180.0" y="520.32" font-size="23" fill="#3F8079" font-weight="700" text-anchor="middle">继续</text><rect x="360" y="470" width="1010" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="385" y="521" font-size="21" fill="#3F8079" font-weight="700" text-anchor="start">本地确定性整理；有效范围内的已授权读取</text><rect x="65" y="600" width="230" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="180.0" y="650.32" font-size="23" fill="#B0763A" font-weight="700" text-anchor="middle">有界继续</text><rect x="360" y="600" width="1010" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="385" y="651" font-size="21" fill="#B0763A" font-weight="700" text-anchor="start">事先下放且未耗尽的预算；未过期配置与授权</text><rect x="65" y="730" width="230" height="85" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="180.0" y="780.32" font-size="23" fill="#B9504A" font-weight="700" text-anchor="middle">暂停新动作</text><rect x="360" y="730" width="1010" height="85" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="385" y="781" font-size="21" fill="#B9504A" font-weight="700" text-anchor="start">无当前授权 / 无预算许可 / 无法登记副作用</text><rect x="40" y="877" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="910" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">恢复后核对撤销、配置兼容与本地账本；管理面不可用不代表可以绕过资源端检查。</text></g></svg>