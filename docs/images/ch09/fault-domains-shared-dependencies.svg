<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">故障域：隔开执行单元，也要画出真实共享依赖</title><desc id="desc">多个集群若共享一个全局限额、预算中心或数据库，仍可能同时失效</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="920" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="55" y="160" width="400" height="330" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4" stroke-dasharray="8 6"/><rect x="520" y="160" width="400" height="330" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4" stroke-dasharray="8 6"/><rect x="985" y="160" width="400" height="330" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4" stroke-dasharray="8 6"/><path d="M255,490 L255,550 L720,550 L720,620" fill="none" stroke="#B9504A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-red)"/><path d="M720,490 L720,550 L720,550 L720,620" fill="none" stroke="#B9504A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-red)"/><path d="M1185,490 L1185,550 L720,550 L720,620" fill="none" stroke="#B9504A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-red)"/><path d="M255,490 L255,620" fill="none" stroke="#B0763A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-amber)"/><path d="M1185,490 L1185,620" fill="none" stroke="#B0763A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-amber)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">故障域：隔开执行单元，也要画出真实共享依赖</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">多个集群若共享一个全局限额、预算中心或数据库，仍可能同时失效</text><text x="80" y="200" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">单元 A：支付租户</text><rect x="80" y="250" width="350" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="255.0" y="291.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">队列 / Worker / 本地配额</text><rect x="80" y="365" width="350" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="255.0" y="406.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">已验证配置 / 有界额度</text><text x="545" y="200" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">单元 B：分析租户</text><rect x="545" y="250" width="350" height="70" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="720.0" y="291.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">队列 / Worker / 本地配额</text><rect x="545" y="365" width="350" height="70" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="720.0" y="406.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">已验证配置 / 有界额度</text><text x="1010" y="200" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">单元 C：其他业务</text><rect x="1010" y="250" width="350" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1185.0" y="291.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">队列 / Worker / 本地配额</text><rect x="1010" y="365" width="350" height="70" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1185.0" y="406.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">已验证配置 / 有界额度</text><rect x="70" y="620" width="370" height="105" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="255.0" y="664.64" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">共享状态数据库</text><text x="255.0" y="694.64" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">容量 / 可用性 / 恢复点</text><rect x="535" y="620" width="370" height="105" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="720.0" y="664.64" font-size="21" fill="#B9504A" font-weight="700" text-anchor="middle">全局预算与供应商配额</text><text x="720.0" y="694.64" font-size="21" fill="#B9504A" font-weight="700" text-anchor="middle">真实共享瓶颈</text><rect x="1000" y="620" width="370" height="105" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1185.0" y="664.64" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">共享控制面</text><text x="1185.0" y="694.64" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">配置分发与版本治理</text><text x="65" y="802" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">隔离爆炸半径 + 预留本地容量 + 限制全局依赖 + 受控积压恢复，才能让单元保持实际独立。</text><rect x="40" y="837" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="870" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">跨区域备份和故障转移仍受数据驻留约束；恢复需同时核对已发生但未确认的外部操作。</text></g></svg>