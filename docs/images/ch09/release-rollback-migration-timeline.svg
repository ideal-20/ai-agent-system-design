<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">发布、迁移、回滚：分别改变新任务、旧状态与未来分配</title><desc id="desc">回滚程序不回滚外部世界；安全撤销可阻止旧 Run 的新动作</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="940" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M275,175 L1370,175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a-muted)"/><path d="M380,160 L380,780" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 6"/><path d="M720,160 L720,780" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 6"/><path d="M1060,160 L1060,780" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7 6"/><path d="M570,285 L650,285" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M940,285 L1040,285" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M570,465 L650,465" fill="none" stroke="#3F8079" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-teal)"/><path d="M940,465 L1040,465" fill="none" stroke="#B9504A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-red)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">发布、迁移、回滚：分别改变新任务、旧状态与未来分配</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">回滚程序不回滚外部世界；安全撤销可阻止旧 Run 的新动作</text><text x="60" y="180" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">发布时点</text><text x="390" y="145" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">t0：旧版活跃</text><text x="730" y="145" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">t1：新版灰度</text><text x="1070" y="145" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">t2：回滚 / 撤销</text><text x="65" y="295" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">新 Run</text><text x="65" y="465" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">已有 Run</text><text x="65" y="675" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">外部效果</text><rect x="280" y="245" width="290" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="425.0" y="291.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Release 3.4.1</text><rect x="650" y="245" width="290" height="80" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="795.0" y="291.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Release 3.4.2</text><rect x="1040" y="245" width="320" height="80" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1200.0" y="291.8" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">未来分配回到 3.4.1</text><rect x="280" y="415" width="290" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="425.0" y="457.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">保持原 Release</text><text x="425.0" y="486.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">按原兼容契约恢复</text><rect x="650" y="415" width="290" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="795.0" y="457.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">安全边界暂停</text><text x="795.0" y="486.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">验证 + 状态迁移</text><rect x="1040" y="415" width="320" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="1200.0" y="457.46" font-size="19" fill="#B9504A" font-weight="700" text-anchor="middle">旧代码能读新状态？</text><text x="1200.0" y="485.46" font-size="19" fill="#B9504A" font-weight="700" text-anchor="middle">不能则前向修复 / 人工处理</text><rect x="280" y="635" width="1080" height="105" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="305" y="675" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">CHG-11 已确认完成：v18 读回包含 E11</text><text x="305" y="716" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">发布或回滚都不撤销该事实；HTTP 504 仍未满足恢复标准。</text><text x="280" y="800" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">安全撤销路径：阻止尚未派发的新副作用；已发送操作继续核对，不遗失责任。</text><rect x="40" y="857" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="890" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">灰度以稳定 Task / Run 身份分组；每一步随机切换会产生未单独评估的混合系统。</text></g></svg>