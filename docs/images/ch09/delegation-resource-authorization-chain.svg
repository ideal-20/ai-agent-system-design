<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">授权责任链：发起人、委托、执行主体与目标资源分开</title><desc id="desc">内部 Worker 不自动可信；模型建议不构成权限，入口允许也不替代资源级门禁</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="960" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="345" width="1360" height="355" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M335,232 L430,232" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M710,232 L805,232" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M1085,232 L1140,232" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M350,505 L405,505" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M690,505 L745,505" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M1030,505 L1085,505" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M570,285 L570,345" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><path d="M1267,285 L1267,445" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-amber)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">授权责任链：发起人、委托、执行主体与目标资源分开</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">内部 Worker 不自动可信；模型建议不构成权限，入口允许也不替代资源级门禁</text><rect x="65" y="180" width="270" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="200.0" y="224.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">任务发起者</text><text x="200.0" y="254.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">用户 / 告警源</text><rect x="430" y="180" width="280" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="570.0" y="224.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">可信委托依据</text><text x="570.0" y="254.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">身份映射 / 有效范围</text><rect x="805" y="180" width="280" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="945.0" y="224.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">执行服务主体</text><text x="945.0" y="254.64" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">svc-incident</text><rect x="1140" y="180" width="255" height="105" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="1267.5" y="224.96" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">短期目标凭据</text><text x="1267.5" y="252.96" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">限定 audience / scope</text><text x="65" y="385" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">执行时校验：越接近资源，越能看到真实当前状态</text><rect x="65" y="445" width="285" height="120" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="207.5" y="497.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Agent Gateway</text><text x="207.5" y="526.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">谁可创建哪类任务</text><rect x="405" y="445" width="285" height="120" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="547.5" y="497.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Runtime</text><text x="547.5" y="526.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">当前状态 + 批准绑定</text><rect x="745" y="445" width="285" height="120" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="887.5" y="497.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">Tool PEP</text><text x="887.5" y="526.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">主体 / 动作 / 资源</text><rect x="1085" y="445" width="285" height="120" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1227.5" y="497.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">目标业务系统</text><text x="1227.5" y="526.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">资源权限 + 版本条件</text><text x="65" y="645" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">CHG-11 的批准绑定渠道 A、E11、预期 v17 与参数摘要；等待期间变化，必须重新校验。</text><rect x="65" y="755" width="590" height="90" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><text x="360.0" y="792.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">权限撤销：新动作重新核验</text><text x="360.0" y="821.3" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">短期凭据不保证立即撤销</text><rect x="765" y="755" width="590" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1060.0" y="792.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">审计链：谁允许了什么、作用于哪里</text><text x="1060.0" y="821.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">记录实际工具、策略、批准与结果</text><rect x="40" y="877" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="910" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">凭据由可信后端取得，模型只获得必要工具契约；长期状态保存授权引用，不保存万能密钥。</text></g></svg>