<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">企业 Agent 平台：共享约束，保留业务决定权</title><desc id="desc">一次任务经过接入、执行、模型与工具；控制面发布配置，数据面保存运行事实</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="980" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="125" width="1360" height="130" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="40" y="285" width="1360" height="105" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="40" y="420" width="1360" height="430" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M305,541 L365,541" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M665,541 L735,541" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M1015,541 L1090,541" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M875,582 L875,635 L335,635 L335,700" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M875,635 L720,635 L720,700" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M875,635 L1105,635 L1105,700" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M515,255 L515,270 L1380,270 L1380,480 L515,480 L515,500" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">企业 Agent 平台：共享约束，保留业务决定权</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">一次任务经过接入、执行、模型与工具；控制面发布配置，数据面保存运行事实</text><text x="65" y="163" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">控制面：版本化期望配置</text><rect x="65" y="188" width="300" height="43" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="215.0" y="215.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">Agent / Tool Registry</text><rect x="390" y="188" width="300" height="43" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="540.0" y="215.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">路由与数据策略</text><rect x="715" y="188" width="300" height="43" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="865.0" y="215.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">配额 / 预算 / 权限</text><rect x="1040" y="188" width="335" height="43" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1207.5" y="215.62" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">发布、撤销与兼容性</text><text x="65" y="323" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">业务定义</text><text x="285" y="323" font-size="21" fill="#3F8079" font-weight="700" text-anchor="start">目标、风险分级、验收谓词与责任人</text><text x="65" y="365" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">payment-gateway：工具变更完成，只能证明 CHG-11 成功；HTTP 504 恢复仍需独立验收。</text><text x="65" y="456" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">数据面：任务与操作的权威运行事实</text><rect x="65" y="500" width="240" height="82" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="185.0" y="533.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Agent Gateway</text><text x="185.0" y="561.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">身份 / 受理 / 查询</text><rect x="365" y="500" width="300" height="82" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="515.0" y="533.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Runtime + 状态存储</text><text x="515.0" y="561.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Task / Run / Operation</text><rect x="735" y="500" width="280" height="82" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="875.0" y="533.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Scheduler + Worker</text><text x="875.0" y="561.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">按租户分配执行机会</text><rect x="1090" y="500" width="285" height="82" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1232.5" y="533.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">账本与观测</text><text x="1232.5" y="561.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">审计 / 成本 / Trace</text><rect x="180" y="700" width="310" height="92" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="335.0" y="738.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Model Gateway</text><text x="335.0" y="766.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">模型端点 / 容量 / usage</text><rect x="565" y="700" width="310" height="92" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="720.0" y="738.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">Tool Adapter</text><text x="720.0" y="766.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">授权门禁 → 业务系统</text><rect x="950" y="700" width="310" height="92" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1105.0" y="738.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">知识 / 记忆 / 制品</text><text x="1105.0" y="766.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">数据作用域与版本</text><text x="1050" y="408" font-size="16" fill="#426B9A" font-weight="400" text-anchor="start">已验证配置</text><rect x="40" y="897" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="930" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">图中是责任边界，不要求一框一微服务；平台不能用接口成功替代业务目标达成。</text></g></svg>