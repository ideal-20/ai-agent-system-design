<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">租户隔离：可信身份必须贯穿每一份派生数据</title><desc id="desc">保密性、完整性、资源机会和费用归属一起验证；tenant_id 字段不是隔离本身</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="960" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="345" width="1360" height="425" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><path d="M345,237 L440,237" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M618,290 L618,405 L265,405 L265,435" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><path d="M618,290 L618,405 L720,405 L720,435" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><path d="M618,290 L618,405 L1175,405 L1175,435" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><path d="M265,553 L265,605" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M720,553 L720,605" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M1175,553 L1175,605" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-teal)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">租户隔离：可信身份必须贯穿每一份派生数据</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">保密性、完整性、资源机会和费用归属一起验证；tenant_id 字段不是隔离本身</text><rect x="55" y="185" width="290" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="200.0" y="229.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">可信认证与租户映射</text><text x="200.0" y="258.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">用户正文不能自报身份</text><rect x="440" y="185" width="355" height="105" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="617.5" y="229.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">受保护 Execution Envelope</text><text x="617.5" y="258.8" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Task / Run / 租户 / 权限引用</text><text x="65" y="385" font-size="22" fill="#24364B" font-weight="700" text-anchor="start">同一租户作用域沿读写、异步与产物路径传播</text><rect x="65" y="435" width="400" height="118" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="265.0" y="486.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">数据库</text><text x="265.0" y="514.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">RLS + 非绕过账号</text><rect x="520" y="435" width="400" height="118" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="720.0" y="486.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">缓存</text><text x="720.0" y="514.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">租户 / 权限 / 版本键</text><rect x="975" y="435" width="400" height="118" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="1175.0" y="486.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">检索与记忆</text><text x="1175.0" y="514.46" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">候选过滤 + 原文复核</text><rect x="65" y="605" width="400" height="118" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="265.0" y="656.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">队列</text><text x="265.0" y="684.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">重放仍核验 Run 归属</text><rect x="520" y="605" width="400" height="118" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="720.0" y="656.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">沙箱</text><text x="720.0" y="684.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">凭据、文件、网络隔离</text><rect x="975" y="605" width="400" height="118" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1175.0" y="656.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">制品与费用</text><text x="1175.0" y="684.46" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">对象 ACL + 正确账单</text><text x="65" y="830" font-size="21" fill="#B9504A" font-weight="700" text-anchor="start">撤权与删除传播到缓存/索引；Worker 复用前清理上下文、临时文件、环境变量与凭据。</text><rect x="40" y="877" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="910" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">对象路径难猜不等于有访问控制；审计、死信队列和运维排障入口也必须遵守租户边界。</text></g></svg>