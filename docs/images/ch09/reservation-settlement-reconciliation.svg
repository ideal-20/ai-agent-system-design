<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">费用预留状态机：超时未必免费，结束未必结清</title><desc id="desc">以 Attempt 为计费单位、Run 为业务归属；同一 reservation 的重复结算必须去重</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><path d="M325,260 L460,260" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M740,260 L1040,260" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M195,310 L195,550" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M600,310 L760,500" fill="none" stroke="#B0763A" stroke-width="2" marker-end="url(#a-amber)"/><path d="M1050,570 L1190,570 L1190,310" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">费用预留状态机：超时未必免费，结束未必结清</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">以 Attempt 为计费单位、Run 为业务归属；同一 reservation 的重复结算必须去重</text><rect x="65" y="210" width="260" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="195.0" y="252.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">RESERVED</text><text x="195.0" y="282.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">已原子获得许可</text><rect x="460" y="210" width="280" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="600.0" y="252.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">IN_FLIGHT</text><text x="600.0" y="282.14" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">请求已发送</text><rect x="1040" y="210" width="300" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1190.0" y="252.14" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">SETTLED</text><text x="1190.0" y="282.14" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">按可靠 usage 结算</text><text x="890" y="232" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">可靠使用量到达</text><rect x="65" y="550" width="300" height="115" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="215.0" y="599.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">RELEASED</text><text x="215.0" y="628.8" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">确认未派发 / 明确不收费</text><rect x="600" y="500" width="450" height="140" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="825.0" y="547.14" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">PENDING_RECONCILIATION</text><text x="825.0" y="577.14" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">超时 / 断线 / usage 丢失</text><text x="825.0" y="607.14" font-size="21" fill="#B0763A" font-weight="700" text-anchor="middle">保留未决费用责任</text><text x="215" y="440" font-size="18" fill="#3F8079" font-weight="400" text-anchor="start">满足释放条件</text><text x="760" y="410" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">结果或费用未知</text><text x="1115" y="486" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">账单 / 查询对账</text><rect x="65" y="700" width="1275" height="82" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="90" y="748" font-size="21" fill="#24364B" font-weight="400" text-anchor="start">结算：S′ = S + c，R′ = R − r；实际 c &gt; r 时如实入账，并阻止未授权的后续支出。</text><rect x="40" y="817" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="850" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">本地超时不能直接把 r 释放；usage 未返回不能记为 0。预留有上界与对账期限，仍需责任人收尾。</text></g></svg>