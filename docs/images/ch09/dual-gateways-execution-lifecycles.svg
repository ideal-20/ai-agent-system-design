<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">两层 Gateway：Task 的持续身份与推理 Attempt 的有界寿命</title><desc id="desc">任务受理不等于业务完成；模型失败只恢复模型步骤，不重放已提交的业务动作</desc><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#426B9A"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3F8079"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0763A"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B9504A"/></marker></defs><rect width="1440" height="900" fill="#FFFFFF"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect x="40" y="145" width="1360" height="265" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="40" y="455" width="1360" height="290" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><path d="M355,285 L410,285" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M695,285 L750,285" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M1035,285 L1090,285" fill="none" stroke="#426B9A" stroke-width="2" marker-end="url(#a-blue)"/><path d="M355,600 L410,600" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M695,600 L750,600" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M1035,600 L1090,600" fill="none" stroke="#3F8079" stroke-width="2" marker-end="url(#a-teal)"/><path d="M780,335 L780,455" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a-muted)"/><text x="40" y="54" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">两层 Gateway：Task 的持续身份与推理 Attempt 的有界寿命</text><text x="40" y="88" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">任务受理不等于业务完成；模型失败只恢复模型步骤，不重放已提交的业务动作</text><text x="65" y="185" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">Agent Gateway：面向调用方的任务契约</text><rect x="70" y="235" width="285" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="212.5" y="277.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">验证身份</text><text x="212.5" y="306.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">绑定可信租户</text><rect x="410" y="235" width="285" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="552.5" y="277.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">可靠受理</text><text x="552.5" y="306.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">建立 Task / Run</text><rect x="750" y="235" width="285" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="892.5" y="277.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">执行 / 等待</text><text x="892.5" y="306.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">恢复 / 取消</text><rect x="1090" y="235" width="285" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1232.5" y="277.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">业务验收</text><text x="1232.5" y="306.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">交付与收尾</text><text x="75" y="380" font-size="20" fill="#426B9A" font-weight="400" text-anchor="start">任务身份跨越 Worker 与连接；状态查询独立存在。</text><text x="65" y="495" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">Model Gateway：只处理某个 Step 的推理调用</text><rect x="70" y="550" width="285" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="212.5" y="592.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">检查资格</text><text x="212.5" y="621.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">路由 + 预算预留</text><rect x="410" y="550" width="285" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><text x="552.5" y="592.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">Attempt 1</text><text x="552.5" y="621.3" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">超时 / 失败 / 未知</text><rect x="750" y="550" width="285" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="892.5" y="592.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Attempt 2</text><text x="892.5" y="621.3" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">合格模型 Fallback</text><rect x="1090" y="550" width="285" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><text x="1232.5" y="592.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">接纳一个结果</text><text x="1232.5" y="621.3" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">逐次结算使用量</text><text x="800" y="442" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Run → Step → Attempt 关联</text><text x="75" y="705" font-size="19" fill="#3F8079" font-weight="400" text-anchor="start">流式 delta 用于展示；完整结果通过校验后才提交；usage 可能在内容完成后结算。</text><rect x="40" y="817" width="1360" height="51" rx="10" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><text x="62" y="850" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">Fallback 产生新 Attempt，Step 保持稳定；迟到响应记账归档，不能推进两份决策。</text></g></svg>