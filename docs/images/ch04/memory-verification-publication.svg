<text x="1057" y="455" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#CBD5E1" font-weight="700" text-anchor="middle">—</text>
<text x="1275" y="455" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="middle">VERIFIED</text>
