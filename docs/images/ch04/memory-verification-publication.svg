<text x="862" y="595" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B0763A" font-weight="700" text-anchor="middle">?</text>
<circle cx="1057" cy="588" r="18" fill="#FBF1E4"/>
<text x="1057" y="595" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B0763A" font-weight="700" text-anchor="middle">?</text>
