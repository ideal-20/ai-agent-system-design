<text x="45" y="660" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">✓ 已有独立观测支持     ? 必要证据尚未取得     — 该类证据不直接支持此陈述</text>
<text x="45" y="684" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">PENDING 为 PENDING_VERIFICATION 的图内缩写。</text>
<text x="45" y="714" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="400" text-anchor="start">若证据否定陈述 → REJECTED，保留反例或审计记录。</text>
