<circle cx="862" cy="518" r="18" fill="#FBF1E4"/>
<text x="862" y="525" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B0763A" font-weight="700" text-anchor="middle">?</text>
<circle cx="1057" cy="518" r="18" fill="#F7F9FC"/>
<text x="1057" y="525" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#CBD5E1" font-weight="700" text-anchor="middle">—</text>
<text x="1275" y="525" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="700" text-anchor="middle">PENDING</text>
