<text x="969" y="803" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">默认检索集合</text>
<text x="969" y="838" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">补齐证据并审核通过后才进入</text>
<text x="45" y="902" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">生命周期独立记录：VERIFIED + ACTIVE 可复用；VERIFIED + SUPERSEDED 仍为已证实的历史记录。</text>
<rect x="45" y="920" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="70" y="956" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">事实核验、整条发布和适用生命周期是三个维度；不能用一个“已验证”标签全部替代。</text>
<text x="48" y="1005" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">图中尚未取得的配置快照和处置结果对应当前任务的证据缺口，不能从历史案例或监控指标直接补全。</text>
</svg>
