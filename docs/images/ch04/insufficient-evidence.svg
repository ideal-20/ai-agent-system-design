<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(13, 13, 13)" viewBox="0 0 600 258" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="farr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#8493a8"/></marker></defs><rect x="200" y="7" width="200" height="34" rx="5" fill="#5682b2" fill-opacity=".12" stroke="#5682b2"/><text x="300" y="28" font-size="12" text-anchor="middle" fill="currentColor">初始检索与证据组织</text><path d="M300 41 V58" stroke="#8493a8" marker-end="url(#farr)"/><path d="M300 59 L405 95 L300 131 L195 95Z" fill="#b58b50" fill-opacity=".1" stroke="#b58b50"/><text x="300" y="91" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">证据是否满足</text><text x="300" y="106" font-size="11" text-anchor="middle" fill="currentColor">当前任务需求？</text><path d="M405 95 H500 V149" stroke="#8493a8" fill="none" marker-end="url(#farr)"/><text x="440" y="86" font-size="11" fill="#559584">满足</text><rect x="420" y="150" width="168" height="40" rx="5" fill="#559584" fill-opacity=".12" stroke="#559584"/><text x="504" y="167" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">进入推理与决策</text><text x="504" y="181" font-size="10" text-anchor="middle" fill="currentColor">Reasoning / Action</text><path d="M195 95 H96 V149" stroke="#8493a8" fill="none" marker-end="url(#farr)"/><text x="117" y="86" font-size="11" fill="currentColor">不足</text><rect x="12" y="150" width="168" height="40" rx="5" fill="#5682b2" fill-opacity=".12" stroke="#5682b2"/><text x="96" y="167" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">识别缺失证据</text><text x="96" y="181" font-size="10" text-anchor="middle" fill="currentColor">改写查询 / 调用工具</text><path d="M96 190 V215 H199" stroke="#8493a8" fill="none" marker-end="url(#farr)"/><rect x="200" y="198" width="200" height="43" rx="5" fill="#5682b2" fill-opacity=".12" stroke="#5682b2"/><text x="300" y="216" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">补充检索 / 证据不足退出</text><text x="300" y="231" font-size="10" text-anchor="middle" fill="currentColor">受执行预算及终止条件约束</text><path d="M400 220 H408 V24 H401" stroke="#8493a8" stroke-dasharray="4 3" fill="none" marker-end="url(#farr)"/></svg>