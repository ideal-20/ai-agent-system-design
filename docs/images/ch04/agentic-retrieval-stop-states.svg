<path d="M824 844 L1395 844" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M647 693 H753 V660 H784" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a64748B)"/>
<rect x="45" y="920" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="70" y="956" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">检索的目标是缩小证据缺口；停止时仍需交付已知事实、剩余问题与来源。</text>
<text x="48" y="1005" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">预算圆点仅示意消耗，不代表固定配额；当前案例中的出口授权和根因仍待现场核验。</text>
