<text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">每次获取都要增加能区分假设的证据；Runtime 同时维护来源、冲突与剩余预算</text>
