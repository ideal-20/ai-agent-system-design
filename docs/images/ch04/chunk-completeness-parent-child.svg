<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="1030px" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
<title id="title">切片完整性：保留条件，才能解释动作</title><desc id="desc">用同一段操作规则比较动作孤片与完整交付；父子索引让定位粒度和阅读粒度分离</desc>
<defs>
<marker id="a426B9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426B9A"/></marker>
<marker id="a3F8079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3F8079"/></marker>
<marker id="aB0763A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B0763A"/></marker>
<marker id="aB9504A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B9504A"/></marker>
<marker id="a64748B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="1030" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">切片完整性：保留条件，才能解释动作</text>
<text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">用同一段操作规则比较动作孤片与完整交付；父子索引让定位粒度和阅读粒度分离</text>
<text x="45" y="145" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">原文 · 网关线程池调整</text>
<rect x="45" y="169" width="1350" height="200" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="64" y="187" width="11" height="31" rx="0" fill="#B9504A" stroke="#B9504A" stroke-width="1.2"/>
<text x="92" y="211" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="700" text-anchor="start">禁止项</text>
<text x="192" y="211" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">数据库连接池接近容量上限时，不应直接提高网关线程数。</text>
<rect x="64" y="236" width="11" height="31" rx="0" fill="#B0763A" stroke="#B0763A" stroke-width="1.2"/>
<text x="92" y="260" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="700" text-anchor="start">前提</text>
<text x="192" y="260" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">数据库仍有余量；主要等待外部 HTTP 调用；完成容量评估。</text>
<rect x="64" y="285" width="11" height="31" rx="0" fill="#426B9A" stroke="#426B9A" stroke-width="1.2"/>
<text x="92" y="309" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#426B9A" font-weight="700" text-anchor="start">动作</text>
<text x="192" y="309" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">满足上述条件后，才考虑</text>
<rect x="64" y="324" width="11" height="31" rx="0" fill="#3F8079" stroke="#3F8079" stroke-width="1.2"/>
<text x="92" y="348" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="start">验证</text>
<text x="192" y="348" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">调整后持续监控，并准备回滚。</text>
<rect x="443" y="284" width="322" height="34" rx="1" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.3"/>
<text x="456" y="308" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">临时调整线程池上限</text>
<path d="M575 369 V405 H325 V449" fill="none" stroke="#B9504A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aB9504A)"/>
<path d="M1210 369 V405 H1050 V449" fill="none" stroke="#3F8079" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a3F8079)"/>
<text x="45" y="432" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B9504A" font-weight="700" text-anchor="start">① 只保留动作</text>
<rect x="45" y="461" width="570" height="67" rx="1" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.2"/>
<text x="70" y="505" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#B9504A" font-weight="700" text-anchor="start">“临时调整线程池上限”</text>
<text x="45" y="570" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748B" font-weight="400" text-anchor="start">前提、禁止项、校验要求全部离开了片段。</text>
<text x="45" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">对象</text>
<text x="100" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B9504A" font-weight="700" text-anchor="start">×</text>
<text x="190" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="400" text-anchor="start">前提</text>
<text x="245" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B9504A" font-weight="700" text-anchor="start">×</text>
<text x="335" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#426B9A" font-weight="400" text-anchor="start">动作</text>
<text x="390" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#426B9A" font-weight="700" text-anchor="start">✓</text>
<text x="480" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="400" text-anchor="start">验证</text>
<text x="535" y="619" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#B9504A" font-weight="700" text-anchor="start">×</text>
<text x="745" y="432" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#3F8079" font-weight="700" text-anchor="start">② 交付完整规则</text>
<rect x="745" y="461" width="650" height="182" rx="2" fill="#FFFFFF" stroke="#3F8079" stroke-width="1.2"/>
<rect x="762" y="473" width="10" height="30" rx="0" fill="#64748B" stroke="#64748B" stroke-width="1.2"/>
<text x="789" y="494" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="400" text-anchor="start">对象 / 生产环境 / 文档版本</text>
<rect x="762" y="512" width="10" height="30" rx="0" fill="#B0763A" stroke="#B0763A" stroke-width="1.2"/>
<text x="789" y="533" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="400" text-anchor="start">容量限制 + 三项前置条件</text>
<rect x="762" y="551" width="10" height="30" rx="0" fill="#426B9A" stroke="#426B9A" stroke-width="1.2"/>
<text x="789" y="572" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="400" text-anchor="start">临时调整线程池上限</text>
<rect x="762" y="590" width="10" height="30" rx="0" fill="#3F8079" stroke="#3F8079" stroke-width="1.2"/>
<text x="789" y="611" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="400" text-anchor="start">监控 + 回滚 + 原文位置</text>
<text x="45" y="706" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">Parent–Child</text>
<text x="222" y="706" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">短子片段精准命中，父级小节补齐上下文</text>
<rect x="45" y="744" width="330" height="106" rx="2" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.2"/>
<text x="65" y="779" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">子片段 c₂</text>
<text x="65" y="817" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="400" text-anchor="start">“临时调整线程池上限”</text>
<path d="M385 798 H507" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a426B9A)"/>
<text x="445" y="773" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">parent_id</text>
<rect x="525" y="741" width="870" height="123" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="545" y="771" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">父级小节 · 同一文档版本</text>
<rect x="547" y="792" width="180" height="45" rx="1" fill="#FBEDEC" stroke="#B9504A" stroke-width="1"/>
<text x="637.0" y="821" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700" text-anchor="middle">禁止项</text>
<rect x="727" y="792" width="250" height="45" rx="1" fill="#FBF1E4" stroke="#B0763A" stroke-width="1"/>
<text x="852.0" y="821" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">前置条件</text>
<rect x="977" y="792" width="205" height="45" rx="1" fill="#EDF3F9" stroke="#426B9A" stroke-width="1"/>
<text x="1079.5" y="821" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">命中动作</text>
<rect x="1182" y="792" width="189" height="45" rx="1" fill="#EAF4F2" stroke="#3F8079" stroke-width="1"/>
<text x="1276.5" y="821" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">监控 / 回滚</text>
<rect x="45" y="920" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="70" y="956" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">切片能被召回，与模型收到足够完整的规则，是两个不同的验收点。</text>
<text x="48" y="1005" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">展开父级仍须复核版本和权限并去重；若完整规则放不下，应减少背景材料或显式报告交付缺口。</text>
</svg>
