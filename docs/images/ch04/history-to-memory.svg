<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">从原始执行记录到可复用记忆案例</title>
  <desc id="desc">History 依次记录监控告警、初步假设、工具查询、根因确认和修复验证，经过信息提取、证据关联、状态确认和范围限定，形成包含故障现象、已确认根因、解决方案、验证结果、适用范围以及排除项与证据的 Memory。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8Z" fill="#85919F"/>
    </marker>
    <style>
      text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .step-title { font-size: 19px; font-weight: 700; fill: #28323C; }
      .body { font-size: 17px; fill: #59636E; }
      .field-title { font-size: 19px; font-weight: 700; fill: #2F3B38; }
      .separator { stroke: #DAE3DF; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1200" height="570" fill="#FFFFFF"/>
  <rect x="18" y="18" width="1164" height="534" rx="12" fill="#FFFFFF" stroke="#E2E5E9" stroke-width="1.4"/>

  <!-- Original execution record -->
  <g id="history">
    <rect x="52" y="50" width="390" height="470" rx="8" fill="#FBFCFD" stroke="#A0AEC0" stroke-width="1.4"/>
    <text class="panel-title" x="247" y="85" text-anchor="middle" fill="#28323C">History · 原始执行记录</text>
    <path d="M85 125V480" fill="none" stroke="#B5BFCB" stroke-width="2.3"/>

    <g id="alert">
      <rect x="106" y="108" width="315" height="69" rx="6" fill="#EDF1F6" stroke="#B3BFCE" stroke-width="1.3"/>
      <circle cx="85" cy="137" r="6.5" fill="#7C8FA7"/>
      <text class="step-title" x="123" y="135">监控告警</text>
      <text class="body" x="123" y="160">新实例出现 HTTP 504</text>
    </g>

    <g id="hypothesis">
      <rect x="106" y="190" width="315" height="69" rx="6" fill="#F4F1EC" stroke="#C4B9A6" stroke-width="1.3"/>
      <circle cx="85" cy="219" r="6.5" fill="#AB9879"/>
      <text class="step-title" x="123" y="217">初步假设</text>
      <text class="body" x="123" y="242">数据库连接异常</text>
    </g>

    <g id="tool-query">
      <rect x="106" y="272" width="315" height="69" rx="6" fill="#EDF1F6" stroke="#B3BFCE" stroke-width="1.3"/>
      <circle cx="85" cy="301" r="6.5" fill="#7C8FA7"/>
      <text class="step-title" x="123" y="299">工具查询</text>
      <text class="body" x="123" y="324">数据库指标正常，排除假设</text>
    </g>

    <g id="root-cause">
      <rect x="106" y="354" width="315" height="69" rx="6" fill="#EBF2EF" stroke="#B1C5BE" stroke-width="1.3"/>
      <circle cx="85" cy="383" r="6.5" fill="#6D9A8C"/>
      <text class="step-title" x="123" y="381">根因确认</text>
      <text class="body" x="123" y="406">出口地址未加入白名单</text>
    </g>

    <g id="verification">
      <rect x="106" y="436" width="315" height="69" rx="6" fill="#EBF2EF" stroke="#B1C5BE" stroke-width="1.3"/>
      <circle cx="85" cy="465" r="6.5" fill="#6D9A8C"/>
      <text class="step-title" x="123" y="463">修复验证</text>
      <text class="body" x="123" y="488">配置修复后错误率恢复</text>
    </g>
  </g>

  <!-- Memory formation -->
  <g id="memory-formation">
    <path d="M442 285H479" fill="none" stroke="#85919F" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="484" y="183" width="182" height="204" rx="8" fill="#EEF2F6" stroke="#97A9BE" stroke-width="1.4"/>
    <text x="575" y="220" text-anchor="middle" font-size="21" font-weight="700" fill="#28323C">记忆形成</text>
    <text x="575" y="260" text-anchor="middle" font-size="19" fill="#59636E">信息提取</text>
    <text x="575" y="294" text-anchor="middle" font-size="19" fill="#59636E">证据关联</text>
    <text x="575" y="328" text-anchor="middle" font-size="19" fill="#59636E">状态确认</text>
    <text x="575" y="362" text-anchor="middle" font-size="19" fill="#59636E">范围限定</text>
    <path d="M666 285H703" fill="none" stroke="#85919F" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>

  <!-- Reusable case -->
  <g id="memory">
    <rect x="708" y="50" width="440" height="470" rx="8" fill="#F5F9F7" stroke="#98B3AA" stroke-width="1.4"/>
    <text class="panel-title" x="928" y="85" text-anchor="middle" fill="#283A35">Memory · 可复用案例</text>

    <g id="symptom">
      <text class="field-title" x="731" y="129">故障现象</text>
      <text class="body" x="731" y="155">扩容后新实例出现大量 504</text>
      <path class="separator" d="M731 170H1123"/>
    </g>
    <g id="confirmed-cause">
      <text class="field-title" x="731" y="193">已确认根因</text>
      <text class="body" x="731" y="219">新实例出口地址未获得授权</text>
      <path class="separator" d="M731 234H1123"/>
    </g>
    <g id="solution">
      <text class="field-title" x="731" y="257">解决方案</text>
      <text class="body" x="731" y="283">补充下游渠道白名单配置</text>
      <path class="separator" d="M731 298H1123"/>
    </g>
    <g id="result">
      <text class="field-title" x="731" y="321">验证结果</text>
      <text class="body" x="731" y="347">修复后服务错误率恢复</text>
      <path class="separator" d="M731 362H1123"/>
    </g>
    <g id="scope">
      <text class="field-title" x="731" y="385">适用范围</text>
      <text class="body" x="731" y="411">存在出口地址授权要求的渠道</text>
      <path class="separator" d="M731 426H1123"/>
    </g>
    <g id="evidence">
      <text class="field-title" x="731" y="449">排除项与证据</text>
      <text class="body" x="731" y="475">数据库异常已排除；关联原始记录</text>
    </g>
  </g>
</svg>
