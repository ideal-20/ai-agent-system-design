<svg xmlns="http://www.w3.org/2000/svg" width="1537" height="834" viewBox="50 96 1537 834" role="img" aria-labelledby="title">
<title id="title">图 4-3 基于父子索引的知识检索与上下文交付</title>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0d0d0d;font-size:24px}.heading{font-size:26px;font-weight:600}.sub{font-size:23px;fill:#393a3a}.flow{fill:none;stroke-width:2.8;stroke-linejoin:miter}.node{stroke-width:2.1}</style>
<rect x="52" y="97" width="1534" height="831" rx="23" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/>
<!-- Parent and children -->
<rect x="94" y="141" width="742" height="452" rx="16" fill="#f3f5f7" stroke="#8faac3" class="node"/>
<text x="126" y="188" class="heading" style="font-size:28px">Parent Chunk · 扩容前检查</text>
<rect x="124" y="213" width="682.5" height="100" rx="8" fill="#ebeff2" stroke="#b4bfcd" class="node"/>
<text x="145" y="251" class="heading">Child 01 · 实例资源检查</text>
<text x="145" y="288" class="sub">确认 CPU、内存及实例资源满足扩容要求。</text>
<rect x="124" y="330" width="682.5" height="100" rx="8" fill="#dde7e8" stroke="#79afa7" class="node"/>
<text x="145" y="368" class="heading">Child 02 · 渠道访问检查</text>
<text x="145" y="405" class="sub">核对新实例出口地址是否获得渠道授权。</text>
<rect x="124" y="447" width="682.5" height="100" rx="8" fill="#ebeff2" stroke="#b4bfcd" class="node"/>
<text x="145" y="485" class="heading">Child 03 · 配置一致性检查</text>
<text x="145" y="522" class="sub">核对新旧实例的关键配置与版本。</text>
<!-- Query -->
<rect x="1050" y="156" width="492" height="110" rx="11" fill="#f0f1f3" stroke="#94a3b8" class="node"/>
<text x="1296" y="196" text-anchor="middle" class="heading">Query</text>
<text x="1296" y="234" text-anchor="middle">扩容需要检查哪些网络配置？</text>
<path d="M1296 266 V368 H832" class="flow" stroke="#39877a"/>
<path d="M832 358 L812 368 L832 378 Z" fill="#8190a0"/>
<text x="1059" y="351" text-anchor="middle" style="font-size:23px;fill:#39877a">① 精细粒度检索</text>
<!-- Context compiler -->
<path d="M836 514.5 H1025" class="flow" stroke="#537da6"/>
<path d="M1025 504.5 L1045 514.5 L1025 524.5 Z" fill="#8190a0"/>
<text x="938" y="489" text-anchor="middle" style="font-size:23px;fill:#527da5">② 父级展开</text>
<rect x="1050" y="440" width="492" height="149" rx="10" fill="#eef2f5" stroke="#8ba8c3" class="node"/>
<text x="1296" y="485" text-anchor="middle" class="heading">Context Compiler</text>
<text x="1296" y="525" text-anchor="middle">版本与权限检查 · 去重</text>
<text x="1296" y="561" text-anchor="middle">相关性筛选 · Token 预算控制</text>
<path d="M1296 589 V625" stroke="#8190a0" stroke-width="2.1" fill="none"/>
<path d="M1288.5 625 L1296 640 L1303.5 625 Z" fill="#8190a0"/>
<!-- Model Context -->
<rect x="1050" y="646" width="492" height="117" rx="10" fill="#edf3f2" stroke="#88b9b1" class="node"/>
<text x="1296" y="691" text-anchor="middle" class="heading">Model Context</text>
<text x="1296" y="729" text-anchor="middle">③ 交付必要的完整语义</text>
<!-- Granularity annotations -->
<path d="M127.5 648.5 H795.5" stroke="#c8cfda" stroke-width="2"/>
<text x="128" y="695" class="heading">Retrieval Granularity</text>
<text x="128" y="731" style="fill:#494949">检索粒度：准确定位相关知识</text>
<text x="128" y="778" class="heading">Delivery Granularity</text>
<text x="128" y="814" style="fill:#494949">交付粒度：提供完整的理解依据</text>
<text x="819" y="897" text-anchor="middle" style="font-size:28px;fill:#5d5d5d">图 4-3 基于父子索引的知识检索与上下文交付</text>
</svg>
