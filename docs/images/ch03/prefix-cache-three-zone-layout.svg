</defs>
<rect x="0" y="0" width="1440" height="1120" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">三温区布局：状态置尾，前缀逐轮复用</text>
<text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">按 Token 序列排列稳定契约、阶段证据与当轮焦点；只追加阶段增量，阶段切换时重编译。</text>
<rect x="50" y="126" width="320" height="32" rx="8" fill="#EDF3F9" stroke="#426B9A" stroke-width="1"/>
<text x="210.0" y="148" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#426B9A" font-weight="700" text-anchor="middle">温区一 · 冻结前缀</text>
<rect x="385" y="126" width="516" height="32" rx="8" fill="#EAF4F2" stroke="#3F8079" stroke-width="1"/>
<text x="643.0" y="148" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3F8079" font-weight="700" text-anchor="middle">温区二 · 阶段快照 + 单调追加证据</text>
<rect x="916" y="126" width="474" height="32" rx="8" fill="#FBF1E4" stroke="#B0763A" stroke-width="1"/>
<text x="1153.0" y="148" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#B0763A" font-weight="700" text-anchor="middle">温区三 · 最新 State + 观测 + 请求</text>
<text x="50" y="198" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">连续 Token 序列（块宽仅示意，不代表 Token 数）</text>
<text x="52" y="265" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">第 t 轮</text>
<rect x="205" y="227" width="300" height="76" rx="8" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.2"/>
<text x="355.0" y="260" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">Policy + Core Tools</text>
<text x="355" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">稳定契约 / 静态知识</text>
<rect x="515" y="227" width="236" height="76" rx="8" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="633.0" y="260" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">阶段基准快照</text>
<text x="633" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">Epoch Base</text>
<rect x="761" y="227" width="236" height="76" rx="8" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="879.0" y="260" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">已稳定证据 1…n</text>
<text x="879" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">不修改既有前文</text>
<rect x="1007" y="227" width="383" height="76" rx="8" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.2"/>
<text x="1198.5" y="260" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">State_t + 新观测 + 请求</text>
<text x="1198" y="286" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">本轮瞬时焦点</text>
<text x="52" y="409" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">第 t+1 轮</text>
<rect x="205" y="371" width="300" height="76" rx="8" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.2"/>
