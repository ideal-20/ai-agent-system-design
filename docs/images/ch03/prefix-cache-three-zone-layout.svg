<text x="355" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">逐 Token 相同</text>
<rect x="515" y="371" width="236" height="76" rx="8" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="633.0" y="404" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">阶段基准快照</text>
<text x="633" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">逐 Token 相同</text>
<rect x="761" y="371" width="236" height="76" rx="8" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="879.0" y="404" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">已稳定证据 1…n</text>
<text x="879" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">逐 Token 相同</text>
<rect x="1007" y="371" width="115" height="76" rx="8" fill="#FFFFFF" stroke="#B0763A" stroke-width="1.2"/>
<text x="1064.5" y="404" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">Δ_n+1</text>
<text x="1064" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">新增</text>
<rect x="1132" y="371" width="258" height="76" rx="8" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.2"/>
<text x="1261.0" y="404" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">State_t+1 + 新焦点</text>
<text x="1261" y="430" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">尾部重编译</text>
<line x1="1002" y1="212" x2="1002" y2="471" stroke="#B9504A" stroke-width="1.8" stroke-dasharray="6 5"/>
<line x1="205" y1="471" x2="997" y2="471" stroke="#3F8079" stroke-width="3"/>
<text x="601" y="499" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="middle">相同的连续前缀：缓存存在且配置一致时可复用</text>
<text x="1196" y="499" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="700" text-anchor="middle">从首个变化位置开始重算</text>
<line x1="50" y1="531" x2="1390" y2="531" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="609" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">阶段切换</text>
<rect x="205" y="571" width="300" height="76" rx="8" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.2"/>
<text x="355.0" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="middle">Policy + Core Tools</text>
<text x="355" y="630" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">静态部分可继续匹配</text>
<rect x="515" y="571" width="482" height="76" rx="8" fill="#FFFFFF" stroke="#3F8079" stroke-width="1.2"/>
<text x="756.0" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="middle">新的 Epoch Base</text>
<text x="756" y="630" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">GC + 压缩：重建阶段基准</text>
<rect x="1007" y="571" width="383" height="76" rx="8" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.2"/>
<text x="1198.5" y="604" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">最新 State + 新阶段请求</text>
<text x="1198" y="630" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">新的当轮焦点</text>
<line x1="510" y1="553" x2="510" y2="672" stroke="#B9504A" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="782" y="685" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="500" text-anchor="middle">阶段快照改变：从温区二开始建立新的缓存周期。</text>
<rect x="45" y="727" width="1350" height="244" rx="14" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.2"/>
<text x="69" y="765" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">对照：将可变 State 放在前部，会提前截断共享前缀</text>
<text x="72" y="826" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="700" text-anchor="start">旧布局 t</text>
<rect x="225" y="797" width="161" height="43" rx="7" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.2"/>
<text x="305" y="825" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#426B9A" font-weight="700" text-anchor="middle">Policy</text>
<rect x="396" y="797" width="190" height="43" rx="7" fill="#FFFFFF" stroke="#B9504A" stroke-width="1.2"/>
<text x="491" y="825" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="700" text-anchor="middle">State_t</text>
<rect x="596" y="797" width="770" height="43" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="981" y="825" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="500" text-anchor="middle">同一批工具声明、历史轨迹、已采集证据……</text>
<text x="72" y="889" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="700" text-anchor="start">旧布局 t+1</text>
<rect x="225" y="860" width="161" height="43" rx="7" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.2"/>
<text x="305" y="888" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#426B9A" font-weight="700" text-anchor="middle">Policy</text>
<rect x="396" y="860" width="190" height="43" rx="7" fill="#FFFFFF" stroke="#B9504A" stroke-width="1.2"/>
<text x="491" y="888" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="700" text-anchor="middle">State_t+1</text>
<rect x="596" y="860" width="770" height="43" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="981" y="888" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="500" text-anchor="middle">同一批工具声明、历史轨迹、已采集证据……</text>
<line x1="391" y1="787" x2="391" y2="916" stroke="#B9504A" stroke-width="2" stroke-dasharray="5 4"/>
<text x="692" y="943" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="700" text-anchor="middle">State 一旦在前部改变，后方内容即使文本相同，也不再属于同一个连续前缀。</text>
<rect x="45" y="1030" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1"/>
<text x="70" y="1066" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">实际命中还取决于模型、模板、位置配置、缓存块边界与存活状态；三温区布局不保证固定命中率。</text>
</svg>