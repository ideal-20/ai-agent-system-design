<text x="1122" y="637" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="400" text-anchor="middle">f(固定参数 θ，C_t)</text>
<text x="1122" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#3F8079" font-weight="700" text-anchor="middle">未加载的外部事实，不在本轮输入中</text>
<rect x="45" y="816" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1"/>
<text x="70" y="852" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">System State 决定系统可获取什么；C_t 决定模型本轮能依据什么做判断。</text>
<text x="48" y="900" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">示例：扩容记录即使存在于配置中心，若未采集并注入，仍会成为当前推理的信息盲区。</text>
