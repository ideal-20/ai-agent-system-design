<rect x="0" y="0" width="1440" height="920" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">系统能访问的信息，如何成为模型本轮能看见的证据</text>
<text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">全局状态由外围系统持有；Runtime 围绕当前决策采集、选择并构建受限视图 C_t</text>
