<rect x="0" y="0" width="1440" height="1050" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">缓存与上下文：优化不同环节，保留各自边界</text>
<text x="40" y="86" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B" font-weight="400" text-anchor="start">五种机制在系统中的位置，以及为什么前缀缓存命中不能替代证据筛选</text>
<rect x="45" y="130" width="825" height="390" rx="14" fill="#F7F9FC" stroke="#426B9A" stroke-width="1.2"/>
<text x="69" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">A  应用侧：获取、保存与编译信息</text>
<rect x="70" y="195" width="270" height="120" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="90" y="229.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">Agent Memory</text>
<text x="90" y="271.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">跨会话经验与偏好</text>
<text x="90" y="297.35" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">经检索与时效校验后使用</text>
<rect x="70" y="345" width="270" height="120" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.2"/>
<text x="90" y="379.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="start">应用层 I/O 缓存</text>
<text x="90" y="421.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">工具 / 检索返回值</text>
<text x="90" y="447.35" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">TTL 与查询范围必须匹配</text>
<rect x="420" y="260" width="230" height="145" rx="12" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.2"/>
<text x="440" y="294.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">Context Compiler</text>
<text x="440" y="336.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">选择、去重、压缩</text>
<text x="440" y="362.35" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">构建当前证据组合</text>
<path d="M 340 255 L 380 255 L 380 310 L 420 310" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a3F8079)"/>
<path d="M 340 405 L 380 405 L 380 355 L 420 355" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aB0763A)"/>
<path d="M 650 330 L 695 330" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a426B9A)"/>
<rect x="700" y="255" width="145" height="155" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="720" y="289.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#3F8079" font-weight="700" text-anchor="start">Context</text>
<text x="720" y="328.3" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">当轮 C_t</text>
<text x="720" y="354.65000000000003" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">Token 序列</text>
<text x="70" y="495" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">持久化资料、接口缓存和本轮输入视图具有不同生命周期。</text>
<rect x="920" y="130" width="475" height="390" rx="14" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.2"/>
<text x="944" y="168" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">B  推理侧：复用计算状态</text>
<rect x="950" y="195" width="415" height="115" rx="12" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.2"/>
<text x="970" y="229.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">Prefix / Prompt Cache</text>
<text x="970" y="271.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">跨请求复用匹配前缀的 K/V 状态</text>
<text x="970" y="297.35" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">受模型、缓存有效期及服务实现约束</text>
<rect x="950" y="355" width="415" height="115" rx="12" fill="#FFFFFF" stroke="#3F8079" stroke-width="1.2"/>
<text x="970" y="389.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">请求内的 KV Cache</text>
<text x="970" y="431.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">Decode 读取历史 K/V</text>
<text x="970" y="457.35" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B" font-weight="400" text-anchor="start">每步追加当前 Token 的 K/V</text>
<path d="M 845 330 L 920 330 L 920 410 L 950 410" fill="none" stroke="#3F8079" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a3F8079)"/>
<path d="M 1155 310 L 1155 355" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a426B9A)"/>
<text x="1178" y="337" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#426B9A" font-weight="400" text-anchor="start">命中时复用</text>
<text x="45" y="565" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">C  相同的 50K 噪声前缀：缓存命中改变了什么？</text>
<rect x="45" y="595" width="650" height="300" rx="14" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.2"/>
<text x="69" y="633" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">Prefill：匹配部分可复用</text>
<rect x="75" y="665" width="590" height="65" rx="6" fill="#426B9A" stroke="#426B9A" stroke-width="1.2"/>
<text x="370" y="704" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">已缓存的 50K 前缀 K/V</text>
<path d="M 370 735 L 370 765" fill="none" stroke="#426B9A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a426B9A)"/>
<text x="75" y="805" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="700" text-anchor="start">减少匹配前缀的重复计算</text>
<text x="75" y="843.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">实际加速与计费折扣取决于缓存命中及服务协议。</text>
<rect x="725" y="595" width="670" height="300" rx="14" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.2"/>
<text x="749" y="633" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="start">Decode：窗口里的噪声仍然存在</text>
<rect x="755" y="665" width="445" height="65" rx="6" fill="#B0763A" stroke="#B0763A" stroke-width="1.2"/>
<text x="978" y="704" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">50K 噪声 Key 仍在上下文中</text>
<rect x="1225" y="665" width="140" height="65" rx="6" fill="#3F8079" stroke="#3F8079" stroke-width="1.2"/>
<text x="1295" y="704" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">新 Token</text>
<path d="M 1295 740 L 1295 762 L 978 762 L 978 735" fill="none" stroke="#B0763A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aB0763A)"/>
<text x="755" y="805" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#B0763A" font-weight="700" text-anchor="start">信息干扰与读取开销仍需治理</text>
<text x="755" y="843.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">缓存没有删除冗余信息，也不自动提高证据质量。</text>
<rect x="45" y="946" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1"/>
<text x="70" y="982" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">上下文工程决定“选哪些信息”；缓存布局决定“怎样复用这些信息的计算”。</text>
<text x="48" y="1030" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">位置与机制示意；右下计算关系以常见的稠密因果注意力为例。</text>
</svg>