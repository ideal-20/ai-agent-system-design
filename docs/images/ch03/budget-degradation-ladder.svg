<text x="1074" y="460" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">安全红线与输出契约</text>
<text x="1074" y="491" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">当前 Decision Request</text>
<text x="1074" y="522" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">当前阶段权限边界</text>
<text x="1074" y="578" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B9504A" font-weight="700" text-anchor="start">P0 无法装入 → 配置异常熔断</text>
<rect x="1050" y="638" width="340" height="245" rx="14" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.2"/>
<text x="1074" y="676" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="start">优先保留 P1</text>
<text x="1074" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">最新 Task State</text>
<text x="1074" y="741" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">活跃假设的关键正反证</text>
<text x="1074" y="772" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">正常基线与负向观测</text>
<text x="1074" y="821.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="700" text-anchor="start">超限时缩小采集范围，保留决策所需事</text>
<text x="1074" y="847.35" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="700" text-anchor="start">实。</text>
<rect x="45" y="1010" width="1350" height="58" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1"/>
<text x="70" y="1046" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">六级是动作执行顺序；P0–P5 是信息保底优先级，两套编号分别回答“怎么减”和“保什么”。</text>
