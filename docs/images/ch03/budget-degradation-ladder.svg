<text x="1076" y="274.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="400" text-anchor="start">长度合规，且契约、状态与当前决策</text>
