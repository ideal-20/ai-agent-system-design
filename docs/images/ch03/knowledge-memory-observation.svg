<text x="48" y="920" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B" font-weight="400" text-anchor="start">Observation 的证据身份不代表内容可信：其中仍可能夹带攻击文本，需接受独立的清洗与权限控制。</text>
