<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500px" height="1010px" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
<title id="title">多步任务的误差传播：单步准确不等于轨迹可靠</title>
<desc id="desc">p^n 只是假设各步独立且必须全对时的理想基准；真实 Agent 是有状态、强耦合过程</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs>
<rect width="1500" height="1010" fill="#FFFFFF"/>
<text x="40" y="54" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700">多步任务的误差传播：单步准确不等于轨迹可靠</text>
<text x="40" y="86" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">p^n 只是假设各步独立且必须全对时的理想基准；真实 Agent 是有状态、强耦合过程</text>
<rect x="45" y="130" width="620" height="470" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="70" y="170" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#2F5C93" font-weight="700">理想独立模型：p = 0.95</text>
<text x="70" y="198" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#64748B">连续 n 步全对的概率 p^n</text>
<line x1="110" y1="510" x2="610" y2="510" stroke="#64748B" stroke-width="1.2"/>
<line x1="110" y1="510" x2="110" y2="235" stroke="#64748B" stroke-width="1.2"/>
<line x1="110" y1="510" x2="110" y2="516" stroke="#64748B" stroke-width="1"/>
<text x="110" y="534" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">0</text>
<line x1="200" y1="510" x2="200" y2="516" stroke="#64748B" stroke-width="1"/>
<text x="200" y="534" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">2</text>
<line x1="290" y1="510" x2="290" y2="516" stroke="#64748B" stroke-width="1"/>
<text x="290" y="534" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">4</text>
<line x1="380" y1="510" x2="380" y2="516" stroke="#64748B" stroke-width="1"/>
<text x="380" y="534" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">6</text>
<line x1="470" y1="510" x2="470" y2="516" stroke="#64748B" stroke-width="1"/>
<text x="470" y="534" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">8</text>
<line x1="560" y1="510" x2="560" y2="516" stroke="#64748B" stroke-width="1"/>
<text x="560" y="534" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">10</text>
<line x1="110" y1="235" x2="610" y2="235" stroke="#E5EAF0" stroke-width="1"/>
<text x="94" y="239" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748B">100%</text>
<line x1="110" y1="303.75" x2="610" y2="303.75" stroke="#E5EAF0" stroke-width="1"/>
<text x="94" y="307.75" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748B">75%</text>
<line x1="110" y1="372.5" x2="610" y2="372.5" stroke="#E5EAF0" stroke-width="1"/>
<text x="94" y="376.5" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748B">50%</text>
<line x1="110" y1="441.25" x2="610" y2="441.25" stroke="#E5EAF0" stroke-width="1"/>
<text x="94" y="445.25" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748B">25%</text>
<line x1="110" y1="510" x2="610" y2="510" stroke="#E5EAF0" stroke-width="1"/>
<text x="94" y="514" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748B">0%</text>
<path d="M 155 248.75 L 200 261.8125 L 245 274.22187500000007 L 290 286.01078125000004 L 335 297.21024218750006 L 380 307.84973007812505 L 425 317.95724357421886 L 470 327.5593813955079 L 515 336.6814123257325 L 560 345.34734170944586" fill="none" stroke="#426B9A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="155" cy="248.75" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="200" cy="261.8125" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="245" cy="274.22187500000007" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="290" cy="286.01078125000004" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="335" cy="297.21024218750006" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="380" cy="307.84973007812505" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="425" cy="317.95724357421886" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="470" cy="327.5593813955079" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="515" cy="336.6814123257325" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="560" cy="345.34734170944586" r="4" fill="#426B9A" stroke="#426B9A" stroke-width="1"/>
<circle cx="560" cy="345.34734170944586" r="7" fill="#B9504A" stroke="#B9504A" stroke-width="1"/>
<text x="568" y="335" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#B9504A" font-weight="700">59.9%</text>
<text x="110" y="557" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">步骤数 n</text>
<text x="70" y="582" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#B0763A" font-weight="700">这里只作直觉基准；真实任务成功率不能直接由 p^n 推算。</text>
<rect x="700" y="130" width="755" height="470" rx="16" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="725" y="170" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B0763A" font-weight="700">真实轨迹：一次偏差可能污染后续状态</text>
<rect x="730" y="245" width="145" height="98" rx="12" fill="#FFFFFF" stroke="#B9504A" stroke-width="1.3"/>
<text x="802.5" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">选错服务</text>
<text x="802.5" y="313" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B">inventory</text>
<rect x="910" y="245" width="145" height="98" rx="12" fill="#FFFFFF" stroke="#B9504A" stroke-width="1.3"/>
<text x="982.5" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">查回无关数据</text>
<text x="982.5" y="313" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B">无关日志</text>
<rect x="1090" y="245" width="145" height="98" rx="12" fill="#FFFFFF" stroke="#B0763A" stroke-width="1.3"/>
<text x="1162.5" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B0763A" font-weight="700">上下文被污染</text>
<text x="1162.5" y="313" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B">偏航加深</text>
<rect x="1270" y="245" width="145" height="98" rx="12" fill="#FFFFFF" stroke="#B9504A" stroke-width="1.3"/>
<text x="1342.5" y="282" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">结论失真</text>
<text x="1342.5" y="313" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B">纠偏更难</text>
<line x1="875" y1="294" x2="905" y2="294" stroke="#B9504A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
<line x1="1055" y1="294" x2="1085" y2="294" stroke="#B9504A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
<line x1="1235" y1="294" x2="1265" y2="294" stroke="#B9504A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
<text x="730" y="403" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#24364B"><tspan x="730" dy="0">错误不是独立事件：前一步会改变后续输入和可选动作。</tspan><tspan x="730" dy="20.7">外部反馈与检查点可以中断污染链，但不会自动保证恢复。</tspan></text>
<rect x="730" y="500" width="225" height="30" rx="15" fill="#FBEDEC" stroke="#B9504A" stroke-width="1"/>
<text x="842.5" y="520" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">上下文污染</text>
<rect x="970" y="500" width="250" height="30" rx="15" fill="#FBF1E4" stroke="#B0763A" stroke-width="1"/>
<text x="1095.0" y="520" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B0763A" font-weight="700">有状态条件过程</text>
<text x="45" y="665" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700">错误的可恢复性取决于外部副作用</text>
<rect x="45" y="700" width="680" height="240" rx="16" fill="#EDF6EF" stroke="#518367" stroke-width="1.3"/>
<text x="72" y="742" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#518367" font-weight="700">只读查询：通常可恢复</text>
<text x="72" y="787" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#24364B"><tspan x="72" dy="0">填错时间参数 → 返回空结果</tspan><tspan x="72" dy="22.08">→ 观察到失败反馈 → 修正参数后重查</tspan></text>
<rect x="72" y="870" width="230" height="30" rx="15" fill="#FFFFFF" stroke="#518367" stroke-width="1"/>
<text x="187.0" y="890" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#518367" font-weight="700">无外部写副作用</text>
<rect x="775" y="700" width="680" height="240" rx="16" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.3"/>
<text x="802" y="742" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B9504A" font-weight="700">写操作：副作用可能不可逆</text>
<text x="802" y="787" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#24364B"><tspan x="802" dy="0">误触回滚 / 误删节点 → 环境已改变</tspan><tspan x="802" dy="22.08">→ 后续道歉不能撤回物理影响</tspan></text>
<rect x="802" y="870" width="245" height="30" rx="15" fill="#FFFFFF" stroke="#B9504A" stroke-width="1"/>
<text x="924.5" y="890" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">需在执行前设门禁</text>
<text x="45" y="980" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">工程上应评估完整任务轨迹、恢复策略与不可逆动作风险，而非只看单轮问答分数。</text>
</svg>