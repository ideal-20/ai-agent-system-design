<line x1="455" y1="292" x2="505" y2="292" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="925" y1="292" x2="975" y2="292" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="655" width="850" height="160" rx="16" fill="#FBEDEC" stroke="#B9504A" stroke-width="1.4"/>
<text x="70" y="693" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700">若证据不足时先断言“数据库连接池耗尽”</text>
<text x="70" y="735" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#24364B"><tspan x="70" dy="0">该断言进入后续前缀，后续解释可能围绕它继续展开。</tspan><tspan x="70" dy="22.08">普通解码不会自动删除或回滚已生成内容。</tspan></text>
<rect x="70" y="770" width="225" height="30" rx="15" fill="#FFFFFF" stroke="#B9504A" stroke-width="1"/>
<text x="182.5" y="790" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">前序输出影响后续</text>
<rect x="925" y="655" width="470" height="160" rx="16" fill="#EDF6EF" stroke="#518367" stroke-width="1.4"/>
<text x="950" y="693" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#518367" font-weight="700">如何纠偏？</text>
<text x="950" y="735" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#24364B"><tspan x="950" dy="0">注入新证据并重新判断；模型也可能</tspan><tspan x="950" dy="20.7">自行修正，但前序影响不会自动消失。</tspan></text>
<line x1="1330" y1="690" x2="1330" y2="755" stroke="#518367" stroke-width="2" marker-end="url(#arrowTeal)"/>
<text x="1310" y="790" text-anchor="end" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#518367" font-weight="700">新证据</text>
