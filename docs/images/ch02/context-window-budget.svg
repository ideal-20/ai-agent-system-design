<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="920px" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">Context Window：输入与输出共同占用一个窗口</title>
<desc id="desc">用 32K Token 的简化账本，观察新证据如何挤占输出与推理余量</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs>
<rect width="1440" height="920" fill="#FFFFFF"/>
<text x="40" y="54" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700">Context Window：输入与输出共同占用一个窗口</text>
<text x="40" y="86" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">用 32K Token 的简化账本，观察新证据如何挤占输出与推理余量</text>
<rect x="45" y="120" width="1350" height="100" rx="14" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1"/>
<text x="70" y="154" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#2F5C93" font-weight="700">输入 = 系统 + 工具 + 任务 + 历史 + 证据 + 协议包装</text>
<text x="70" y="192" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">输入 + 输出 ≤ W；推理 Token 的计入方式与最大输出额度以服务协议为准。</text>
<text x="65" y="266" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700">① 加入新证据之前</text>
<text x="65" y="299" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">固定输入约 4K + 历史约 25K + 预留输出 0.5K → 剩余约 2.5K</text>
<rect x="85" y="352" width="144" height="78" rx="3" fill="#426B9A" stroke="#FFFFFF" stroke-width="1"/>
<rect x="229" y="352" width="900" height="78" rx="3" fill="#3F8079" stroke="#FFFFFF" stroke-width="1"/>
<rect x="1129" y="352" width="90.0" height="78" rx="3" fill="#F1F5F9" stroke="#FFFFFF" stroke-width="1"/>
<rect x="1219.0" y="352" width="18.0" height="78" rx="3" fill="#B0763A" stroke="#FFFFFF" stroke-width="1"/>
<text x="157" y="385" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">固定输入</text>
<text x="157" y="410" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">4K</text>
<text x="679.0" y="385" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#FFFFFF" font-weight="700">历史消息与已有日志</text>
<text x="679.0" y="410" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700">25K</text>
<text x="1174.0" y="398" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#64748B" font-weight="700">2.5K</text>
<line x1="1174.0" y1="352" x2="1174.0" y2="330" stroke="#64748B" stroke-width="1.5"/>
<text x="1174.0" y="322" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B" font-weight="700">可用余量</text>
<path d="M 1228.0 430 L 1228.0 452 L 1277 452" fill="none" stroke="#B0763A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1282" y="456" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B0763A" font-weight="700">输出 0.5K</text>
<line x1="85" y1="472" x2="1237" y2="472" stroke="#CBD5E1" stroke-width="1.2"/>
<line x1="85" y1="467" x2="85" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="85" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">0K</text>
<line x1="229" y1="467" x2="229" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="229" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">4K</text>
<line x1="373" y1="467" x2="373" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="373" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">8K</text>
<line x1="517" y1="467" x2="517" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="517" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">12K</text>
<line x1="661" y1="467" x2="661" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="661" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">16K</text>
<line x1="805" y1="467" x2="805" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="805" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">20K</text>
<line x1="949" y1="467" x2="949" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="949" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">24K</text>
<line x1="1093" y1="467" x2="1093" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="1093" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">28K</text>
<line x1="1237" y1="467" x2="1237" y2="477" stroke="#64748B" stroke-width="1"/>
<text x="1237" y="498" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748B">32K</text>
<text x="65" y="557" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700">② 再加入 4K 的新日志</text>
<text x="65" y="590" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B">4K 固定输入 + 25K 历史 + 4K 新证据 + 0.5K 输出 = 33.5K</text>
<rect x="85" y="632" width="144" height="78" rx="3" fill="#426B9A" stroke="#FFFFFF" stroke-width="1"/>
<rect x="229" y="632" width="900" height="78" rx="3" fill="#3F8079" stroke="#FFFFFF" stroke-width="1"/>
<rect x="1129" y="632" width="144" height="78" rx="3" fill="#B9504A" stroke="#FFFFFF" stroke-width="1"/>
<rect x="1273" y="632" width="18.0" height="78" rx="3" fill="#B0763A" stroke="#FFFFFF" stroke-width="1"/>
<text x="157" y="678" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">4K</text>
<text x="679.0" y="678" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700">25K</text>
<text x="1201" y="665" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">新证据</text>
<text x="1201" y="690" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">4K</text>
<line x1="1237" y1="612" x2="1237" y2="731" stroke="#B9504A" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1249" y="603" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B9504A" font-weight="700">32K 上限</text>
<line x1="1237" y1="730" x2="1291.0" y2="730" stroke="#B9504A" stroke-width="2"/>
<line x1="1291.0" y1="720" x2="1291.0" y2="735" stroke="#B9504A" stroke-width="1.5"/>
<text x="1264" y="760" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#B9504A" font-weight="700">超限 1.5K</text>
<rect x="45" y="813" width="1350" height="65" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1"/>
<text x="70" y="852" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B0763A" font-weight="700">需要裁剪输入或调整输出预算；窗口放得下，也不代表其中信息都能被可靠利用。</text>
<text x="65" y="911" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B">示例按 K 单位简化计算；4K 固定输入合并系统、工具和少量其他开销，实际占用需用目标 Tokenizer 计算。</text>
</svg>