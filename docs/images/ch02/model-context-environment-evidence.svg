<text x="70" y="365" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#2F5C93" font-weight="700">推理阶段：参数保持固定，外围系统重建本轮上下文</text>
