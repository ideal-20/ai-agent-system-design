<text x="590" y="663" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#24364B">时间窗口与待验证假设</text>
<path d="M 382 666 L 470 666 L 470 580 L 542 580" fill="none" stroke="#3F8079" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
