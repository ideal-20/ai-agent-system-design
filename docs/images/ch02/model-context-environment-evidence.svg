<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="915px" viewBox="0 0 1440 915" role="img" aria-labelledby="title desc">
<title id="title">能力、上下文与事实：三种信息来源各有职责</title>
<desc id="desc">训练更新参数；推理读取固定参数与本轮 Context；具体事故事实必须从外部环境获取</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker></defs>
<rect width="1440" height="915" fill="#FFFFFF"/>
<text x="40" y="54" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700">能力、上下文与事实：三种信息来源各有职责</text>
<text x="40" y="86" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">训练更新参数；推理读取固定参数与本轮 Context；具体事故事实必须从外部环境获取</text>
<rect x="45" y="125" width="1350" height="175" rx="16" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="70" y="157" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#2F5C93" font-weight="700">训练阶段：通过数据和反馈更新参数</text>
<rect x="70" y="181" width="290" height="90" rx="12" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.4"/>
<text x="215.0" y="214" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#2F5C93" font-weight="700">训练数据与反馈</text>
<text x="215.0" y="246" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">文本 / 代码 / 示范 / 奖励</text>
<rect x="430" y="181" width="350" height="90" rx="12" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.4"/>
<text x="605.0" y="214" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#2F5C93" font-weight="700">优化器更新参数</text>
<text x="605.0" y="246" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">计算损失 → 梯度 → 更新 θ</text>
<rect x="965" y="181" width="390" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/>
<text x="1160.0" y="214" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#2F5C93" font-weight="700">模型参数 θ</text>
<text x="1160.0" y="246" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">通用知识、模式识别与推理能力</text>
<line x1="365" y1="226" x2="421" y2="226" stroke="#426B9A" stroke-width="2" marker-end="url(#arrowBlue)"/>
<line x1="785" y1="226" x2="952" y2="226" stroke="#426B9A" stroke-width="2" marker-end="url(#arrowBlue)"/>
<text x="865" y="212" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#426B9A" font-weight="700">写入 θ</text>
