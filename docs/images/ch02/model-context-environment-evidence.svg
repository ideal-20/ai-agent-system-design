<text x="93" y="449" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700">外部环境：现场观测</text>
<text x="93" y="486" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#24364B"><tspan x="93" dy="0">日志 / 监控 / 链路追踪</tspan><tspan x="93" dy="22.08">例如：10:02 新实例超时率 8%</tspan></text>
<line x1="225" y1="555" x2="225" y2="606" stroke="#B0763A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="248" y="589" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#B0763A" font-weight="700">工具查询结果</text>
