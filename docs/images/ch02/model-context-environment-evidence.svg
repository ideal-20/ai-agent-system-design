<text x="590" y="528" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#24364B">任务目标与系统约束</text>
<rect x="575" y="550" width="270" height="33" rx="7" fill="#FFFFFF" stroke="#3F8079" stroke-width="0.8"/>
<text x="590" y="573" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#24364B">历史消息：由外围重新注入</text>
<rect x="575" y="595" width="270" height="33" rx="7" fill="#FFFFFF" stroke="#3F8079" stroke-width="0.8"/>
<text x="590" y="618" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#24364B">工具结果：现场证据</text>
