<text x="1160" y="547" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#2F5C93" font-weight="700">Model：本轮前向计算</text>
<text x="1160" y="583" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#24364B">f(固定参数 θ，当前上下文 C_t)</text>
<text x="1160" y="619" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" fill="#64748B">利用通用能力分析本次任务</text>
<line x1="1160" y1="275" x2="1160" y2="494" stroke="#426B9A" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
<rect x="1085" y="389" width="150" height="48" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1160" y="420" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#426B9A" font-weight="700">只读 θ</text>
<line x1="874" y1="577" x2="955" y2="577" stroke="#3F8079" stroke-width="2.4" marker-end="url(#arrowTeal)"/>
<text x="917" y="558" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#3F8079" font-weight="700">输入</text>
<line x1="1160" y1="650" x2="1160" y2="687" stroke="#426B9A" stroke-width="2" marker-end="url(#arrowBlue)"/>
<rect x="965" y="695" width="390" height="60" rx="12" fill="#FFFFFF" stroke="#426B9A" stroke-width="1.2"/>
<text x="1160" y="732" text-anchor="middle" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#2F5C93" font-weight="700">输出：候选判断 / 待验证假设</text>
<rect x="45" y="800" width="1350" height="76" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.1"/>
<text x="70" y="831" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700">通用能力 ≠ 本次事故事实；持续记忆依赖外围存储与上下文重建。</text>
<text x="70" y="858" text-anchor="start" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" fill="#64748B">ROM / RAM / I/O 是职责类比；工具结果也可能过期、不完整或来源不可信。</text>
</svg>