<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">DPO 与环境交互式 RL：监督来源与更新闭环不同</title><desc id="desc">两种方法都产生候选策略；偏好、奖励与约束本身仍需独立验证</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="1000" fill="#FFFFFF"/><rect x="40" y="135" width="650" height="715" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><rect x="750" y="135" width="650" height="715" rx="12" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.4"/><path d="M 365 355 L 365 395 L 212 395 L 212 430" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 365 395 L 518 395 L 518 430" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 212 525 L 212 630" fill="none" stroke="#64748B" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#gray)"/><path d="M 518 525 L 518 630" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 560 630 L 665 610 L 665 465 L 640 465" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1220 295 L 1310 295 L 1310 430" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1215 515 L 1215 650" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1080 692 L 1025 692" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 908 650 L 908 515" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 908 430 L 908 295 L 950 295" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="90" y="260" width="550" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="90" y="430" width="245" height="95" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="395" y="430" width="245" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="90" y="630" width="550" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="950" y="255" width="270" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="1080" y="430" width="270" height="85" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1080" y="650" width="270" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="790" y="650" width="235" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="790" y="430" width="235" height="85" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="40" y="900" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">DPO 与环境交互式 RL：监督来源与更新闭环不同</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">两种方法都产生候选策略；偏好、奖励与约束本身仍需独立验证</text><text x="64" y="173" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">DPO：在固定偏好对上直接优化</text><text x="64" y="204" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">典型离线设置；无需每步调用环境</text><text x="365.0" y="299.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">相同输入 x 下的 y+ 与 y−</text><text x="365.0" y="331.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">偏好依据明确，控制长度和格式混杂</text><text x="212.5" y="469.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="700" text-anchor="middle">固定参考策略</text><text x="212.5" y="501.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">π_ref</text><text x="517.5" y="469.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">训练中策略</text><text x="517.5" y="501.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">π_θ</text><text x="365.0" y="669.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">偏好损失 → 参数更新</text><text x="365.0" y="701.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">使用两策略对偏好输出的相对概率</text><text x="620" y="585" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">参数更新</text><text x="90" y="795" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">外部可迭代收集新偏好；这不等于 DPO 本身在线探索。</text><text x="774" y="173" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">环境交互式 RL：行动改变后续观测</text><text x="774" y="204" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">可重置沙箱与受控探索，不借用生产副作用</text><text x="1085.0" y="289.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">当前策略 π_θ</text><text x="1085.0" y="321.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">从当前历史选择动作</text><text x="1215.0" y="464.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">隔离环境</text><text x="1215.0" y="496.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">动作 → 后续观测</text><text x="1215.0" y="684.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">轨迹与奖励</text><text x="1215.0" y="716.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">终局 / 局部反馈</text><text x="907.5" y="684.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">信用分配</text><text x="907.5" y="716.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">哪些动作影响结果</text><text x="907.5" y="464.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">策略更新</text><text x="907.5" y="496.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">目标与参考约束</text><text x="790" y="795" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">奖励漏洞、模拟差距与长期归因需要单独检查。</text><text x="64" y="938" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">DPO 不需要另训显式奖励模型后再跑 PPO；任何训练算法都不替代 Runtime 的硬约束。</text></svg>
