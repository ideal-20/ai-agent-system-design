<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc"><title id="title">一次经验，可以进入不同能力载体</title><desc id="desc">按失败机制选择承接位置；分支可以组合，但没有从记忆到参数的必经阶梯</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="1020" fill="#FFFFFF"/><path d="M 525 485 L 490 485 L 490 240 L 460 240" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 525 485 L 490 485 L 490 490 L 460 490" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 525 485 L 490 485 L 490 740 L 460 740" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 915 485 L 945 485 L 945 240 L 980 240" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 915 485 L 945 485 L 945 490 L 980 490" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 915 485 L 945 485 L 945 740 L 980 740" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><rect x="525" y="410" width="390" height="150" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="60" y="180" width="400" height="120" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="60" y="430" width="400" height="120" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="60" y="680" width="400" height="120" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="980" y="180" width="400" height="120" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="980" y="430" width="400" height="120" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="980" y="680" width="400" height="120" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="60" y="840" width="1320" height="45" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="40" y="920" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">一次经验，可以进入不同能力载体</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">按失败机制选择承接位置；分支可以组合，但没有从记忆到参数的必经阶梯</text><text x="720.0" y="477.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="23" fill="#3F8079" font-weight="700" text-anchor="middle">有证据、有范围的经验</text><text x="720.0" y="509.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">先确定缺陷，再选择改变什么</text><text x="260.0" y="232.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#426B9A" font-weight="700" text-anchor="middle">Context</text><text x="260.0" y="264.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">本轮输入、来源与证据排序</text><text x="260.0" y="482.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#3F8079" font-weight="700" text-anchor="middle">Memory</text><text x="260.0" y="514.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">带适用范围的历史经验</text><text x="260.0" y="732.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#3F8079" font-weight="700" text-anchor="middle">Knowledge</text><text x="260.0" y="764.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">受治理的事实、规则与规范</text><text x="1180.0" y="232.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#426B9A" font-weight="700" text-anchor="middle">Skill</text><text x="1180.0" y="264.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">触发条件、步骤与验证方法</text><text x="1180.0" y="482.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#426B9A" font-weight="700" text-anchor="middle">Program</text><text x="1180.0" y="514.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">确定性规则、门禁与协议</text><text x="1180.0" y="732.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" fill="#B0763A" font-weight="700" text-anchor="middle">Parameter</text><text x="1180.0" y="764.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">跨任务的统计行为模式</text><text x="720" y="650" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="middle">同一原则可以协同表达</text><text x="720" y="693" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">Prompt 帮助理解</text><text x="720" y="728" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">Program 约束可提交动作</text><text x="720" y="870" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="middle">Task State 继续保存当前执行事实；不因生成经验、修改 Prompt 或训练模型而改写。</text><text x="64" y="958" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">必要信息缺失先修复信息链；规则可计算先落实程序；剩余稳定行为缺口再考虑训练。</text></svg>
