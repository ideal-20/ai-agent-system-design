<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc"><title id="title">经验候选生命周期：晋级绑定具体版本，拒绝和撤销保留原因</title><desc id="desc">教学状态机；绿色表示已通过当前门槛，不表示永远适用</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="1020" fill="#FFFFFF"/><path d="M 420 270 L 520 270" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 870 270 L 970 270" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1145 320 L 1145 510" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 970 560 L 870 560" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 520 560 L 420 560" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 245 320 L 245 355 L 695 355 L 695 380" fill="none" stroke="#B9504A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#red)"/><path d="M 1145 320 L 1145 355 L 695 355 L 695 380" fill="none" stroke="#B9504A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#red)"/><path d="M 245 610 L 245 760" fill="none" stroke="#64748B" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#gray)"/><path d="M 695 610 L 695 760" fill="none" stroke="#B9504A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#red)"/><path d="M 420 580 L 465 580 L 465 720 L 600 720 L 600 760" fill="none" stroke="#B9504A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#red)"/><rect x="70" y="220" width="350" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="520" y="220" width="350" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="970" y="220" width="350" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="970" y="510" width="350" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="520" y="510" width="350" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="70" y="510" width="350" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="520" y="380" width="350" height="70" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="70" y="760" width="350" height="85" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="520" y="760" width="350" height="85" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="40" y="920" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">经验候选生命周期：晋级绑定具体版本，拒绝和撤销保留原因</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学状态机；绿色表示已通过当前门槛，不表示永远适用</text><text x="245.0" y="262.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">EXTRACTED</text><text x="245.0" y="294.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">提取事实与候选</text><text x="695.0" y="262.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">EVIDENCE_CHECKED</text><text x="695.0" y="294.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">来源、范围、使用资格通过</text><text x="1145.0" y="262.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">PROPOSED</text><text x="1145.0" y="294.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">选定载体与验证假设</text><text x="1145.0" y="552.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">VALIDATED</text><text x="1145.0" y="584.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">独立测试与反例检查通过</text><text x="695.0" y="552.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">CANARY</text><text x="695.0" y="584.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">限定暴露并观察业务</text><text x="245.0" y="552.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">ACTIVE</text><text x="245.0" y="584.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">达到推广条件</text><text x="1235" y="420" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3F8079" font-weight="400" text-anchor="middle">测试通过</text><text x="695.0" y="422.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">REJECTED</text><text x="695" y="340" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#B9504A" font-weight="400" text-anchor="middle">无依据 / 无再利用资格 / 无收益 / 边界失败</text><text x="245.0" y="794.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="700" text-anchor="middle">SUPERSEDED</text><text x="245.0" y="826.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">由经验证的新版本取代</text><text x="695.0" y="794.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="middle">REVOKED</text><text x="695.0" y="826.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">事实、资格、风险或效果失效</text><text x="350" y="700" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">有明确替代版本</text><text x="820" y="700" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B9504A" font-weight="400" text-anchor="middle">灰度发现退化</text><text x="1010" y="720" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#24364B" font-weight="700" text-anchor="start">每次迁移关联：</text><text x="1010" y="762" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">审核结论、评估报告、</text><text x="1010" y="793" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">内容摘要与依赖版本。</text><text x="64" y="958" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">REJECTED 拒绝某个归纳或方案；REVOKED 停止继续使用派生能力，都不抹除已发生事实。</text></svg>
