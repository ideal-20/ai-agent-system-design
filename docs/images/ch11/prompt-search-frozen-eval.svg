<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">Prompt 搜索：开发循环可以反复，发布确认保持独立</title><desc id="desc">优化实际任务效用，并固定可编辑范围、硬门禁与搜索预算</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="940" fill="#FFFFFF"/><rect x="40" y="135" width="895" height="620" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4"/><rect x="1010" y="135" width="390" height="620" rx="12" fill="#EAF4F2" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 320 335 L 375 335" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 610 335 L 665 335" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 778 385 L 778 545" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 395 590 L 200 590 L 200 385" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 840 590 L 970 590 L 970 335 L 1050 335" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1205 385 L 1205 545" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="85" y="285" width="235" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="375" y="285" width="235" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="665" y="285" width="225" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="395" y="545" width="445" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1050" y="285" width="310" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1050" y="545" width="310" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="40" y="790" width="1360" height="42" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="40" y="840" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">Prompt 搜索：开发循环可以反复，发布确认保持独立</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">优化实际任务效用，并固定可编辑范围、硬门禁与搜索预算</text><text x="64" y="173" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">开发区：候选生成与试验</text><text x="64" y="204" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">开发反馈可以进入下一轮；记录尝试数和被拒绝的差异</text><text x="202.5" y="327.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">生成候选差异</text><text x="202.5" y="359.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">字段 / 示例 / 组织方式</text><text x="492.5" y="327.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">静态与硬门禁</text><text x="492.5" y="359.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">禁止降低验收要求</text><text x="777.5" y="327.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">开发任务执行</text><text x="777.5" y="359.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">动作、结果与成本</text><text x="617.5" y="582.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">比较并保留合格候选</text><text x="617.5" y="614.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">实际效用 + 严重违规 + 成本</text><text x="265" y="500" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">失败反馈与候选修订</text><text x="80" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">停止条件：候选数 / 执行成本 / 无收益轮数达到上限。</text><text x="1034" y="173" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">冻结发布确认</text><text x="1034" y="204" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">未参与候选选择的独立任务</text><text x="1205.0" y="327.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">固定候选与评估器</text><text x="1205.0" y="359.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">冻结内容摘要、版本和条件</text><text x="1205.0" y="582.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#3F8079" font-weight="700" text-anchor="middle">独立确认报告</text><text x="1205.0" y="614.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">决定发布、拒绝或补证</text><text x="970" y="470" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">冻结后送检</text><text x="720" y="818" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="middle">若确认集的错误细节反馈给优化器，该数据就已参与开发，需要更换独立确认来源。</text><text x="64" y="878" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">有限样本中零严重违规只是发布证据的一部分；不等于对未来所有任务的零风险证明。</text></svg>
