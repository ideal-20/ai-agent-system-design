="610" width="310" height="85" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="40" y="750" width="940" height="95" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1040" y="750" width="360" height="95" rx="12" fill="#F7F9FC" stroke="#64748B" stroke-width="1.4"/><rect x="40" y="900" width="1360" height="100" rx="12" fill="#FBEFEE" stroke="#B9504A" stroke-width="1.4"/><rect x="40" y="1060" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">派生关系与撤销：先定位失效对象，再沿血缘处理影响</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学候选链；分支表示可选承接位置，普通优化首先影响新 Run</text><text x="220.0" y="187.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">RUN-11-01 局部证据</text><text x="220.0" y="219.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">保留已发生的操作与观察</text><text x="750.0" y="187.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#426B9A" font-weight="700" text-anchor="middle">EXP-11-VERIFY-01@1</text><text x="750.0" y="219.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">有范围的经验与未验证改进假设</text><text x="1250.0" y="187.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B9504A" font-weight="700" text-anchor="middle">新反例 / 撤销事件</text><text x="1250.0" y="219.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">事实、范围、实现或依赖问题</text><text x="195.0" y="464.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Prompt 候选</text><text x="195.0" y="496.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">verify-context@3</text><text x="545.0" y="464.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Skill 候选</text><text x="545.0" y="496.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">verify-change-outcome@0.2.0</text><text x="895.0" y="464.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">Program 候选</text><text x="895.0" y="496.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">verification-summary@2</text><text x="1245.0" y="464.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">合成模板 / 数据</text><text x="1245.0" y="496.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">来源组 + 验证器 + 使用资格</text><text x="720" y="350" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700" text-anchor="middle">正向记录派生关系；问题出现时沿关系检索受影响制品并逐项处置。</text><text x="1245.0" y="644.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#B0763A" font-weight="700" text-anchor="middle">可选模型候选</text><text x="1245.0" y="676.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">删除数据不等于删除参数影响</text><text x="510.0" y="789.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#3F8079" font-weight="700" text-anchor="middle">冻结经过验证的组合 → 独立发布评估 → 有限灰度</text><text x="510.0" y="821.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">按版本与内容摘要推广；未验证候选不自动上线</text><text x="1220.0" y="789.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#64748B" font-weight="700" text-anchor="middle">在途 RUN-11-01</text><text x="1220.0" y="821.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">继续固定原执行定义</text><text x="65" y="937" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B9504A" font-weight="700" text-anchor="start">安全撤销可以阻断旧版本后续调用；必要迁移在安全边界显式完成。</text><text x="65" y="976" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="start">CHG-11 的原身份与已确认结果继续保留；回滚 Agent 不能重放或抹除外部变更。</text><text x="64" y="1098" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">Memory 可撤下，Skill / Program 可禁用，模型需定位派生训练链；不同载体采用不同撤销机制。</text></svg>
