<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc"><title id="title">Feedback Loop：延迟反馈回连原决策，候选经过独立晋级</title><desc id="desc">运行事实、业务结果与用户体验分开保存；晚到信号不覆盖无关的新任务</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="970" fill="#FFFFFF"/><path d="M 490 205 L 560 205" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 950 205 L 1050 205" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 755 355 L 755 250" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#amber)"/><path d="M 1210 250 L 1210 580" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 1050 630 L 950 630" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 560 630 L 490 630" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 280 580 L 280 250" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="70" y="160" width="420" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="560" y="160" width="390" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="1050" y="160" width="320" height="90" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="560" y="355" width="390" height="100" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="1050" y="580" width="320" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="560" y="580" width="390" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="70" y="580" width="420" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="70" y="760" width="1300" height="70" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="40" y="870" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">Feedback Loop：延迟反馈回连原决策，候选经过独立晋级</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">运行事实、业务结果与用户体验分开保存；晚到信号不覆盖无关的新任务</text><text x="280.0" y="197.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">运行事实与交付物</text><text x="280.0" y="229.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">Task / Run / Operation / 原 Release</text><text x="755.0" y="197.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">反馈关联与去重</text><text x="755.0" y="229.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">对象版本 / 来源 / 发生时间</text><text x="1210.0" y="197.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">经验候选</text><text x="1210.0" y="229.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">事实、范围与假设</text><text x="755.0" y="397.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">延迟业务 / 用户反馈</text><text x="755.0" y="429.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">按原身份追加修订，不抹掉历史</text><text x="970" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">可能晚到数小时或数天</text><text x="1210.0" y="622.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">改进制品候选</text><text x="1210.0" y="654.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">Prompt / Skill / Program / 数据</text><text x="755.0" y="622.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">独立评估与反例检查</text><text x="755.0" y="654.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">失败：拒绝、补证或人工裁定</text><text x="280.0" y="622.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">版本化发布</text><text x="280.0" y="654.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">有限灰度 + 回滚目标</text><text x="1300" y="445" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">选择承接层次</text><text x="380" y="420" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#426B9A" font-weight="400" text-anchor="middle">影响后续任务</text><text x="95" y="790" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">本案：CHG-11 已确认成功；v18 包含 E11；业务恢复验收尚未通过。</text><text x="95" y="817" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">PENDING 与 FAILED 不同；缺少完整结果的回执不能自动进入“成功任务”训练集。</text><text x="64" y="908" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">生成候选、核验事实、评分与发布分别承担责任；执行 Agent 的自我总结不是独立证据。</text></svg>
