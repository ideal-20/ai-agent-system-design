<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc"><title id="title">Skill 契约：先判断适用性，再执行方法并验证输出</title><desc id="desc">verify-change-outcome 为教学候选；READ_ONLY 必须由工具、凭据与出站策略实际落实</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#426B9A"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3F8079"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B0763A"/></marker><marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B9504A"/></marker><marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="1440" height="1010" fill="#FFFFFF"/><rect x="40" y="150" width="330" height="680" rx="12" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="430" y="150" width="970" height="680" rx="12" fill="#EDF3F9" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="7 5"/><path d="M 370 330 L 470 330" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 830 330 L 970 330" fill="none" stroke="#B0763A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#amber)"/><path d="M 650 380 L 650 480" fill="none" stroke="#426B9A" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M 830 530 L 970 530" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M 1145 580 L 1145 690" fill="none" stroke="#3F8079" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="470" y="285" width="360" height="95" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="970" y="285" width="350" height="95" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="470" y="480" width="360" height="100" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><rect x="970" y="480" width="350" height="100" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="470" y="690" width="850" height="90" rx="12" fill="#EAF4F2" stroke="#3F8079" stroke-width="1.4"/><rect x="40" y="910" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">Skill 契约：先判断适用性，再执行方法并验证输出</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">verify-change-outcome 为教学候选；READ_ONLY 必须由工具、凭据与出站策略实际落实</text><text x="64" y="188" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748B" font-weight="700" text-anchor="start">输入契约</text><text x="64" y="219" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">必须关联当前任务与权限</text><text x="70" y="300" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">Operation 身份</text><text x="70" y="380" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">实际生效时间</text><text x="70" y="460" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">资源与配置范围</text><text x="70" y="540" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">验收契约版本</text><text x="70" y="620" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#24364B" font-weight="700" text-anchor="start">当前授权与预算</text><text x="454" y="188" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">技能方法包与依赖边界</text><text x="454" y="219" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">提示模板、脚本和资料均有独立版本与资格</text><text x="650.0" y="324.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">触发 / 适用性检查</text><text x="650.0" y="356.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">目标含业务验收 + 操作已成功</text><text x="1145.0" y="324.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#B0763A" font-weight="700" text-anchor="middle">不适用或条件不足</text><text x="1145.0" y="356.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">退出 / 明确缺口 / 转交</text><text x="900.0" y="310" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#B0763A" font-weight="400" text-anchor="middle">不满足</text><text x="650.0" y="522.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="middle">受限读取与步骤选择</text><text x="650.0" y="554.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">config.read / metrics.query</text><text x="1145.0" y="522.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">确定性验收器</text><text x="1145.0" y="554.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">范围、时间、连续性与样本量</text><text x="895.0" y="742.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="middle">类型化输出：操作结果 + 验收状态 + 证据 + 缺口 + 下一步建议</text><text x="470" y="635" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">新的生产写入进入独立变更契约；技能不能自行修改验收阈值。</text><text x="64" y="948" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">组合技能时核对 Schema、资源、版本和时间语义；局部 PASS 不能替代完整父任务验收。</text></svg>
