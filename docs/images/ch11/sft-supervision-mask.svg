" font-size="26" fill="#64748B" font-weight="700" text-anchor="middle">0</text><text x="835.0" y="267.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">assistant</text><text x="835.0" y="299.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">读取验收窗口</text><text x="835" y="397" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">loss mask</text><text x="835" y="467" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#3F8079" font-weight="700" text-anchor="middle">1</text><text x="1065.0" y="267.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748B" font-weight="700" text-anchor="middle">tool</text><text x="1065.0" y="299.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">验收未通过</text><text x="1065" y="397" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">loss mask</text><text x="1065" y="467" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#64748B" font-weight="700" text-anchor="middle">0</text><text x="1295.0" y="267.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">assistant</text><text x="1295.0" y="299.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">等待并报告缺口</text><text x="1295" y="397" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="middle">loss mask</text><text x="1295" y="467" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" fill="#3F8079" font-weight="700" text-anchor="middle">1</text><text x="720" y="545" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#24364B" font-weight="700" text-anchor="middle">1：对选定 assistant / action Token 计算损失；0：可作为条件输入，但不作为目标。</text><text x="64" y="628" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#426B9A" font-weight="700" text-anchor="start">决策 A1：只看 A1 之前的前缀</text><text x="64" y="659" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">当时信息：用户目标、已有超时与原 Operation 身份</text><text x="70" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#426B9A" font-weight="700" text-anchor="start">允许目标：查询原 Operation</text><text x="70" y="755" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700" text-anchor="start">尚未返回的“操作已成功”不可提前注入。</text><text x="764" y="628" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="start">决策 A2：新增已到达的工具结果</text><text x="764" y="659" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="start">当时信息：原操作确认成功，尚未读取后续验收</text><text x="770" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#3F8079" font-weight="700" text-anchor="start">允许目标：读取独立业务验收窗口</text><text x="770" y="755" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B9504A" font-weight="700" text-anchor="start">后续“验收未通过”也不可反向泄漏给 A1。</text><text x="64" y="978" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">掩码只解决“监督谁”；消息顺序与前缀裁剪还要保证“当时能看见什么”。</text></svg>
