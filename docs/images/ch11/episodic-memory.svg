 x="586" y="76" font-size="10.5" text-anchor="middle" fill="currentColor">新增实例异常，存量实例正常</text><text x="586" y="94" font-size="10.5" text-anchor="middle" fill="currentColor" opacity=".65">其他案例（示意）</text><path d="M586 110 V129 H350 V143" stroke="#8292a5" fill="none" marker-end="url(#simple51arr)"/><rect x="216" y="148" width="268" height="42" rx="5" fill="#64748b" fill-opacity=".08" stroke="#94a3b8"/><text x="350" y="165" text-anchor="middle" font-weight="600" font-size="12.5" fill="currentColor">经验归纳</text><text x="350" y="181" text-anchor="middle" font-size="10.5" fill="currentColor">共性提取 · 条件识别 · 证据关联</text><path d="M350 190 V207" stroke="#8292a5" marker-end="url(#simple51arr)"/><rect x="65" y="212" width="570" height="70" rx="6" fill="#39877a" fill-opacity=".09" stroke="#39877a" stroke-opacity=".7"/><text x="350" y="233" text-anchor="middle" font-size="13.5" font-weight="600" fill="currentColor">Semantic Memory · 可复用经验</text><text x="350" y="252" text-anchor="middle" font-size="12" fill="currentColor">当异常集中于新增实例时，优先比较新旧实例之间的差异。</text><text x="350" y="270" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">配置一致性 · 网络访问路径 · 出口地址授权</text></svg>