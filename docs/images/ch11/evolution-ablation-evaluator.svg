-width="1.4"/><rect x="585" y="672" width="215" height="62" rx="5" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="820" y="672" width="215" height="62" rx="5" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="1055" y="672" width="320" height="62" rx="5" fill="#F7F9FC" stroke="#CBD5E1" stroke-width="1.4"/><rect x="65" y="790" width="1310" height="70" rx="12" fill="#FBF1E4" stroke="#B0763A" stroke-width="1.4"/><rect x="40" y="910" width="1360" height="62" rx="12" fill="#EDF3F9" stroke="#426B9A" stroke-width="1.4"/><text x="40" y="54" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">演进消融：固定评估条件，再区分改进来自哪里</text><text x="40" y="88" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">教学实验设计；不填未经运行的成功率，候选表现由独立任务报告给出</text><text x="720.0" y="169.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" fill="#3F8079" font-weight="700" text-anchor="middle">固定：任务来源组 + 环境 + 工具契约 + 业务验收 + evaluator 版本</text><text x="720.0" y="201.5" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" fill="#64748B" font-weight="400" text-anchor="middle">确认集未参与搜索；评估器修订后，基线与候选在同一新规则下重算</text><text x="197.5" y="312" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">候选 / 对照</text><text x="457.5" y="312" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">输入与 Prompt</text><text x="692.5" y="312" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">程序门禁</text><text x="927.5" y="312" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">模型参数</text><text x="1215.0" y="312" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#426B9A" font-weight="700" text-anchor="middle">需要观察什么</text><text x="197.5" y="398" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="middle">基线</text><text x="457.5" y="398" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">原版本</text><text x="692.5" y="398" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">原版本</text><text x="927.5" y="398" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">原版本</text><text x="1215.0" y="398" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">原始任务表现与成本</text><text x="197.5" y="476" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="middle">A：输入改进</text><text x="457.5" y="476" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="400" text-anchor="middle">改变</text><text x="692.5" y="476" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定</text><text x="927.5" y="476" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定</text><text x="1215.0" y="476" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">错误候选是否减少</text><text x="197.5" y="554" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="middle">B：门禁改进</text><text x="457.5" y="554" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定</text><text x="692.5" y="554" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="400" text-anchor="middle">改变</text><text x="927.5" y="554" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定</text><text x="1215.0" y="554" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">错误终态是否阻止</text><text x="197.5" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="middle">C：参数改进</text><text x="457.5" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定</text><text x="692.5" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">固定</text><text x="927.5" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="400" text-anchor="middle">改变</text><text x="1215.0" y="632" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">跨表达判断是否改善</text><text x="197.5" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#24364B" font-weight="700" text-anchor="middle">A+B / B+C</text><text x="457.5" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">按组合改变</text><text x="692.5" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">按组合改变</text><text x="927.5" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">按组合改变</text><text x="1215.0" y="710" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#64748B" font-weight="400" text-anchor="middle">结果、拒绝、人工负担</text><text x="90" y="820" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#B0763A" font-weight="700" text-anchor="start">同时观察模型候选质量和系统最终效果：门禁拦截成功，不代表模型已经理解。</text><text x="90" y="846" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#64748B" font-weight="400" text-anchor="start">正向完成、迁移任务、边界反例与无谓等待均须覆盖；组合收益未必等于单项收益相加。</text><text x="64" y="948" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#426B9A" font-weight="700" text-anchor="start">记录总候选数与搜索成本；开发集胜出只说明选择结果，独立确认才能支持发布判断。</text></svg>
